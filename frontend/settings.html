<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Settings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ============== SETTINGS (DB 0131 / 0132) ==============
       Two things the office sets, per company: the working-hours RULE, as
       dated rows (a rule is added from a date and never rewritten once in
       force — the past keeps its rows), and the PAYROLL MONTHS (a closed
       month takes no change and is read from its snapshot until a Super
       Administrator reopens it). Quiet by design: small tables, an inline
       confirm, the database's own message when it says no. */
    .st-section { margin: 0 0 28px; }
    .st-section h2 { font-size: 1.15rem; margin: 0 0 10px; }
    .st-card { background: var(--card, #fff); border: 1px solid var(--line, #d9e0ea); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
    .st-card h3 { font-size: 1rem; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .st-card h3 .muted { font-weight: 400; color: var(--ink-3, #5a6578); font-size: 0.9rem; }
    .st-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .st-table th, .st-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line, #e3e8ef); vertical-align: top; }
    .st-table th { font-weight: 700; color: var(--ink-3, #5a6578); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .st-table td.n { white-space: nowrap; }
    .st-inforce td { font-weight: 700; }
    .st-tag { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 0.78rem; background: var(--brand-soft, #e8eef7); color: var(--brand-ink, #0f2a54); margin-left: 6px; font-weight: 700; }
    .st-tag.grey { background: #eceff3; color: #5a6578; }
    .st-tag.ok { background: #e4f3e8; color: #1f6b3a; }
    .st-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .st-confirm { border: 1px solid var(--line, #d9e0ea); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; background: var(--card-2, #f6f8fb); }
    .st-confirm p { margin: 0 0 8px; }
    .st-confirm input[type=text] { width: min(420px, 100%); min-height: 40px; padding: 6px 10px; border: 1px solid var(--line, #c9d1de); border-radius: 8px; font: inherit; }
    .st-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; margin: 10px 0 6px; }
    .st-form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--ink-3, #5a6578); }
    .st-form input, .st-form select { min-height: 40px; padding: 6px 8px; border: 1px solid var(--line, #c9d1de); border-radius: 8px; font: inherit; background: #fff; }
    .st-form .wide { grid-column: 1 / -1; }
    .st-status { margin: 8px 0 0; font-size: 0.92rem; }
    .st-status.bad { color: var(--danger-ink, #9b1c1c); }
    .st-status.ok { color: #1f6b3a; }
    .st-note { color: var(--ink-3, #5a6578); font-size: 0.85rem; }
    .btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <div class="page-eyebrow">Administration</div>
    <h1>Settings</h1>
    <p class="page-caption">The working-hours rule and the payroll months, per company. A rule is added from a date and is never rewritten once in force. A closed month takes no change and keeps its figures until a Super Administrator reopens it.</p>

    <div id="error"></div>

    <section class="st-section" id="rules-section">
      <h2>Work Rules</h2>
      <div id="rules"></div>
    </section>

    <section class="st-section" id="periods-section">
      <h2>Payroll Months</h2>
      <div id="periods"></div>
    </section>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    var esc = UI.esc;

    var S = { rules: [], periods: [], manage: false, superAdmin: false, open: {}, today: "", firstMonth: "2026-10-01" };
    var COMPANY_NAMES = { "HF-BP": "HF Bored Piles", "Hai Fu": "Hai Fu" };
    var COMPANY_ORDER = ["HF-BP", "Hai Fu"];

    function companyName(code) { return COMPANY_NAMES[code] || code || ""; }
    function dateWord(iso) {
      if (!iso) return "";
      return new Date(String(iso).slice(0, 10) + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    }
    function stampWord(iso) {
      if (!iso) return "";
      var d = new Date(iso);
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kuala_Lumpur" }) +
             ", " + d.toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Asia/Kuala_Lumpur" }).toUpperCase();
    }
    function monthWord(iso) {
      return new Date(String(iso).slice(0, 7) + "-01T00:00:00Z").toLocaleDateString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
    }
    function hm(mins) { var m = Number(mins) || 0, h = Math.floor(m / 60), r = m % 60; return (h ? h + "h" : "") + (h && r ? " " : "") + (r ? r + "m" : "") || "0h"; }
    function modeWord(m) { return m === "clock" ? "By the clock" : "By the total"; }
    function roundWord(n) { n = Number(n); return n <= 1 ? "To the minute" : n + " min"; }
    function timeVal(t) { return String(t || "").slice(0, 5); }           // "08:30:00" -> "08:30"
    function ymd(d) { return d.toISOString().slice(0, 10); }
    function addMonths(iso, n) { var d = new Date(String(iso).slice(0, 7) + "-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return ymd(d); }
    function companies() {
      var seen = {}; S.rules.forEach(function (r) { seen[r.company_code] = true; }); S.periods.forEach(function (p) { seen[p.company_code] = true; });
      var list = COMPANY_ORDER.filter(function (c) { return seen[c]; });
      Object.keys(seen).forEach(function (c) { if (list.indexOf(c) < 0) list.push(c); });
      return list.length ? list : COMPANY_ORDER;
    }

    // ---------------------------------------------------------------- rules
    function ruleRow(r, inForce) {
      var future = String(r.effective_from) > S.today;
      return '<tr class="' + (inForce ? "st-inforce" : "") + '" data-rule="' + esc(r.rule_id) + '">' +
        '<td class="n">' + esc(dateWord(r.effective_from)) + (inForce ? '<span class="st-tag">In Force</span>' : future ? '<span class="st-tag grey">From Then</span>' : "") + "</td>" +
        "<td>" + esc(modeWord(r.mode)) + "</td>" +
        '<td class="n">' + esc(Dash.clockWord(r.day_start)) + " – " + esc(Dash.clockWord(r.day_end)) + "</td>" +
        '<td class="n">' + esc(Number(r.grace_minutes) + " min") + "</td>" +
        '<td class="n">' + esc(hm(r.rest_minutes) + " after " + hm(r.rest_gate_minutes)) + "</td>" +
        '<td class="n">' + esc(hm(r.normal_minutes)) + "</td>" +
        '<td class="n">' + esc(roundWord(r.round_minutes)) + "</td>" +
        '<td class="n">' + esc(Number(r.overlong_hours) + " h") + "</td>" +
        '<td class="n">' + esc(Number(r.question_hours) + " h") + "</td>" +
        "<td>" + esc(r.note || "") + "</td>" +
        '<td class="n">' + (future && S.manage ? '<button type="button" class="btn small btn-danger" data-act="withdraw" data-rule="' + esc(r.rule_id) + '">Withdraw</button>' : "") + "</td>" +
      "</tr>";
    }
    function ruleForm(code) {
      var u = Dash.ruleFor(S.rules, code, S.today) || {};
      var next = addMonths(S.today, 1);
      var id = "f-" + code.replace(/[^A-Za-z0-9]/g, "");
      function opt(v, label, cur) { return '<option value="' + v + '"' + (String(cur) === String(v) ? " selected" : "") + ">" + label + "</option>"; }
      return '<form class="st-form" id="' + id + '" data-company="' + esc(code) + '" autocomplete="off">' +
        '<label>From <input type="date" name="effective_from" value="' + next + '" min="' + String(S.today).slice(0, 7) + '-01" required></label>' +
        '<label>Rule <select name="mode">' + opt("clock", "By the clock", u.mode || "clock") + opt("total", "By the total", u.mode || "clock") + "</select></label>" +
        '<label>Day starts <input type="time" name="day_start" value="' + esc(timeVal(u.day_start) || "08:30") + '" required></label>' +
        '<label>Day ends <input type="time" name="day_end" value="' + esc(timeVal(u.day_end) || "17:00") + '" required></label>' +
        '<label>Grace at the start (min) <input type="number" name="grace_minutes" min="0" max="120" value="' + esc(u.grace_minutes !== undefined ? u.grace_minutes : 10) + '" required></label>' +
        '<label>Rest (min) <input type="number" name="rest_minutes" min="0" max="600" value="' + esc(u.rest_minutes !== undefined ? u.rest_minutes : 60) + '" required></label>' +
        '<label>Rest comes off after (min) <input type="number" name="rest_gate_minutes" min="0" max="1440" value="' + esc(u.rest_gate_minutes !== undefined ? u.rest_gate_minutes : 360) + '" required></label>' +
        '<label>Day length, by the total (min) <input type="number" name="normal_minutes" min="1" max="1440" value="' + esc(u.normal_minutes !== undefined ? u.normal_minutes : 450) + '" required></label>' +
        '<label>Round each day down to <select name="round_minutes">' + [1, 5, 10, 15, 30, 60].map(function (v) { return opt(v, v === 1 ? "The minute" : v + " min", u.round_minutes !== undefined ? u.round_minutes : 30); }).join("") + "</select></label>" +
        '<label>Long-shift line (h) <input type="number" name="overlong_hours" min="8" max="72" step="0.5" value="' + esc(u.overlong_hours !== undefined ? Number(u.overlong_hours) : 20) + '" required></label>' +
        '<label>Phone asks after (h) <input type="number" name="question_hours" min="1" max="72" step="0.5" value="' + esc(u.question_hours !== undefined ? Number(u.question_hours) : 16) + '" required></label>' +
        '<label class="wide">Note <input type="text" name="note" maxlength="500" placeholder="Why this rule, in a line"></label>' +
        '<div class="wide st-actions"><button type="submit" class="btn">Add Rule</button><button type="button" class="btn small" data-act="cancel-rule">Cancel</button>' +
        '<span class="st-note">A rule starts on a day of the current month or later and is never rewritten once in force; a rule that has not started yet may be changed or withdrawn.</span></div>' +
        '<p class="st-status wide" id="' + id + '-status"></p>' +
      "</form>";
    }
    function renderRules() {
      var host = document.getElementById("rules");
      if (!S.rules.length) { host.innerHTML = UI.empty("No rule rows yet. The database prices every day by the rule in force; add the first rule here."); return; }
      host.innerHTML = companies().map(function (code) {
        var rows = S.rules.filter(function (r) { return r.company_code === code; })
                          .sort(function (a, b) { return String(b.effective_from).localeCompare(String(a.effective_from)); });
        var u = Dash.ruleFor(S.rules, code, S.today);
        return '<div class="st-card" data-company="' + esc(code) + '">' +
          "<h3>" + esc(companyName(code)) + (u ? '<span class="muted">in force: ' + esc(modeWord(u.mode)) + ", " + esc(Dash.clockWord(u.day_start)) + " – " + esc(Dash.clockWord(u.day_end)) + ", " + esc(Number(u.grace_minutes)) + " min grace, " + esc(hm(u.rest_minutes)) + " rest, rounded to " + esc(roundWord(u.round_minutes).toLowerCase()) + ", line " + esc(Number(u.overlong_hours)) + " h</span>" : "") + "</h3>" +
          '<div class="table-wrap"><table class="st-table"><thead><tr><th>From</th><th>Rule</th><th>Day</th><th>Grace</th><th>Rest</th><th>Day length</th><th>Round</th><th>Line</th><th>Phone asks</th><th>Note</th><th></th></tr></thead><tbody>' +
          rows.map(function (r) { return ruleRow(r, u && r.rule_id === u.rule_id); }).join("") +
          "</tbody></table></div>" +
          (S.manage ? (S.open["rule:" + code] ? ruleForm(code) : '<div class="st-actions"><button type="button" class="btn small" data-act="new-rule" data-company="' + esc(code) + '">New Rule From…</button></div>') : "") +
        "</div>";
      }).join("");
    }

    // ---------------------------------------------------------------- periods
    function monthsFor() {
      var list = [], m = String(S.today).slice(0, 7) + "-01";
      while (m >= S.firstMonth) { list.push(m); m = addMonths(m, -1); }
      return list;
    }
    function periodOf(code, month) {
      return S.periods.filter(function (p) { return p.company_code === code && String(p.period_month).slice(0, 10) === month; })[0] || null;
    }
    function periodRow(code, month) {
      var p = periodOf(code, month), cur = month === String(S.today).slice(0, 7) + "-01", key = code + "|" + month;
      var closed = !!(p && p.status === "closed");
      var status = closed ? '<span class="st-tag">Closed</span> on ' + esc(stampWord(p.closed_at)) + (p.closed_by_name ? " by " + esc(p.closed_by_name) : "") + (p.note ? ' <span class="st-note">— ' + esc(p.note) + "</span>" : "")
                 : p && p.status === "open" ? '<span class="st-tag ok">Open</span> reopened ' + esc(stampWord(p.reopened_at)) + (p.reopened_by_name ? " by " + esc(p.reopened_by_name) : "") + (p.note ? ' <span class="st-note">— ' + esc(p.note) + "</span>" : "")
                 : cur ? '<span class="st-tag ok">Open</span> <span class="st-note">not over yet</span>' : '<span class="st-tag ok">Open</span>';
      var figures = closed ? esc(p.days + " day" + (p.days === 1 ? "" : "s") + " · " + hm(p.working_minutes) + " normal · " + hm(p.ot_minutes) + " overtime") : "";
      var act = "";
      if (closed && S.superAdmin) act = '<button type="button" class="btn small" data-act="reopen" data-company="' + esc(code) + '" data-month="' + month + '">Reopen</button>';
      else if (!closed && !cur && S.manage) act = '<button type="button" class="btn small" data-act="close" data-company="' + esc(code) + '" data-month="' + month + '">Close</button>';
      var confirm = S.open[key] ? confirmBox(code, month, closed) : "";
      return '<tr data-period="' + esc(key) + '"><td class="n">' + esc(monthWord(month)) + "</td><td>" + status + "</td><td>" + figures + '</td><td class="n">' + act + "</td></tr>" +
             (confirm ? '<tr><td colspan="4">' + confirm + "</td></tr>" : "");
    }
    function confirmBox(code, month, closed) {
      var key = code + "|" + month, id = "c-" + key.replace(/[^A-Za-z0-9]/g, "");
      if (closed) {
        return '<div class="st-confirm" id="' + id + '"><p>Reopen <b>' + esc(monthWord(month)) + "</b> for " + esc(companyName(code)) + "? Its figures move again until it is closed. Say why.</p>" +
          '<div class="st-actions"><input type="text" id="' + id + '-why" maxlength="500" placeholder="Reason"> <button type="button" class="btn" data-act="reopen-go" data-company="' + esc(code) + '" data-month="' + month + '">Reopen ' + esc(monthWord(month)) + '</button> <button type="button" class="btn small" data-act="cancel" data-key="' + esc(key) + '">Cancel</button></div>' +
          '<p class="st-status" id="' + id + '-status"></p></div>';
      }
      return '<div class="st-confirm" id="' + id + '"><p>Close <b>' + esc(monthWord(month)) + "</b> for " + esc(companyName(code)) + "? Every day must have its figure; after the close no hours or shifts of this month can be changed until a Super Administrator reopens it.</p>" +
        '<div class="st-actions"><input type="text" id="' + id + '-note" maxlength="500" placeholder="Note (optional)"> <button type="button" class="btn" data-act="close-go" data-company="' + esc(code) + '" data-month="' + month + '">Close ' + esc(monthWord(month)) + '</button> <button type="button" class="btn small" data-act="cancel" data-key="' + esc(key) + '">Cancel</button></div>' +
        '<p class="st-status" id="' + id + '-status"></p></div>';
    }
    function renderPeriods() {
      var host = document.getElementById("periods");
      host.innerHTML = companies().map(function (code) {
        return '<div class="st-card" data-company="' + esc(code) + '"><h3>' + esc(companyName(code)) + "</h3>" +
          '<div class="table-wrap"><table class="st-table"><thead><tr><th>Month</th><th>Status</th><th>Figures at the close</th><th></th></tr></thead><tbody>' +
          monthsFor().map(function (m) { return periodRow(code, m); }).join("") +
          "</tbody></table></div></div>";
      }).join("");
    }
    function render() { renderRules(); renderPeriods(); }

    // ---------------------------------------------------------------- the writes
    function statusEl(id) { return document.getElementById(id); }
    function sayStatus(el, ok, text, link) {
      if (!el) return;
      el.className = "st-status " + (ok ? "ok" : "bad");
      el.innerHTML = esc(text) + (link ? ' <a href="' + esc(link.href) + '" class="section-link">' + esc(link.label) + "</a>" : "");
    }
    async function reload() {
      var got = await Promise.all([Dash.getWorkRules(true), Dash.getPayrollPeriods()]);
      S.rules = got[0] || []; S.periods = got[1] || [];
      render();
    }
    async function doClose(code, month) {
      var id = "c-" + (code + "|" + month).replace(/[^A-Za-z0-9]/g, "");
      var note = (document.getElementById(id + "-note") || {}).value || "";
      var st = statusEl(id + "-status");
      sayStatus(st, true, "Closing…");
      try {
        var v = await Dash.closePayrollMonth(code, month, note);
        if (v && v.ok) { delete S.open[code + "|" + month]; await reload(); return; }
        var code2 = v && v.code;
        sayStatus(st, false, (v && v.message) || ("Not closed (" + code2 + ")."),
                  code2 === "unpriced_days" ? { href: "exceptions.html", label: "See them" } : null);
      } catch (e) { sayStatus(st, false, (e && e.message) || String(e)); }
    }
    async function doReopen(code, month) {
      var id = "c-" + (code + "|" + month).replace(/[^A-Za-z0-9]/g, "");
      var why = ((document.getElementById(id + "-why") || {}).value || "").trim();
      var st = statusEl(id + "-status");
      if (why.length < 3) { sayStatus(st, false, "Say why the month is reopened."); return; }
      sayStatus(st, true, "Reopening…");
      try {
        var v = await Dash.reopenPayrollMonth(code, month, why);
        if (v && v.ok) { delete S.open[code + "|" + month]; await reload(); return; }
        sayStatus(st, false, (v && v.message) || ("Not reopened (" + (v && v.code) + ")."));
      } catch (e) { sayStatus(st, false, (e && e.message) || String(e)); }
    }
    async function doAddRule(form) {
      var f = form.elements, code = form.getAttribute("data-company");
      var st = statusEl(form.id + "-status");
      var r = { company_code: code, effective_from: f.effective_from.value, mode: f.mode.value,
                day_start: f.day_start.value, day_end: f.day_end.value,
                rest_minutes: Number(f.rest_minutes.value), grace_minutes: Number(f.grace_minutes.value),
                round_minutes: Number(f.round_minutes.value), overlong_hours: Number(f.overlong_hours.value),
                question_hours: Number(f.question_hours.value), normal_minutes: Number(f.normal_minutes.value),
                rest_gate_minutes: Number(f.rest_gate_minutes.value), note: f.note.value.trim() };
      if (!r.effective_from || !r.day_start || !r.day_end) { sayStatus(st, false, "Give the date and both times."); return; }
      if (r.day_end <= r.day_start) { sayStatus(st, false, "The day must end after it starts."); return; }
      sayStatus(st, true, "Saving…");
      try {
        var v = await Dash.setWorkRule(r);
        if (v && v.ok) { delete S.open["rule:" + code]; await reload(); return; }
        sayStatus(st, false, (v && v.message) || ("Not saved (" + (v && v.code) + ")."));
      } catch (e) { sayStatus(st, false, (e && e.message) || String(e)); }
    }
    async function doWithdraw(ruleId, btn) {
      var row = btn.closest("tr");
      if (!btn.getAttribute("data-sure")) { btn.setAttribute("data-sure", "1"); btn.textContent = "Withdraw — sure?"; return; }
      btn.disabled = true;
      try {
        var v = await Dash.deleteWorkRule(ruleId);
        if (v && v.ok) { await reload(); return; }
        document.getElementById("error").innerHTML = UI.errorBanner((v && v.message) || ("Not withdrawn (" + (v && v.code) + ")."));
      } catch (e) { document.getElementById("error").innerHTML = UI.errorBanner((e && e.message) || String(e)); }
      btn.disabled = false;
    }

    document.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-act]");
      if (!b) return;
      var act = b.getAttribute("data-act"), code = b.getAttribute("data-company"), month = b.getAttribute("data-month");
      if (act === "close" || act === "reopen") { S.open[code + "|" + month] = true; renderPeriods(); }
      else if (act === "cancel") { delete S.open[b.getAttribute("data-key")]; renderPeriods(); }
      else if (act === "close-go") doClose(code, month);
      else if (act === "reopen-go") doReopen(code, month);
      else if (act === "new-rule") { S.open["rule:" + code] = true; renderRules(); }
      else if (act === "cancel-rule") { delete S.open["rule:" + b.closest("form").getAttribute("data-company")]; renderRules(); }
      else if (act === "withdraw") doWithdraw(b.getAttribute("data-rule"), b);
    });
    document.addEventListener("submit", function (ev) {
      var form = ev.target.closest("form.st-form");
      if (!form) return;
      ev.preventDefault();
      doAddRule(form);
    });

    window.onShellReady = async function () {
      S.today = Dash.todayKL();
      S.manage = Dash.can("settings.manage");
      document.getElementById("rules").innerHTML = UI.empty("Loading…");
      document.getElementById("periods").innerHTML = UI.empty("Loading…");
      try {
        var acc = await Dash.getMyAccess();
        S.superAdmin = !!(acc && acc.ok && acc.access && acc.access.access_profile_code === "super_admin");
      } catch (e) { S.superAdmin = false; }
      try {
        await reload();
      } catch (e) {
        document.getElementById("error").innerHTML = UI.errorBanner((e && e.message) || String(e));
        document.getElementById("rules").innerHTML = ""; document.getElementById("periods").innerHTML = "";
      }
    };
  </script>

</body>
</html>
