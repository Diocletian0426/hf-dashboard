<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Dashboard — Projects</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">
    <h1>Projects</h1>
    <p class="page-caption">
      Every project, any status — search by name or click a card to open its hub.
      <strong>Work vs time</strong> compares % of piles done against % of contract
      time used; "behind" means time is running out faster than piles are going in.
    </p>

    <div class="filter-wrap">
      <input id="p-search" class="filter-box" type="search"
             placeholder="Search code, name or client…" autocomplete="off" />
    </div>
    <div class="mp-controls" id="p-chips"></div>

    <div id="cards" class="pcards"></div>
    <div id="empty"></div>
    <div id="error"></div>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    // Project DIRECTORY: the master list is v_project_directory (every project,
    // both business lines); BP progress metrics (v_project_pulse) join on top
    // where they exist. Cards open the project hub.
    var DIR = { rows: [], progById: {}, qtyById: {}, status: "active", q: "" };

    // quantities line numbers (0053 rollup): null -> 0 (nothing cast yet)
    function fmtQ(v, dp) {
      return Number(v || 0).toLocaleString("en-MY",
        { minimumFractionDigits: dp, maximumFractionDigits: dp });
    }

    function statusBadge(s) {
      var cls = s === "active" ? "badge-approved"
              : s === "completed" ? "badge-gray"
              : "badge-pending";
      return UI.badge(s, cls);
    }

    // compare % work done vs % contract time used (BP projects with dates)
    function workVsTime(p) {
      if (!p) return "";
      if (p.project_status === "completed") return UI.badge("completed", "badge-approved");
      if (p.project_status === "cancelled") return UI.badge("cancelled", "badge-gray");
      var elapsed = p.days_elapsed, remaining = p.days_remaining;
      if (elapsed === null || elapsed === undefined || remaining === null || remaining === undefined)
        return "";

      var totalDays = elapsed + Math.max(remaining, 0);
      if (totalDays <= 0) return "";
      var timePct = Math.min(100, Math.round(elapsed / totalDays * 100));
      if (remaining < 0) timePct = 100;
      var workPct = Number(p.progress_pct) || 0;
      var diff = workPct - timePct;

      var label, cls;
      if (remaining < 0)      { label = "OVERDUE";    cls = "badge-critical"; }
      else if (diff >= 10)    { label = "Ahead";      cls = "badge-approved"; }
      else if (diff >= -10)   { label = "On track";   cls = "badge-gray"; }
      else if (diff >= -25)   { label = "Behind";     cls = "badge-medium"; }
      else                    { label = "Far behind"; cls = "badge-critical"; }

      return '<span class="badge ' + cls + '" title="work ' + Math.round(workPct) +
             "% done · " + timePct + '% of contract time used">' + label + "</span>";
    }

    function matches(r) {
      if (DIR.status === "active" && r.status !== "active") return false;
      if (DIR.status === "completed" && r.status !== "completed") return false;
      if (DIR.status === "others" && (r.status === "active" || r.status === "completed")) return false;
      if (DIR.q) {
        var prog = DIR.progById[r.project_id];
        var hay = ((r.project_code || "") + " " + (r.project_name || "") + " " +
                   (prog && prog.client_name ? prog.client_name : "")).toLowerCase();
        if (hay.indexOf(DIR.q) === -1) return false;
      }
      return true;
    }

    function scopeChips(r) {
      var out = [];
      if (r.has_bored_scope) out.push('<span class="chip chip-tag" title="Bored piling scope">BP</span>');
      if (r.has_sheet_scope) out.push('<span class="chip chip-tag" title="Sheet piling scope">SP</span>');
      return out.join(" ");
    }

    function cardHtml(r) {
      var prog = DIR.progById[r.project_id];
      var head = '<div class="pcard-head"><strong>' + UI.escHtml(r.project_code || "?") +
                 "</strong> — " + UI.escHtml(r.project_name || "") + "</div>";
      var statusLine = '<div class="pcard-line">' + statusBadge(r.status) + " " + scopeChips(r) +
                       (prog ? " " + workVsTime(prog) : "") + "</div>";
      var client = prog && prog.client_name
        ? '<div class="pcard-line muted-line">' + UI.escHtml(prog.client_name) + "</div>" : "";

      var body = "";
      var chips = [];
      if (prog) {
        var pct = Math.max(0, Math.min(100, Number(prog.progress_pct) || 0));
        var total = prog.total_piles_planned || prog.total_piles_registered || 0;
        body = '<div class="pcard-line"><span class="bar" style="flex:1"><span style="width:' +
               pct + '%"></span></span><span>' + pct + "%</span></div>" +
               '<div class="pcard-line muted-line">' + (prog.piles_completed || 0) + " of " +
               total + " piles cast</div>";

        // design-vs-consumed quantities (0053) — "in the ground / design total"
        var qty = DIR.qtyById[r.project_id];
        if (qty && (qty.design_concrete_m3 !== null || qty.design_steel_t !== null)) {
          var qbits = [];
          if (qty.design_concrete_m3 !== null)
            qbits.push("concrete " + fmtQ(qty.committed_concrete_m3, 0) + " / " +
                       fmtQ(qty.design_concrete_m3, 0) + " m³");
          if (qty.design_steel_t !== null)
            qbits.push("steel " + fmtQ(qty.committed_steel_t, 1) + " / " +
                       fmtQ(qty.design_steel_t, 1) + " t");
          if (qty.piles_with_steel < qty.piles_registered)
            qbits.push('<span class="stale-warn">steel spec partial</span>');
          body += '<div class="pcard-line muted-line" title="in the ground (cast piles at ' +
                  'design quantities) / design total — full breakdown on the project hub">' +
                  qbits.join(" · ") + "</div>";
        }

        if (prog.total_tests_required > 0)
          chips.push('<span class="chip">Tests ' + (prog.tests_completed || 0) + "/" +
                     prog.total_tests_required + "</span>");
        var dl = prog.days_remaining;
        if (dl !== null && dl !== undefined && r.status === "active") {
          chips.push(dl < 0
            ? '<span class="chip chip-bad">' + Math.abs(dl) + " days OVER target</span>"
            : '<span class="chip">' + dl + " days left</span>");
        }
        if (prog.start_date)
          chips.push('<span class="chip">' + UI.dstr(prog.start_date) + " → " +
                     UI.dstr(prog.target_end_date) + "</span>");
      } else {
        body = '<div class="pcard-line muted-line">Hai Fu sheet piling — tracked outside the ' +
               "bored-piling dashboard.</div>";
      }

      var inner = head + statusLine + client + body +
                  (chips.length ? '<div class="pcard-chips">' + chips.join(" ") + "</div>" : "");

      // only BP projects have a hub page to open
      if (prog) {
        return '<a class="pcard" href="project.html?project=' + r.project_id + '">' + inner + "</a>";
      }
      return '<div class="pcard" style="cursor:default">' + inner + "</div>";
    }

    function chipBtn(key, label, count) {
      return '<button type="button" data-status="' + key + '"' +
             (DIR.status === key ? ' class="active"' : "") + ">" +
             label + " (" + count + ")</button>";
    }

    function render() {
      var counts = { all: DIR.rows.length, active: 0, completed: 0, others: 0 };
      DIR.rows.forEach(function (r) {
        if (r.status === "active") counts.active++;
        else if (r.status === "completed") counts.completed++;
        else counts.others++;
      });
      document.getElementById("p-chips").innerHTML =
        "<span>Show:</span>" +
        chipBtn("active", "Active", counts.active) +
        chipBtn("completed", "Completed", counts.completed) +
        chipBtn("others", "Others", counts.others) +
        chipBtn("all", "All", counts.all);

      var list = DIR.rows.filter(matches);
      document.getElementById("cards").innerHTML = list.map(cardHtml).join("");
      document.getElementById("empty").innerHTML = list.length ? "" :
        UI.empty("No projects match.",
                 DIR.q ? "Try a shorter search, or switch the status filter." :
                         "Switch the status filter above.");
    }

    window.onShellReady = async function () {
      document.getElementById("cards").innerHTML = UI.empty("Loading…");
      try {
        var res = await Promise.all([Dash.getProjectDirectory(), Dash.getProjects(),
                                     Dash.getProjectQuantities()]);
        DIR.rows = res[0].slice().sort(function (a, b) {
          var aa = a.status === "active" ? 0 : 1, bb = b.status === "active" ? 0 : 1;
          if (aa !== bb) return aa - bb;
          return String(a.project_code || "").localeCompare(String(b.project_code || ""));
        });
        res[1].forEach(function (p) { DIR.progById[p.project_id] = p; });
        res[2].forEach(function (q) { DIR.qtyById[q.project_id] = q; });
        if (!DIR.rows.some(function (r) { return r.status === "active"; })) DIR.status = "all";
        render();

        document.getElementById("p-chips").addEventListener("click", function (ev) {
          var b = ev.target.closest("button[data-status]");
          if (!b) return;
          DIR.status = b.getAttribute("data-status");
          render();
        });
        document.getElementById("p-search").addEventListener("input", function () {
          DIR.q = this.value.trim().toLowerCase();
          render();
        });
      } catch (e) {
        document.getElementById("cards").innerHTML = "";
        document.getElementById("error").innerHTML = UI.errorBanner(e.message || e);
      }
    };
  </script>
</body>
</html>
