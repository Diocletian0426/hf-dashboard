<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Dashboard — Bore logs</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= BORE LOG REVIEW (0073 / 0074) =================
         Two screens in one page, switched on ?id= (the piles.html precedent):

           bore-logs.html         the inbox — what is waiting to be checked,
                                  plus the upload box for office scans
           bore-logs.html?id=…    the review screen — original document on the
                                  left, the values on the right

         WHY THIS EXISTS: bore_logs has been empty by design since 0024 (a row
         there means a real bore log was captured, and 'confirmed' is what makes
         v_pile_register publish the verified figures the claims are built on).
         There was no way to capture one. This is that way.

         NO AI IS INVOLVED ON THIS PAGE. A person uploads the scan, reads it,
         types the values, and confirms. If the WhatsApp bot pre-fills a draft
         it lands in exactly the same review screen — the reviewer's job and
         this code are identical either way.

         The buttons here are convenience. Every read and write is re-checked
         by the database (bore_logs.view / .create / .edit / .approve, all
         project-scoped, seeded back in 0059). -->

    <div class="page-eyebrow">Bore logs</div>
    <h1 id="bl-title">Bore logs to check</h1>
    <p id="bl-sub" class="page-caption"></p>

    <div id="error"></div>
    <div id="ok"></div>

    <div id="view"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    var esc = UI.esc, escHtml = UI.escHtml, dstr = UI.dstr;

    var BL = {
      id: null,          // submission being reviewed, or null for the inbox
      rows: [],          // inbox rows
      sub: null,         // the submission under review
      piles: [],         // pile picker
      statusFilter: "open",
      zoom: 1,
      rot: 0,
      page: 0,           // which storage_path is showing
      over: {},          // which length rows are overridden (agreed, not calculated)
      len: {}            // what has been typed into them, kept across re-renders
    };

    /* ------------------------------------------------------------------
       The draft's shape. Keys are bore_logs COLUMN NAMES exactly — 0074
       casts them straight across on approval, so a typo here becomes a
       silently-dropped value. Kept as data so rendering the form and
       reading it back can never drift apart.
       ------------------------------------------------------------------ */

    /* [key, label, unit, required] — the unit is its OWN column on screen, not
       part of the label text. Two reasons: the labels stop being long and
       ragged, and the units line up down the section the same way the numbers
       do.

       `required` draws the red asterisk, and it means ONE thing precisely:
       the database will refuse to confirm without it. It is not a copy of the
       column's NOT NULL setting — only pile_id and review_status are NOT NULL
       on bore_logs, and neither is a box on this form, so that reading would
       mark nothing. Keep this list and fn_validate_bore_log in step: an
       asterisk on a field the database lets through is a lie, and a required
       field with no asterisk is a trap. */

    // Levels are mRL: higher number = higher up. Going DOWN the pile the
    // numbers DECREASE — that one sentence is most of the validation, and it
    // is why these are stacked in sheet order: read as a column, a missing
    // minus sign or a transposed digit shows up without reading the labels.
    // Cut-off and toe are required (0076): every verified figure the pile
    // register publishes is worked out from them — pile length, cored socket
    // and theoretical concrete all subtract the toe level.
    var LEVELS = [
      ["top_of_casing_level_m",   "Top of casing (TOC)",  "mRL"],
      ["piling_platform_level_m", "Platform level (EGL)", "mRL"],
      ["cut_off_level_m",         "Cut-off level",        "mRL", true],
      ["rock_socketing_level_m",  "Top of rock socket",   "mRL"],
      ["toe_level_m",             "Toe level",            "mRL", true]
    ];

    var TIMES = [
      ["boring_soil_started_at", "Soil boring started"],
      ["boring_soil_ended_at",   "Soil boring finished"],
      ["boring_rock_started_at", "Rock boring started"],
      ["boring_rock_ended_at",   "Rock boring finished"]
    ];

    /* The three lengths that matter commercially. All are ARITHMETIC on the
       levels above — [key, label, unit, [upper level, lower level]] — and the
       box is left EMPTY in the normal case, which is what tells the database to
       use the calculation.

       Typing a number overrides it, and that agreed figure then wins
       everywhere: the pile register, the claims, the bot. That is the point —
       sometimes the figure that counts is what was agreed on site, not what the
       levels give. It is also why the database warns whenever an agreed figure
       differs from the calculation, and says both numbers out loud.

       Two of these three already existed and were already feeding the claims,
       invisibly: v_pile_register has published verified_pile_length_m and
       verified_cored_socket_m since 0023. Bored depth was worked out inside the
       validator and thrown away. This makes all three visible and correctable. */
    var DERIVED = [
      ["agreed_bored_depth_m",        "Bored depth", "m",
        ["piling_platform_level_m", "toe_level_m"]],
      ["agreed_pile_length_m",        "Pile length", "m",
        ["cut_off_level_m", "toe_level_m"]],
      ["agreed_rock_socket_length_m", "Rock socket", "m",
        ["rock_socketing_level_m", "toe_level_m"]]
    ];

    var ASBUILT = [
      ["as_built_diameter_mm",      "As-built diameter", "mm"],
      ["temporary_casing_length_m", "Temporary casing",  "m"],
      ["permanent_casing_length_m", "Permanent casing",  "m"]
    ];

    // The asterisked ones are required ONCE A CAGE ROW EXISTS — a bore log with
    // no cage at all is fine, but a half-typed cage is not.
    var CAGE_COLS = [
      ["main_count",      "Bars",         true],
      ["main_dia_mm",     "Bar Ø mm",     true],
      ["length_m",        "Length m",     true],
      ["spiral_dia_mm",   "Spiral Ø mm"],
      ["spiral_pitch_mm", "Pitch mm"],
      ["lap_to_next_m",   "Lap m"]
    ];

    // Soil strata shape (0076). DEPTHS IN METRES BELOW THE PLATFORM — bigger
    // number = further down. This is the one thing on this screen that does NOT
    // run in levels, and it is deliberate: the strata table on the certified
    // sheet is written in depths, so typing it as levels would mean converting
    // every row in your head, which is how wrong numbers get in.
    //
    // The first version of this page guessed LEVELS (mRL) for consistency with
    // the rest of the record — nothing in the database defined a shape, because
    // 0029 dropped the old column and bore_logs has always been empty. Reading a
    // real sheet settled it the other way. No SPT column: the site does not
    // record it, and a box nobody can fill is a box that gets guessed.
    var STRATA_COLS = [
      ["from_depth_m", "From (m)",    true],
      ["to_depth_m",   "To (m)",      true],
      ["description",  "Description", true]
    ];

    /* ---------------------------- small helpers ---------------------------- */

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function fail(e) {
      document.getElementById("error").innerHTML =
        '<div class="banner banner-red">Could not save: ' +
        escHtml((e && e.message) || e) + "</div>";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearBanners() {
      document.getElementById("error").innerHTML = "";
      document.getElementById("ok").innerHTML = "";
    }

    function val(id) {
      var el = document.getElementById(id);
      return el ? String(el.value || "").trim() : "";
    }

    // "" -> omitted entirely. A JSON number, never a numeric string: the
    // validator checks jsonb_typeof(...) = 'number' and rejects "12.5".
    function putNum(out, key, raw) {
      if (raw === "") return;
      var n = Number(raw);
      if (!isFinite(n)) return;          // let the DB complain about junk
      out[key] = n;
    }

    function putText(out, key, raw) {
      if (raw !== "") out[key] = raw;
    }

    /* ------------------------------ the inbox ------------------------------ */

    var OPEN_STATUSES = ["pending", "processing", "extracted", "failed"];

    function inboxRows() {
      return BL.rows.filter(function (r) {
        if (BL.statusFilter === "all") return true;
        if (BL.statusFilter === "open") return OPEN_STATUSES.indexOf(r.status) !== -1;
        return r.status === BL.statusFilter;
      });
    }

    function statusBadge(r) {
      if (r.status === "failed") {
        return '<span class="badge badge-critical">could not read</span>';
      }
      if (r.status === "approved")   return '<span class="badge badge-passed">confirmed</span>';
      if (r.status === "rejected")   return '<span class="badge badge-failed">rejected</span>';
      if (r.status === "superseded") return '<span class="badge badge-gray">replaced</span>';
      if (r.status === "extracted")  return '<span class="badge badge-scheduled">ready to check</span>';
      if (r.status === "processing") return '<span class="badge badge-gray">reading…</span>';
      return '<span class="badge badge-pending">needs typing in</span>';
    }

    function inboxRowHtml(r) {
      var who = r.source === "whatsapp"
        ? "WhatsApp" + (r.wa_sender ? " · " + escHtml(r.wa_sender) : "")
        : "Uploaded" + (r.submitted_by_name ? " · " + escHtml(r.submitted_by_name) : "");

      // Site, zone and pile each get their own cell. The code alone ("HF-KLT-001")
      // is what the database calls the job; the office calls it by name, so both
      // are shown. Zone is the pier/abutment — the same narrowing the picker uses.
      var site = r.project_code
        ? escHtml(r.project_code + (r.project_name ? " — " + r.project_name : ""))
        : "—";

      var pile = r.pile_mark_no
        ? escHtml(r.pile_mark_no)
        : '<span class="stale-warn">no pile matched yet</span>';

      var flags = "";
      if (r.error_count)   flags += ' <span class="badge badge-critical">' + r.error_count + " to fix</span>";
      if (r.warning_count) flags += ' <span class="badge badge-pending">' + r.warning_count + " to check</span>";

      return "<tr>" +
        UI.td("Status", statusBadge(r)) +
        UI.td("Site", site) +
        UI.td("Zone", r.zone ? escHtml(r.zone) : "—") +
        UI.td("Pile", pile) +
        UI.td("Source", who) +
        UI.td("Files", (r.file_count || 0) + (r.file_count === 1 ? " file" : " files")) +
        UI.td("Arrived", dstr(String(r.created_at).slice(0, 10))) +
        UI.td("", flags + ' <a href="bore-logs.html?id=' + esc(r.submission_id) + '">open &rarr;</a>') +
        "</tr>";
    }

    function uploadPanelHtml() {
      if (!Dash.can("bore_logs.create")) return "";
      return '<details class="zone" id="bl-upload"><summary>' +
        '<span class="zone-name">Add a bore log</span>' +
        '<span class="zone-count">scan or photo</span></summary>' +
        '<div class="chase-body"><div class="claim-form">' +
          pickerHtml("up", null) +
          '<label>file(s) <input type="file" id="up-file" multiple ' +
            'accept="image/jpeg,image/png,image/webp,image/heic,application/pdf"></label>' +
          '<button type="button" data-action="bl-upload">Upload</button>' +
          '<span class="muted">The document is kept as the record. ' +
          'You type the values on the next screen.</span>' +
        "</div></div></details>";
    }

    function renderInbox() {
      var rows = inboxRows();
      var body = rows.length
        ? rows.map(inboxRowHtml).join("")
        : UI.emptyRow(8, BL.rows.length
            ? "Nothing with that status."
            : "No bore logs yet. Upload a scan, or wait for one from the site group.");

      document.getElementById("view").innerHTML =
        uploadPanelHtml() +
        '<div class="mp-controls"><span>Show: <select id="bl-status">' +
          '<option value="open">waiting to be checked</option>' +
          '<option value="approved">confirmed</option>' +
          '<option value="rejected">rejected</option>' +
          '<option value="all">everything</option>' +
        "</select></span></div>" +
        '<table class="table table-stack"><thead><tr>' +
          "<th>Status</th><th>Site</th><th>Zone</th><th>Pile</th>" +
          "<th>Source</th><th>Files</th><th>Arrived</th><th></th>" +
        "</tr></thead><tbody>" + body + "</tbody></table>";

      document.getElementById("bl-status").value = BL.statusFilter;

      var open = BL.rows.filter(function (r) {
        return OPEN_STATUSES.indexOf(r.status) !== -1;
      }).length;
      document.getElementById("bl-sub").textContent = open
        ? open + (open === 1 ? " bore log waiting to be checked" : " bore logs waiting to be checked")
        : "Nothing waiting.";
    }

    /* ------------------- pile picker: site -> zone -> pile -------------------
       One flat list of 267 piles is unusable — nobody scrolls that to find
       P4-2. Every pile in the register carries a zone (checked: 0 of 267 are
       null), no project holds more than 30 piles, and zones run 2-18 per
       project, so two narrowing steps leave a handful to choose from.

       "all zones" stays available: someone holding the sheet who does not know
       which pier it belongs to can still find the mark.
       ---------------------------------------------------------------------- */

    // numeric-aware, so P10 sorts after P9 rather than after P1
    function byMark(a, b) {
      return String(a.pile_mark_no || "").localeCompare(
             String(b.pile_mark_no || ""), undefined, { numeric: true, sensitivity: "base" });
    }

    function projectsWithPiles() {
      var seen = {}, out = [];
      BL.piles.forEach(function (p) {
        if (seen[p.project_id]) return;
        seen[p.project_id] = true;
        out.push({ id: p.project_id, code: p.project_code || "", name: p.project_name || "" });
      });
      return out.sort(function (a, b) { return a.code.localeCompare(b.code); });
    }

    function zonesIn(projectId) {
      var seen = {}, out = [];
      BL.piles.forEach(function (p) {
        if (String(p.project_id) !== String(projectId)) return;
        var z = p.zone || "";
        if (seen[z]) return;
        seen[z] = true;
        out.push(z);
      });
      return out.sort(function (a, b) {
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
      });
    }

    function pilesIn(projectId, zone) {
      return BL.piles.filter(function (p) {
        if (String(p.project_id) !== String(projectId)) return false;
        return zone === "" || (p.zone || "") === zone;      // "" = every zone
      }).sort(byMark);
    }

    function zoneOptionsHtml(projectId, selectedZone) {
      if (!projectId) return '<option value="">— pick a site first —</option>';
      return '<option value="">— all zones —</option>' +
        zonesIn(projectId).map(function (z) {
          return '<option value="' + esc(z) + '"' +
                 (z === selectedZone ? " selected" : "") + ">" +
                 escHtml(z || "(no zone)") + "</option>";
        }).join("");
    }

    function pileOptionsHtml(projectId, zone, selectedPileId) {
      if (!projectId) return '<option value="">— pick a site first —</option>';
      var ps = pilesIn(projectId, zone);
      if (!ps.length) return '<option value="">— no piles here —</option>';
      return '<option value="">— not matched yet —</option>' +
        ps.map(function (p) {
          return '<option value="' + esc(p.pile_id) + '"' +
                 (String(p.pile_id) === String(selectedPileId) ? " selected" : "") + ">" +
                 escHtml(p.pile_mark_no || "") + "</option>";
        }).join("");
    }

    // pfx namespaces the three ids, so the upload box and the review screen can
    // each hold a picker on the same page without colliding.
    //
    // requirePile is per CALLER, not a property of the picker: on the review
    // screen the pile must be matched before anything can be confirmed, but the
    // upload box deliberately accepts a scan with no pile yet — that is the
    // whole reason bore_log_submissions exists as a staging table.
    function pickerHtml(pfx, selectedPileId, requirePile) {
      var sel = null;
      if (selectedPileId) {
        for (var i = 0; i < BL.piles.length; i++) {
          if (String(BL.piles[i].pile_id) === String(selectedPileId)) { sel = BL.piles[i]; break; }
        }
      }
      // an already-matched pile pre-selects its own site and zone, so the
      // reviewer sees where it sits rather than three empty boxes
      var projId = sel ? sel.project_id : "";
      var zone   = sel ? (sel.zone || "") : "";

      return '<label>site <select id="' + pfx + '-proj" data-pick="' + pfx + '">' +
               '<option value="">— choose a site —</option>' +
               projectsWithPiles().map(function (p) {
                 // code AND name — the office knows sites by name (house rule)
                 return '<option value="' + esc(p.id) + '"' +
                        (String(p.id) === String(projId) ? " selected" : "") + ">" +
                        escHtml(p.code + (p.name ? " — " + p.name : "")) + "</option>";
               }).join("") +
             "</select></label>" +
             '<label>zone <select id="' + pfx + '-zone" data-pick="' + pfx + '">' +
               zoneOptionsHtml(projId, zone) + "</select></label>" +
             "<label>pile" + reqMark(requirePile) +
               ' <select id="' + pfx + '-pile" data-pick="' + pfx + '">' +
               pileOptionsHtml(projId, zone, selectedPileId) + "</select></label>";
    }

    function pickedPile(pfx) {
      var el = document.getElementById(pfx + "-pile");
      return el ? String(el.value || "") : "";
    }

    // refill whatever sits downstream of the box that just changed
    function refillPicker(pfx, which) {
      var projEl = document.getElementById(pfx + "-proj");
      var zoneEl = document.getElementById(pfx + "-zone");
      var pileEl = document.getElementById(pfx + "-pile");
      var projId = projEl ? String(projEl.value || "") : "";
      if (which === "proj" && zoneEl) zoneEl.innerHTML = zoneOptionsHtml(projId, "");
      var zone = zoneEl ? String(zoneEl.value || "") : "";
      if (pileEl) pileEl.innerHTML = pileOptionsHtml(projId, zone, null);
    }

    /* --------------------------- the review screen -------------------------- */

    /* ONE FIELD PER ROW: label | box | unit, three cells of a grid.

       The boxes wrapped two-across before, which meant the eye zig-zagged while
       the sheet being copied reads straight down. Worse, the boxes never lined
       up, so a set of levels could not be checked as a group. Now every box
       starts and ends at the same place and the numbers are right-aligned, so
       a column of levels can be scanned for a wrong sign or a transposed digit
       without reading a single label. It costs about seven extra rows of height
       across the form, which is the trade.

       The three cells are SIBLINGS, not wrapped in a <label>. A wrapper would
       have to be display:contents to keep them as grid items, and that has a
       patchy history in the accessibility tree — <label for> pointing at the
       input's own id does the same job with none of the doubt. */
    // <abbr title="required"> rather than a bare "*": the mark is read out as
    // "required" instead of "star", and hovering says so.
    function reqMark(required) {
      return required ? ' <abbr class="req" title="required">*</abbr>' : "";
    }

    // The tables are the one place the asterisk means something conditional:
    // no cage and no strata at all is a perfectly valid bore log, but a
    // half-filled row is not. Say so rather than leave people guessing why a
    // column they left blank is suddenly an error.
    function reqNote(word) {
      return '<abbr class="req" title="required">*</abbr> needed on every ' +
             escHtml(word) + " you add.";
    }

    function fieldRow(key, label, type, v, unit, required, placeholder) {
      var t = type || "number";
      var attrs = t === "number" ? ' type="number" step="any"'
                : t === "datetime" ? ' type="datetime-local"'
                : t === "date" ? ' type="date"'
                : ' type="text"';
      return '<label class="bl-row-label" for="f-' + esc(key) + '">' +
               escHtml(label) + reqMark(required) + "</label>" +
             '<input id="f-' + esc(key) + '"' + attrs +
             (required ? " required" : "") +
             (placeholder ? ' placeholder="' + esc(placeholder) + '"' : "") +
             ' value="' + esc(v === null || v === undefined ? "" : v) + '">' +
             '<span class="bl-row-unit">' + escHtml(unit || "") + "</span>";
    }

    /* ------------------- the calculated lengths, live ----------------------
       The calculated figure is shown as the box's PLACEHOLDER, which is exactly
       the right shape for the rule underneath: an empty box means "no override,
       use the calculation", and that is what gets stored — null. Nothing has to
       be typed in the normal case, and nothing redundant is saved.

       Recalculated on every keystroke in the levels, so the number you are
       about to accept is on screen while you type the levels that produce it.
       ---------------------------------------------------------------------- */

    function calcDerived(row) {
      var upper = val("f-" + row[3][0]);
      var lower = val("f-" + row[3][1]);
      if (upper === "" || lower === "") return null;
      var a = Number(upper), b = Number(lower);
      if (!isFinite(a) || !isFinite(b)) return null;
      return Math.round((a - b) * 1000) / 1000;   // 3 dp, same as the database
    }

    // Updates BOTH states: the plain number on a calculated row, and the
    // "levels give X" reference on an overridden one — so someone deviating
    // can see exactly what they are deviating from while they type.
    function refreshDerived() {
      DERIVED.forEach(function (row) {
        var c = calcDerived(row);
        var txt = (c === null) ? "—" : String(c);
        var cells = document.querySelectorAll('[data-calc="' + row[0] + '"]');
        for (var i = 0; i < cells.length; i++) cells[i].textContent = txt;
      });
    }

    /* TWO VISIBLY DIFFERENT STATES, which is the whole point of this section.

       calculated  a plain number, no box. Obviously not something you typed,
                   and nothing is stored — the database does the arithmetic.
       agreed      an input box. What you type here is what the pile register
                   and the claims will show.

       The first version put the calculated figure in a box as a placeholder.
       It worked, but a number in a box reads as a value whatever its colour,
       and the owner asked for a button to "compute" figures that were already
       computing themselves — which is exactly the confusion this replaces.

       ⚠ A button that FILLED the box would have been worse than nothing: the
         moment a box holds a value it is an override, so every pile would carry
         three of them, figures_agreed would be true everywhere, and the flag
         that marks a negotiated figure would stop meaning anything. Overriding
         has to stay a deliberate act, because it is a commercial one. */

    function lengthRowHtml(r, isOver, typed) {
      var key = r[0];
      if (!isOver) {
        return '<span class="bl-row-label">' + escHtml(r[1]) + "</span>" +
               '<span class="bl-calc" data-calc="' + esc(key) + '">—</span>' +
               '<span class="bl-row-unit">' + escHtml(r[2]) + "</span>" +
               '<span class="bl-len-state">calculated ' +
                 '<button type="button" class="bl-linkbtn" data-action="bl-override" ' +
                 'data-k="' + esc(key) + '">override</button></span>';
      }
      return '<label class="bl-row-label" for="f-' + esc(key) + '">' + escHtml(r[1]) + "</label>" +
             '<input id="f-' + esc(key) + '" type="number" step="any" value="' +
               esc(typed === null || typed === undefined ? "" : typed) + '">' +
             '<span class="bl-row-unit">' + escHtml(r[2]) + "</span>" +
             '<span class="bl-len-state"><span class="bl-agreed">agreed</span> ' +
               '<span class="muted">levels give <b data-calc="' + esc(key) + '">—</b></span> ' +
               '<button type="button" class="bl-linkbtn" data-action="bl-use-calc" ' +
               'data-k="' + esc(key) + '">use calculated</button></span>';
    }

    function lengthRowsHtml() {
      return DERIVED.map(function (r) {
        return lengthRowHtml(r, !!BL.over[r[0]], BL.len[r[0]]);
      }).join("") +
      '<label class="bl-row-label" for="f-agreed_basis">Why agreed</label>' +
      '<input id="f-agreed_basis" type="text" value="' + esc(BL.len.agreed_basis || "") + '">' +
      '<span class="bl-row-unit"></span><span class="bl-len-state"></span>';
    }

    function derivedBlockHtml() {
      return '<h3>Lengths <span class="muted">worked out from the levels — ' +
        "override one only if the site agreed a different figure</span></h3>" +
        '<div class="bl-rows bl-lengths" id="bl-lengths">' + lengthRowsHtml() + "</div>" +
        '<p class="muted">A calculated figure is not stored — the levels are, and ' +
        "the figure follows them. An overridden one IS stored, and is what the pile " +
        "register and the claims will show, so it is flagged whenever it differs " +
        "from the levels.</p>";
    }

    // Pull what is on screen back into state before any re-render, or a
    // half-typed override is lost the moment another row is toggled.
    function readLengthState() {
      DERIVED.forEach(function (r) {
        var el = document.getElementById("f-" + r[0]);
        if (el) BL.len[r[0]] = String(el.value || "");
      });
      var b = document.getElementById("f-agreed_basis");
      if (b) BL.len.agreed_basis = String(b.value || "");
    }

    // Re-renders THIS SECTION ONLY. The rest of the form is never touched, for
    // the same reason paging between scans does not touch it: unsaved typing.
    function renderLengths() {
      var host = document.getElementById("bl-lengths");
      if (!host) return;
      host.innerHTML = lengthRowsHtml();
      refreshDerived();
    }

    // timestamptz -> what <input type="datetime-local"> wants
    function toLocalInput(v) {
      if (!v) return "";
      return String(v).replace(" ", "T").slice(0, 16);
    }

    /* ------------------- repeating rows: cages and strata -------------------
       Both are TABLES with a single header row. Every row asks for the same
       six (or three) things, so repeating the labels on each one just pushed
       the boxes into a narrower and narrower column — a 4-cage log printed
       "Bars / Bar Ø mm / Length m / Spiral Ø mm / Pitch mm / Lap m" four times.

       The markup hooks are unchanged on purpose: .bl-cage / .bl-cage-in /
       .bl-stratum / .bl-strata-in / data-k are what collectFields() walks, and
       data-action is what the click handler reads. Only the element around them
       moved from <div> to <tr>.
       ---------------------------------------------------------------------- */

    function gridHeadHtml(cols) {
      return '<thead><tr><th></th>' +
        cols.map(function (col) {
          return "<th>" + escHtml(col[1]) + reqMark(col[2]) + "</th>";
        }).join("") +
        "<th></th></tr></thead>";
    }

    function cageBlockHtml(reinf) {
      var cages = (reinf && reinf.cages) || [];
      var rows = cages.map(function (c, i) { return cageRowHtml(i, c); }).join("");
      return '<h3>Steel cage <span class="muted">as built</span></h3>' +
        '<div class="bl-rows">' +
          fieldRow("starter_bar_length_m", "Starter bar length", "number",
                   reinf ? reinf.starter_bar_length_m : "", "m") +
        "</div>" +
        '<div class="bl-grid-wrap"><table class="bl-grid">' + gridHeadHtml(CAGE_COLS) +
          '<tbody id="bl-cages">' + rows + "</tbody></table></div>" +
        '<button type="button" data-action="bl-cage-add">+ add a cage</button>' +
        '<p class="muted">Top cage first — the starter bars sit on it. ' +
        "Lap is how far a cage's bars run down into the one below, so the " +
        "bottom cage has none. Weight is worked out from these numbers when " +
        "you confirm. " + reqNote("cage") + "</p>";
    }

    // No data-i on the remove button: the handler finds its own row with
    // closest(), and an index baked into the markup goes stale the moment a row
    // above it is removed.
    function cageRowHtml(i, c) {
      c = c || {};
      return '<tr class="bl-cage"><th class="bl-grid-rowhead">Cage ' + (i + 1) + "</th>" +
        CAGE_COLS.map(function (col) {
          return "<td>" +
                 '<input type="number" step="any" class="bl-cage-in" data-k="' + esc(col[0]) +
                 '" value="' + esc(c[col[0]] === null || c[col[0]] === undefined ? "" : c[col[0]]) +
                 '" aria-label="' + esc(col[1]) + '"></td>';
        }).join("") +
        '<td><button type="button" class="bl-grid-del" data-action="bl-cage-del" ' +
        'title="remove this cage">&times;</button></td>' +
        "</tr>";
    }

    function strataBlockHtml(layers) {
      var rows = (layers || []).map(function (l, i) { return strataRowHtml(i, l); }).join("");
      return '<h3>Soil strata ' +
        '<span class="muted">depths measured down from the platform</span></h3>' +
        '<div class="bl-grid-wrap"><table class="bl-grid">' + gridHeadHtml(STRATA_COLS) +
          '<tbody id="bl-strata">' + rows + "</tbody></table></div>" +
        '<button type="button" data-action="bl-strata-add">+ add a layer</button>' +
        '<p class="muted">' + reqNote("layer") + "</p>";
    }

    function strataRowHtml(i, l) {
      l = l || {};
      return '<tr class="bl-stratum"><th class="bl-grid-rowhead">Layer ' + (i + 1) + "</th>" +
        STRATA_COLS.map(function (col) {
          var isText = col[0] === "description";
          return "<td" + (isText ? ' class="bl-grid-wide"' : "") + ">" +
            '<input class="bl-strata-in" data-k="' + esc(col[0]) + '"' +
            (isText ? ' type="text"' : ' type="number" step="any"') +
            ' value="' + esc(l[col[0]] === null || l[col[0]] === undefined ? "" : l[col[0]]) +
            '" aria-label="' + esc(col[1]) + '"></td>';
        }).join("") +
        '<td><button type="button" class="bl-grid-del" data-action="bl-strata-del" ' +
        'title="remove this layer">&times;</button></td>' +
        "</tr>";
    }

    // A row's number is its POSITION, not its identity — remove cage 2 and what
    // was cage 3 becomes cage 2. collectFields() already renumbers `seq` from
    // position so the saved data is right either way; this stops the SCREEN
    // from saying otherwise. One cell per row is rewritten rather than
    // re-rendering the block, because a re-render throws away whatever has been
    // typed and not yet saved.
    function renumberRows(tbodyId, word) {
      var rows = document.querySelectorAll("#" + tbodyId + " > tr");
      for (var i = 0; i < rows.length; i++) {
        var head = rows[i].querySelector(".bl-grid-rowhead");
        if (head) head.textContent = word + " " + (i + 1);
      }
    }

    /* A lap is the length one cage's bars run DOWN INTO the cage below it, so
       n cages have n-1 laps and THE BOTTOM CAGE HAS NONE.

       This matters in money, not just tidiness: the weight calculation adds
       (length + lap) x bar count, so a lap typed on the bottom cage invents
       steel that was never tied — measured at +23.1 kg on 3 cages of 6 x T25
       with a 1.0 m lap — and that total is what the "as-built vs design
       tonnage" check compares. The database refuses it too (0076) and the
       weight function ignores it regardless; this just stops the box being
       offered in the first place.

       Runs on every add and remove, because which row is last keeps changing.
       Any value already sitting in a newly-last row is cleared — it was never
       real steel, and leaving it would mean saving a figure the database will
       reject on Confirm. */
    function refreshCageLaps() {
      var rows = document.querySelectorAll("#bl-cages > tr");
      for (var i = 0; i < rows.length; i++) {
        var input = rows[i].querySelector('[data-k="lap_to_next_m"]');
        if (!input) continue;
        var isLast = (i === rows.length - 1);
        input.disabled = isLast;
        if (isLast) input.value = "";       // blank -> collectFields() omits it
        if (input.parentNode && input.parentNode.classList) {
          input.parentNode.classList.toggle("bl-cell-na", isLast);
          input.parentNode.title = isLast
            ? "The bottom cage has nothing to lap onto." : "";
        }
      }
    }

    // Has the reviewer put anything in yet? A brand-new submission has no
    // ai_fields at all (nothing pre-filled it, because nothing reads the
    // document for us).
    function draftIsEmpty(s) {
      var f = s && s.ai_fields;
      if (!f) return true;
      for (var k in f) { if (Object.prototype.hasOwnProperty.call(f, k)) return false; }
      return true;
    }

    // `untouched` exists because the database is answering "can this be
    // approved?" — and for an untyped draft the honest answer is no. Correct,
    // but opening a fresh bore log with a red MUST BE FIXED banner reads as
    // "something is broken" when the real state is "you haven't started".
    // The approve button stays disabled either way; only the wording changes.
    function validationHtml(v, untouched) {
      if (untouched) {
        return '<div class="banner banner-info">Read the document on the left and ' +
               "type the values in. Anything impossible gets flagged before you can confirm.</div>";
      }
      if (!v) return "";
      var errs = v.errors || [], warns = v.warnings || [];
      var out = "";
      if (errs.length) {
        out += '<div class="banner banner-red"><strong>Must be fixed before this can be confirmed</strong><ul>' +
          errs.map(function (e) { return "<li>" + escHtml(e) + "</li>"; }).join("") + "</ul></div>";
      }
      if (warns.length) {
        out += '<div class="banner banner-amber"><strong>Worth a look</strong><ul>' +
          warns.map(function (w) { return "<li>" + escHtml(w) + "</li>"; }).join("") + "</ul></div>";
      }
      if (!errs.length && !warns.length) {
        out += '<div class="banner banner-green">Nothing looks wrong.</div>';
      }
      return out;
    }

    // Sits at the TOP of the review column, above the picker — so "pick one
    // below", not "above". Getting that wrong points the reviewer at nothing.
    function designHtml(p) {
      if (!p || !p.pile_id) {
        return '<div class="muted-line">No pile matched yet — pick one below so the ' +
               "numbers can be checked against the design.</div>";
      }
      // labelHtml is HTML, not text — every caller passes a literal, and one of
      // them passes UI.help(), which IS markup. Escaping it would print the
      // <span> at the reviewer. The VALUE is escaped, which is the part that
      // comes from the database.
      function line(labelHtml, v, unit) {
        return '<div><span class="muted">' + labelHtml + "</span> " +
               (v === null || v === undefined ? "—" : escHtml(String(v) + (unit || ""))) + "</div>";
      }
      return '<div class="bl-design">' +
        line("Register Ø", p.register_diameter_mm, " mm") +
        line("Design depth", p.design_depth_m, " m") +
        line(UI.help("rock socket") + " design", p.design_socket_length_m, " m") +
        line("Design concrete", p.design_concrete_m3, " m³") +
        line("Design steel", p.design_steel_total_t, " t") +
        line("Cover used", p.design_cover_mm === null ? "75 (assumed)" : p.design_cover_mm, " mm") +
        "</div>";
    }

    function currentPath() {
      var paths = BL.sub.storage_paths || [];
      if (!paths.length) return "";
      return paths[Math.min(BL.page, paths.length - 1)];
    }

    // Decided per FILE, not per submission: mime_type on the row describes only
    // the first file, and one submission can mix a PDF cover sheet with photos.
    // The extension is the reliable signal; mime_type is the fallback for a file
    // uploaded without one.
    function currentIsPdf() {
      var p = currentPath();
      if (/\.pdf(\?|$)/i.test(p)) return true;
      if (/\.(jpe?g|png|webp|heic|heif|gif|tiff?)(\?|$)/i.test(p)) return false;
      return /pdf/i.test(BL.sub.mime_type || "");
    }

    function viewerHtml() {
      var paths = (BL.sub.storage_paths) || [];
      var pdf = currentIsPdf();
      var nav = paths.length > 1
        ? '<span class="muted" id="bl-pageno">' + (BL.page + 1) + " / " + paths.length + "</span>" +
          '<button type="button" data-action="bl-prev">&larr;</button>' +
          '<button type="button" data-action="bl-next">&rarr;</button>'
        : "";

      // A PDF gets the browser's own viewer, which already does zoom, rotate and
      // page navigation — our buttons would only fight it, so they are dropped.
      var imgCtl = pdf ? "" :
        '<button type="button" data-action="bl-zoom-in">+</button>' +
        '<button type="button" data-action="bl-zoom-out">&minus;</button>' +
        '<button type="button" data-action="bl-rotate">rotate</button>' +
        '<button type="button" data-action="bl-reset">reset</button>';

      return '<div class="bl-viewer">' +
        '<div class="bl-viewer-bar">' + imgCtl + nav +
          '<a id="bl-open" href="#" target="_blank" rel="noopener">' +
          (pdf ? "open in a new tab" : "open full size") + "</a>" +
        "</div>" +
        '<div class="bl-viewer-frame' + (pdf ? " is-pdf" : "") + '" id="bl-frame">' +
          // class AND id: the id is what showPage() sets the src on, the class is
          // what carries the sizing. Styling it by id alone left the iframe at
          // the browser default of 300x150.
          (pdf ? '<iframe id="bl-pdf" class="bl-pdf" title="bore log document"></iframe>'
               : '<img id="bl-img" alt="bore log">') +
        "</div></div>";
    }

    function renderReview() {
      var s = BL.sub;
      var f = s.ai_fields || {};
      var canEdit = Dash.can("bore_logs.edit");
      var canApprove = Dash.can("bore_logs.approve");
      var settled = ["approved", "rejected", "superseded"].indexOf(s.status) !== -1;
      var errCount = ((s.validation && s.validation.errors) || []).length;

      // A stored agreed figure means that row was overridden — reopen it in the
      // state it was left in, or the reviewer would see "calculated" over a
      // number the database is not actually calculating.
      DERIVED.forEach(function (r) {
        var stored = f[r[0]];
        if (stored !== null && stored !== undefined && stored !== "") {
          BL.over[r[0]] = true;
          BL.len[r[0]] = stored;
        }
      });
      BL.len.agreed_basis = f.agreed_basis || "";

      document.getElementById("bl-title").textContent =
        (s.pile && s.pile.pile_mark_no)
          ? "Bore log — " + s.pile.project_code + " · " + s.pile.pile_mark_no
          : "Bore log — pile not matched yet";

      document.getElementById("bl-sub").innerHTML =
        '<a href="bore-logs.html">&larr; back to the list</a> · ' +
        (s.source === "whatsapp" ? "from WhatsApp" : "uploaded") +
        (s.ai_model ? ' · read by <span class="muted">' + escHtml(s.ai_model) + "</span>" : "") +
        (settled ? " · " + escHtml(UI.label(s.status)) : "");

      var actions = settled
        ? '<div class="muted-line">Already dealt with — ' + escHtml(UI.label(s.status)) +
          (s.review_note ? ": " + escHtml(s.review_note) : "") + "</div>"
        : '<div class="bl-actions">' +
            (canEdit ? '<button type="button" data-action="bl-save">Save draft</button>' : "") +
            (canApprove
              ? '<button type="button" class="btn-primary" data-action="bl-approve"' +
                (errCount ? " disabled" : "") + ">Confirm this bore log</button>" +
                '<button type="button" data-action="bl-reject">Reject…</button>'
              : "") +
            (canEdit || canApprove ? "" : '<span class="muted">View only.</span>') +
          "</div>";

      // Section order, owner's call:
      //
      //   Design → Which pile → As built → Boring times → Levels →
      //   Concrete → Steel cage → Soil strata → Remarks
      //
      // The DESIGN figures sit at the very top because they are the reference
      // the whole screen is checked against — what this pile was supposed to be,
      // in view while every other number is typed. As-built lands directly under
      // it so the two diameters can be compared without scrolling.
      //
      // Levels still says mRL and Soil strata still says depth: they point in
      // OPPOSITE directions (levels down = smaller, depths down = bigger) and
      // are no longer adjacent, so both hints have to carry their own weight.
      document.getElementById("view").innerHTML =
        '<div class="bl-split">' +
          '<div class="bl-left" id="bl-left">' + viewerHtml() + "</div>" +
          '<div class="bl-right">' +
            '<div id="bl-valid">' + validationHtml(s.validation, draftIsEmpty(s)) + "</div>" +

            '<h3>Design <span class="muted">what this pile was meant to be</span></h3>' +
            designHtml(s.pile) +

            "<h3>Which pile</h3>" +
            '<div class="claim-form">' + pickerHtml("f", s.pile_id, true) + "</div>" +

            "<h3>As built</h3>" +
            '<div class="bl-rows">' +
              ASBUILT.map(function (r) { return fieldRow(r[0], r[1], "number", f[r[0]], r[2]); }).join("") +
            "</div>" +

            "<h3>Boring times</h3>" +
            '<div class="bl-rows">' +
              TIMES.map(function (r) {
                return fieldRow(r[0], r[1], "datetime", toLocalInput(f[r[0]]));
              }).join("") +
            "</div>" +

            // the heading no longer has to say mRL — every row carries it now,
            // so the hint is free to explain the DIRECTION, which is the part
            // a unit label cannot tell you
            "<h3>Levels <span class=\"muted\">going down the pile the numbers get smaller</span></h3>" +
            '<div class="bl-rows">' +
              LEVELS.map(function (r) {
                return fieldRow(r[0], r[1], "number", f[r[0]], r[2], r[3]);
              }).join("") +
            "</div>" +

            // straight after the levels they are worked out from
            derivedBlockHtml() +

            "<h3>Concrete</h3>" +
            '<div class="bl-rows">' +
              fieldRow("concrete_grade", "Grade", "text", f.concrete_grade) +
              fieldRow("cast_date", "Cast date", "date", f.cast_date) +
              fieldRow("actual_concrete_m3", "Poured", "number", f.actual_concrete_m3, "m³") +
            "</div>" +

            cageBlockHtml(f.reinforcement) +
            strataBlockHtml(f.soil_layers) +

            "<h3>Remarks</h3>" +
            '<div class="bl-rows">' +
              fieldRow("remarks", "Notes", "text", f.remarks) +
            "</div>" +

            actions +
          "</div>" +
        "</div>";

      refreshCageLaps();
      refreshDerived();
      showPage();
    }

    // Signed URLs expire, so they are fetched when the image is shown and never
    // kept anywhere.
    async function showPage() {
      var paths = BL.sub.storage_paths || [];
      if (!paths.length) return;
      var path = paths[Math.min(BL.page, paths.length - 1)];
      var counter = document.getElementById("bl-pageno");
      if (counter) counter.textContent = (BL.page + 1) + " / " + paths.length;
      try {
        var url = await Dash.boreLogFileUrl(path);
        var img = document.getElementById("bl-img");
        if (img) {
          img.src = url;
          img.style.transform = "scale(" + BL.zoom + ") rotate(" + BL.rot + "deg)";
        }
        var pdf = document.getElementById("bl-pdf");
        if (pdf) pdf.src = url;
        var link = document.getElementById("bl-open");
        if (link) link.href = url;
      } catch (e) {
        document.getElementById("bl-frame").innerHTML =
          UI.errorBanner((e && e.message) || e);
      }
    }

    /* ------------------------- reading the form back ------------------------ */

    function collectFields() {
      var out = {};

      LEVELS.forEach(function (r) { putNum(out, r[0], val("f-" + r[0])); });
      ASBUILT.forEach(function (r) { putNum(out, r[0], val("f-" + r[0])); });

      TIMES.forEach(function (r) {
        var v = val("f-" + r[0]);
        if (v) out[r[0]] = v;             // "2026-07-20T08:20" casts cleanly
      });

      putText(out, "concrete_grade", val("f-concrete_grade"));
      putText(out, "cast_date", val("f-cast_date"));
      putNum(out, "actual_concrete_m3", val("f-actual_concrete_m3"));
      putText(out, "remarks", val("f-remarks"));

      // An empty box is NOT sent, which is what makes the database fall back to
      // the calculation. putNum already omits "", so this is the whole rule.
      DERIVED.forEach(function (r) { putNum(out, r[0], val("f-" + r[0])); });
      putText(out, "agreed_basis", val("f-agreed_basis"));

      // cage — seq is renumbered from position, so a removed cage in the
      // middle can never leave a gap the validator would flag
      var cages = [];
      var blocks = document.querySelectorAll("#bl-cages .bl-cage");
      for (var i = 0; i < blocks.length; i++) {
        var cage = { seq: i + 1 }, any = false;
        var ins = blocks[i].querySelectorAll(".bl-cage-in");
        for (var j = 0; j < ins.length; j++) {
          var raw = String(ins[j].value || "").trim();
          if (raw === "") continue;
          var n = Number(raw);
          if (!isFinite(n)) continue;
          cage[ins[j].getAttribute("data-k")] = n;
          any = true;
        }
        if (any) cages.push(cage);
      }
      var starter = val("f-starter_bar_length_m");
      if (cages.length || starter !== "") {
        var reinf = { cages: cages };
        putNum(reinf, "starter_bar_length_m", starter);
        out.reinforcement = reinf;
      }

      // strata
      var layers = [];
      var sblocks = document.querySelectorAll("#bl-strata .bl-stratum");
      for (var k = 0; k < sblocks.length; k++) {
        var layer = {}, got = false;
        var sins = sblocks[k].querySelectorAll(".bl-strata-in");
        for (var m = 0; m < sins.length; m++) {
          var sraw = String(sins[m].value || "").trim();
          if (sraw === "") continue;
          var key = sins[m].getAttribute("data-k");
          if (key === "description") layer[key] = sraw;
          else {
            var sn = Number(sraw);
            if (!isFinite(sn)) continue;
            layer[key] = sn;
          }
          got = true;
        }
        if (got) layers.push(layer);
      }
      if (layers.length) out.soil_layers = layers;

      return out;
    }

    async function saveDraft(silent) {
      var pileId = pickedPile("f");
      var v = await Dash.saveBoreLogDraft(BL.id, collectFields(), {
        pileId: pileId || null,
        clearPile: !pileId
      });
      BL.sub.validation = v;
      // once they have saved, they HAVE started — show the real verdict
      document.getElementById("bl-valid").innerHTML = validationHtml(v, false);
      if (!silent) {
        document.getElementById("ok").innerHTML = UI.okBanner("Draft saved.");
      }
      // approve stays locked while anything is still an error
      var btn = document.querySelector('[data-action="bl-approve"]');
      if (btn) btn.disabled = ((v.errors || []).length > 0);
      return v;
    }

    /* --------------------------------- boot -------------------------------- */

    window.onShellReady = async function () {
      BL.id = qs("id");

      try {
        BL.piles = await Dash.getAllPiles();
      } catch (e) { BL.piles = []; }

      try {
        if (BL.id) {
          BL.sub = await Dash.getBoreLogSubmission(BL.id);
          renderReview();
        } else {
          BL.rows = await Dash.getBoreLogSubmissions({});
          renderInbox();
        }
        UI.restoreScroll();
      } catch (e) {
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load: ' +
          escHtml((e && e.message) || e) + "</div>";
        return;
      }

      // The calculated lengths follow the levels as they are typed, so the
      // figure about to be accepted is on screen while the levels that produce
      // it are being entered. Cheap enough to run on any field.
      document.getElementById("view").addEventListener("input", function (ev) {
        if (ev.target && ev.target.id && ev.target.id.indexOf("f-") === 0) {
          refreshDerived();
        }
      });

      document.getElementById("view").addEventListener("change", function (ev) {
        if (ev.target.id === "bl-status") {
          BL.statusFilter = ev.target.value;
          renderInbox();
          return;
        }
        // site -> zone -> pile: changing one box refills the ones below it.
        // Only the two upstream boxes cascade; changing the pile itself is the
        // answer, not a filter.
        var pfx = ev.target.getAttribute && ev.target.getAttribute("data-pick");
        if (!pfx) return;
        if (ev.target.id === pfx + "-proj") refillPicker(pfx, "proj");
        else if (ev.target.id === pfx + "-zone") refillPicker(pfx, "zone");
      });

      document.getElementById("view").addEventListener("click", async function (ev) {
        var btn = ev.target.closest("button[data-action]");
        if (!btn) return;
        var act = btn.getAttribute("data-action");
        clearBanners();

        /* ---- viewer ---- */
        if (act === "bl-zoom-in")  { BL.zoom = Math.min(BL.zoom * 1.25, 8); return showPage(); }
        if (act === "bl-zoom-out") { BL.zoom = Math.max(BL.zoom / 1.25, 0.2); return showPage(); }
        if (act === "bl-rotate")   { BL.rot = (BL.rot + 90) % 360; return showPage(); }
        if (act === "bl-reset")    { BL.zoom = 1; BL.rot = 0; return showPage(); }
        // Paging redraws the LEFT COLUMN only — never the form, or the reviewer
        // loses everything they have typed but not saved. The whole column and
        // not just the src, because one submission can mix a PDF with photos and
        // the element itself has to change (<iframe> vs <img>).
        if (act === "bl-prev" || act === "bl-next") {
          var last = (BL.sub.storage_paths || []).length - 1;
          BL.page = act === "bl-prev"
            ? Math.max(0, BL.page - 1)
            : Math.min(last, BL.page + 1);
          BL.zoom = 1; BL.rot = 0;              // a fresh page starts unzoomed
          var left = document.getElementById("bl-left");
          if (left) left.innerHTML = viewerHtml();
          return showPage();
        }

        /* ---- lengths: calculated <-> agreed ---- */
        if (act === "bl-override" || act === "bl-use-calc") {
          var lk = btn.getAttribute("data-k");
          readLengthState();                 // keep whatever is already typed
          if (act === "bl-override") {
            BL.over[lk] = true;
          } else {
            BL.over[lk] = false;
            BL.len[lk] = "";                 // back to nothing stored = calculated
          }
          renderLengths();
          var opened = document.getElementById("f-" + lk);
          if (opened) opened.focus();
          return;
        }

        /* ---- cage + strata rows ---- */
        if (act === "bl-cage-add") {
          var host = document.getElementById("bl-cages");
          var n = host.querySelectorAll(".bl-cage").length;
          host.insertAdjacentHTML("beforeend", cageRowHtml(n, {}));
          renumberRows("bl-cages", "Cage");
          refreshCageLaps();          // the old bottom cage can now hold a lap
          return;
        }
        if (act === "bl-cage-del") {
          var block = btn.closest(".bl-cage");
          if (block) block.remove();
          renumberRows("bl-cages", "Cage");
          refreshCageLaps();          // whatever is last now loses its lap
          return;
        }
        if (act === "bl-strata-add") {
          var shost = document.getElementById("bl-strata");
          var sn2 = shost.querySelectorAll(".bl-stratum").length;
          shost.insertAdjacentHTML("beforeend", strataRowHtml(sn2, {}));
          renumberRows("bl-strata", "Layer");
          return;
        }
        if (act === "bl-strata-del") {
          var sblock = btn.closest(".bl-stratum");
          if (sblock) sblock.remove();
          renumberRows("bl-strata", "Layer");
          return;
        }

        /* ---- upload ---- */
        if (act === "bl-upload") {
          var input = document.getElementById("up-file");
          if (!input || !input.files || !input.files.length) {
            return fail(new Error("Choose a file first."));
          }
          btn.disabled = true;
          btn.textContent = "Uploading…";
          try {
            var pid = pickedPile("up");
            var newId = await Dash.uploadBoreLog(input.files, { pileId: pid || null });
            window.location.href = "bore-logs.html?id=" + encodeURIComponent(newId);
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Upload";
            fail(e);
          }
          return;
        }

        /* ---- review actions ---- */
        if (act === "bl-save") {
          btn.disabled = true;
          try { await saveDraft(false); } catch (e) { fail(e); }
          btn.disabled = false;
          return;
        }

        if (act === "bl-approve") {
          btn.disabled = true;
          try {
            // save first: what is on screen is what gets confirmed, not
            // whatever was last written to the row
            var v = await saveDraft(true);
            if ((v.errors || []).length) {
              btn.disabled = false;
              return;
            }
            await Dash.approveBoreLogSubmission(BL.id, null);
            window.location.href = "bore-logs.html";
          } catch (e) {
            btn.disabled = false;
            fail(e);
          }
          return;
        }

        if (act === "bl-reject") {
          var reason = window.prompt("Why is this being rejected? (the site will be told)");
          if (!reason) return;
          btn.disabled = true;
          try {
            await Dash.rejectBoreLogSubmission(BL.id, reason);
            window.location.href = "bore-logs.html";
          } catch (e) {
            btn.disabled = false;
            fail(e);
          }
          return;
        }
      });
    };
  </script>
</body>
</html>
