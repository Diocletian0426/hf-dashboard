<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Machines</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= PAGE HEADER + FLEET STRIP (element 1) =================
         v2 co-build, one element per round (same method as the pile page).
         Strip = LAST-KNOWN state per machine (each machine's most recent
         daily report, any date — view column last_status since 0030), not
         machines.status (which is 'active' for all 33 and carries no
         information):
           Operating (green) | Standby (blue, incl. legacy 'idle' wording) |
           Breakdown (red)   | Never Reported (grey)
         Breakdown stays in the legend even at 0 — "No breakdowns" is the
         morning answer the office looks for. Colours CVD-validated.
         A muted staleness note under the legend says how fresh the picture
         is (machines silent 3+ days / never reported).
         Next elements: needs-attention panel, by-site tables, record card. -->
    <div class="page-eyebrow">Machines</div>
    <h1>Machine fleet</h1>

    <div id="fleet-strip"></div>

    <!-- ================= NEEDS ATTENTION (element 2) =================
         Same component as the pile page's records-to-chase panel.
         Four rules, each line only shows when it has machines:
           1) Breakdown       — last reported state is breakdown
           2) Open issues     — machine-linked site issues still open
                                (chip tooltip lists them)
           3) Service overdue — hour meter past next_service_due_hours
                                (dormant until the bot feeds hour meters)
           4) Move overdue    — a movement plan's date has passed but the
                                office hasn't pressed Execute yet (0048 —
                                replaces the old dormant next_move_date rule;
                                the legacy column itself stays, bot contract)
           5) State vs history — drift watchdog (0050): the machine's current
                                site (or mobilised date) disagrees with its
                                LATEST movement-history row. History edits
                                never touch state BY DESIGN, so when the two
                                records disagree, one of them is lying — this
                                makes it visible instead of silent. Only
                                office/management see it (history is a gated
                                read); machines with no history are skipped.
         Chips will jump to the machine's row once the by-site tables
         (element 3) exist — until then clicking is a harmless no-op. -->
    <!-- the two panels sit side by side: what is wrong now, and what is
         planned next. On narrow screens they stack. -->
    <div class="mach-panels">
      <div id="attention"></div>

      <!-- ================= UPCOMING MOVES (0048) =================
           Every PLANNED machine move by date (movement_plans). Plans NEVER
           apply themselves — the office presses Execute when the move really
           happened; a plan whose date passed unexecuted shows amber here and
           in needs-attention. Plans are created from each machine's record
           card ("Plan move…"). Execute/Cancel = management/office only. -->
      <div id="upcoming"></div>
    </div>

    <!-- ================= MACHINES BY SITE (element 3) =================
         One collapsible block per site (same details/summary pattern as the
         pile page zones), Unassigned last. Header: SITE CODE — name ·
         N machines · M operating. Columns:
         Machine | Type | Brand/model | Last report (state badge + date,
         amber date when 3+ days stale) | Diesel 7d | Mobilised | Comment
         (= the machine's issue track record, all issues ever linked:
         amber Yes when open, grey Yes when history only, tooltip lists).

         RECORD CARD (element 4): click a machine row and a full-width card
         opens under it (reuses the pile page's record-card styles — same
         component): identity chips, whereabouts + move dates, servicing
         summary + full service history (0031 view), recent activity
         (last 14 days of daily reports), and the issue track record.
         Click the row again to close. -->
    <!-- Toolbar above the machine list. Rendered once in static HTML so the
         listeners survive every repaint — only the control VALUES are synced
         when a fleet card changes the state filter. -->
    <div class="mach-tools" id="mach-tools" hidden>
      <label class="mt-search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/>
             <path d="M15.7 15.7 20.4 20.4"/></svg>
        <input id="mt-q" type="search" autocomplete="off" placeholder="Search machines…"
               aria-label="Search machines by code, type, brand or model">
      </label>
      <select id="mt-status" aria-label="Filter by state"></select>
      <select id="mt-site" aria-label="Filter by site"></select>
      <span class="mt-gap"></span>
      <button type="button" onclick="setAllZones(true)">Expand all</button>
      <button type="button" onclick="setAllZones(false)">Collapse all</button>
      <button type="button" id="mt-export">Export</button>
      <button type="button" id="add-machine-btn" class="btn-primary" hidden>+ Add Machine</button>
    </div>
    <div id="add-machine"></div>
    <div id="sites"></div>

    <div id="error"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    // last-known state per machine -> one stat card each.
    // Colour lives on the cards' tone classes in styles.css now; the hex
    // values that used to sit here belonged to the old segmented bar.
    var FLEET_STATES = [["Operating"], ["Standby"], ["Breakdown"], ["Never Reported"]];

    function fleetStateOf(m) {
      var t = m.last_status || "";
      if (t === "operating") return "Operating";
      if (t === "standby" || t === "idle") return "Standby";
      if (t === "breakdown") return "Breakdown";
      return "Never Reported";
    }

    // how fresh is the picture? days between the last report and today (KL)
    var daysSince = UI.daysSince;

    function staleNote(machines) {
      var silent3 = 0, never = 0, newest = "";
      machines.forEach(function (m) {
        if (!m.last_status_date) { never++; return; }
        if (m.last_status_date > newest) newest = m.last_status_date;
        if (daysSince(m.last_status_date) >= 3) silent3++;
      });
      var bits = ["state = each machine’s latest daily report" +
                  (newest ? " (freshest " + newest + ")" : "")];
      if (silent3) bits.push('<span class="stale-warn">' + silent3 + " silent 3+ days</span>");
      if (never) bits.push(never + " never reported");
      return '<div class="pipe-note">' + bits.join(" · ") + "</div>";
    }

    /* Fleet state as stat cards — same component as the Issues page (.istat),
       and like there each card is also the filter for that state, so the
       number on a card always equals the machines listed underneath. */
    function fleetStrip(machines) {
      var counts = {};
      FLEET_STATES.forEach(function (s) { counts[s[0]] = 0; });
      machines.forEach(function (m) { counts[fleetStateOf(m)]++; });
      var total = machines.length;
      if (!total) return "";

      function pct(c) { return total ? (Math.round(c * 1000 / total) / 10) + "%" : "—"; }

      var cards = [
        { key: "all", n: total, label: "Total Machines", sub: "All sites",
          icon: "machine", tone: "info" },
        { key: "Operating", n: counts["Operating"], label: "Operating", sub: pct(counts["Operating"]),
          icon: "play", tone: "ok" },
        { key: "Standby", n: counts["Standby"], label: "Standby", sub: pct(counts["Standby"]),
          icon: "clock", tone: "brand" },
        { key: "Breakdown", n: counts["Breakdown"], label: "Breakdown", sub: pct(counts["Breakdown"]),
          icon: "issue", tone: "bad" },
        { key: "Never Reported", n: counts["Never Reported"], label: "Never Reported",
          sub: pct(counts["Never Reported"]), icon: "question", tone: "grey" }
      ];

      return '<div class="istats">' + cards.map(function (c) {
        var on = FLT.state === c.key;
        return '<button type="button" class="istat tone-' + c.tone + (on ? " on" : "") +
                 '" data-fleet="' + esc(c.key) + '" aria-pressed="' + (on ? "true" : "false") + '">' +
                 '<span class="istat-ic">' + UI.icon(c.icon) + "</span>" +
                 '<span class="istat-body">' +
                   '<span class="istat-top"><b>' + c.n + "</b><i>" + escHtml(c.label) + "</i></span>" +
                   '<span class="istat-sub">' + escHtml(c.sub) + "</span>" +
                 "</span>" +
               "</button>";
      }).join("") + "</div>" + staleNote(machines);
    }

    // ================= NEEDS ATTENTION (element 2) =================
    var esc = UI.esc, escHtml = UI.escHtml;

    // open site blocks + scroll survive the reload-after-save pattern
    var OPEN = UI.openState("sites");
    function reloadKeepingPlace() {
      OPEN.saveFrom(document.getElementById("sites"));
      UI.saveScroll();
      window.location.reload();
    }

    function attnChip(machineCode, label, tip) {
      return '<button type="button" class="chase-pile" data-machine="' + esc(machineCode) + '"' +
             (tip ? ' title="' + esc(tip) + '"' : "") + ">" + escHtml(label) + "</button>";
    }
    function attnRow(title, chips) {
      return '<div class="chase-row"><span class="chase-label">' + title +
             ' <span class="chase-count">' + chips.length + "</span></span>" +
             '<span class="chase-chips">' + chips.join("") + "</span></div>";
    }

    function needsAttention(machines, issuesByMachine) {
      // 1) breakdown (last reported state)
      var broken = machines.filter(function (m) { return fleetStateOf(m) === "Breakdown"; })
        .map(function (m) {
          return attnChip(m.machine_code, m.machine_code + (m.current_site ? " · " + m.current_site : ""));
        });

      // 2) open machine-linked issues; tooltip lists them
      var withIssues = machines.filter(function (m) { return (m.open_issues || 0) > 0; })
        .map(function (m) {
          var list = issuesByMachine[m.machine_code] || [];
          var tip = list.map(function (i) {
            return "#" + i.issue_number + " " + (i.title || "") + " (" + i.status + ")";
          }).join("\n");
          return attnChip(m.machine_code,
                          m.machine_code + " · " + m.open_issues + " issue" + (m.open_issues === 1 ? "" : "s"),
                          tip);
        });

      // 3) routine service overdue (dormant until hour meters flow)
      var serviceDue = machines.filter(function (m) { return m.hour_service_overdue === true; })
        .map(function (m) {
          var over = (m.hours_to_service === null || m.hours_to_service === undefined)
            ? "" : " · " + Math.abs(Math.round(m.hours_to_service)) + "h over";
          return attnChip(m.machine_code, m.machine_code + over);
        });

      // 4) planned move overdue — the plan's date passed but nobody pressed
      //    Execute (0048; replaces the old dormant next_move_date rule)
      var moveDue = MACHINE_PLANS.filter(function (p) {
        return daysSince(p.planned_date) > 0;
      }).map(function (p) {
        var days = daysSince(p.planned_date);
        return attnChip(p.machine_code,
          p.machine_code + " → " + (p.to_project_code || "unassigned") +
          " planned " + p.planned_date + " — " + days + " day" + (days === 1 ? "" : "s") + " ago");
      });

      // 5) drift watchdog (0050) — current state vs the LATEST history row.
      //    History edits never touch state by design; this rule makes any
      //    disagreement between the two records visible instead of silent.
      //    MOVELOG is office-only (gated read) and newest-first, so [0] is
      //    the machine's latest move; machines with no history are skipped.
      var stateDrift = [];
      machines.forEach(function (m) {
        var t = (MOVELOG[m.machine_id] || [])[0];
        if (!t) return;
        var cur = m.current_site || "unassigned";
        if (cur !== t.to_project) {
          stateDrift.push(attnChip(m.machine_code,
            m.machine_code + " · at " + cur + ", history says " + t.to_project,
            "Current site and the latest history row disagree — a raw update bypassed the move functions, or the history was edited past the truth. Fix whichever record is wrong (Move for the roster, edit/delete for the history)."));
        } else if (m.current_site && m.mobilised_date && t.effective_date &&
                   m.mobilised_date !== t.effective_date) {
          stateDrift.push(attnChip(m.machine_code,
            m.machine_code + " · mobilised " + m.mobilised_date + ", history " + t.effective_date,
            "Same site, different dates — if you corrected one date, correct the other too (Edit machine → mobilised, or edit the history row's date)."));
        }
      });

      var sections = [];
      if (broken.length)     sections.push(attnRow("Breakdown", broken));
      if (withIssues.length) sections.push(attnRow("Open issues", withIssues));
      if (serviceDue.length) sections.push(attnRow("Service overdue", serviceDue));
      if (moveDue.length)    sections.push(attnRow("Move overdue", moveDue));
      if (stateDrift.length) sections.push(attnRow("State vs history", stateDrift));

      var total = broken.length + withIssues.length + serviceDue.length + moveDue.length +
                  stateDrift.length;
      var body = total === 0
        ? '<div class="muted-line">&#10003; Nothing needs attention.</div>'
        : sections.join("");
      return '<details class="zone chase-panel panel-eq" open>' +
             '<summary><span class="panel-ic tone-bad">' + UI.icon("alert") + "</span>" +
             '<span class="zone-name">Needs Attention</span>' +
             '<span class="zone-count">' + total + " item" + (total === 1 ? "" : "s") + "</span></summary>" +
             '<div class="chase-body">' + body + "</div>" +
             '<div class="panel-foot"><a href="issues.html">View all issues &rarr;</a></div>' +
             "</details>";
    }

    // ================= MACHINES BY SITE (element 3) =================
    function setAllZones(open) {
      document.querySelectorAll("details.zone").forEach(function (d) { d.open = open; });
    }

    var typeLabel = UI.label;   // machine types read in plain language

    // state badge + report date; date turns amber when 3+ days stale
    function lastReportCell(m) {
      if (!m.last_status) return '<span class="muted-line">never</span>';
      var cls = m.last_status === "operating" ? "approved"
              : m.last_status === "breakdown" ? "breakdown" : "gray";
      var d = daysSince(m.last_status_date);
      // relative reads faster than a raw date (designer review, Phase A);
      // the actual date stays one hover away
      var rel = d === null ? "" : d <= 0 ? "Today" : d === 1 ? "Yesterday" : d + " days ago";
      var dateHtml = m.last_status_date
        ? ' <span class="' + (d !== null && d >= 3 ? "stale-warn" : "muted") +
          '" title="' + esc(m.last_status_date) + '">' + rel + "</span>"
        : "";
      return UI.badge(m.last_status, "badge-" + cls) + dateHtml;
    }

    // Open-issues COUNT (designer review, Phase A): "Problems: Yes" for an
    // issue resolved weeks ago read as a live fault. The number counts only
    // open/in-progress; the hover still tells the full track record.
    function commentCell(machineIssues) {
      if (!machineIssues || !machineIssues.length) return '<span class="muted-line">0</span>';
      var open = machineIssues.filter(function (i) {
        return i.status === "open" || i.status === "in_progress";
      }).length;
      var tip = machineIssues.map(function (i) {
        return "#" + i.issue_number + " " + (i.title || "") + " (" + UI.label(i.status) + ")";
      }).join("\n");
      if (!open) {
        return '<span class="muted-line" title="' + esc(tip) + '">0</span>';
      }
      return '<span class="badge badge-anomaly" title="' + esc(tip) + '">' + open + "</span>";
    }

    // Service condition at a glance (designer review, Phase A): the remaining
    // hours are the decision number; the raw due meter is hover detail.
    function serviceCell(m) {
      if (!m.service_interval_hours || m.next_service_due_hours === null ||
          m.next_service_due_hours === undefined) return '<span class="muted-line">—</span>';
      if (m.current_hour_meter === null || m.current_hour_meter === undefined) {
        return '<span class="badge badge-gray" title="No hour-meter reading yet — due at ' +
               m.next_service_due_hours + ' h">No Reading</span>';
      }
      // round to one decimal — floating-point subtraction prints garbage
      // like 337.60000000000036 otherwise (owner screenshot 2026-08-04)
      var rem = Math.round((m.next_service_due_hours - m.current_hour_meter) * 10) / 10;
      var due = "Due at " + m.next_service_due_hours + " h · meter " + m.current_hour_meter + " h";
      if (rem <= 0) {
        return '<span class="badge badge-critical" title="' + esc(due) + '">Overdue ' +
               Math.abs(rem) + " h</span>";
      }
      if (rem < 100) {
        return '<span class="badge badge-medium" title="' + esc(due) + '">Due Soon · ' + rem + " h</span>";
      }
      return '<span title="' + esc(due) + '">' + rem + " h left</span>";
    }

    // days at the current site; the mobilised date stays on hover
    function onSiteCell(m) {
      if (!m.mobilised_date) return '<span class="muted-line">—</span>';
      var d = daysSince(m.mobilised_date);
      return '<span title="Mobilised ' + esc(m.mobilised_date) + '">' +
             (d === null ? escHtml(m.mobilised_date) : d <= 0 ? "Today" : d === 1 ? "1 day" : d + " days") +
             "</span>";
    }

    // ================= RECORD CARD (element 4) =================
    var dstr = UI.dstr;
    function numOr(v, unit) {
      return (v === null || v === undefined) ? "—" : Math.round(Number(v)) + (unit ? " " + unit : "");
    }
    // parts jsonb: expected [{name, qty}] — render compactly, skip when absent
    function partsText(parts) {
      if (!parts) return "";
      if (typeof parts === "string") { try { parts = JSON.parse(parts); } catch (e) { return ""; } }
      if (!Array.isArray(parts) || !parts.length) return "";
      return parts.map(function (p) {
        return (p.name || "?") + (p.qty ? " ×" + p.qty : "");
      }).join(", ");
    }

    function serviceListHtml(list) {
      if (!list || !list.length)
        return '<div class="muted-line">No servicing recorded for this machine yet.</div>';
      return list.map(function (r) {
        var cls = r.service_type === "repair" ? "badge-pending" : "badge-approved";
        var bits = [];
        if (r.hour_meter !== null && r.hour_meter !== undefined) bits.push("hour meter " + Math.round(Number(r.hour_meter)));
        var parts = partsText(r.parts);
        if (parts) bits.push("parts: " + escHtml(parts));
        if (r.vendor) bits.push("vendor: " + escHtml(r.vendor));
        if (r.cost_total) bits.push("RM " + Number(r.cost_total).toFixed(2));
        if (r.performed_by_name) bits.push("by " + escHtml(r.performed_by_name));
        return '<div class="pc-line"><strong>' + dstr(r.service_date) + "</strong> " +
               '<span class="badge ' + cls + '">' + escHtml(UI.label(r.service_type || "?")) + "</span> " +
               escHtml(r.description || "") +
               (bits.length ? ' <span class="pc-meta-inline">· ' + bits.join(" · ") + "</span>" : "") +
               (r.remarks ? '<div class="pc-meta">' + escHtml(r.remarks) + "</div>" : "") +
               "</div>";
      }).join("");
    }

    function activityListHtml(list) {
      if (!list || !list.length)
        return '<div class="muted-line">No reports in the last 14 days.</div>';
      return list.slice(0, 7).map(function (a) {
        var cls = a.status === "operating" ? "badge-approved"
                : a.status === "breakdown" ? "badge-breakdown" : "badge-gray";
        var bits = [];
        if (a.hours_operated !== null && a.hours_operated !== undefined) bits.push(a.hours_operated + "h operated");
        if (a.fuel_consumed_l) bits.push(Math.round(a.fuel_consumed_l) + " L diesel");
        if (a.refuel_l) bits.push("refuel " + Math.round(a.refuel_l) + " L");
        if (a.diesel_balance_l !== null && a.diesel_balance_l !== undefined) bits.push("balance " + Math.round(a.diesel_balance_l) + " L");
        return '<div class="pc-line"><strong>' + dstr(a.log_date) + "</strong> " +
               '<span class="badge ' + cls + '">' + escHtml(UI.label(a.status || "?")) + "</span>" +
               (bits.length ? ' <span class="pc-meta-inline">' + bits.join(" · ") + "</span>" : "") +
               (a.remarks ? '<div class="pc-meta">' + escHtml(a.remarks) + "</div>" : "") +
               "</div>";
      }).join("") + (list.length > 7
        ? '<div class="pc-meta">+ ' + (list.length - 7) + " older report(s) in the last 14 days</div>" : "");
    }

    function issueListHtml(list) {
      if (!list || !list.length)
        return '<div class="muted-line">No problems recorded against this machine.</div>';
      var sorted = list.slice().sort(function (a, b) {
        return String(b.raised_date || "").localeCompare(String(a.raised_date || ""));
      });
      return sorted.map(function (i) {
        var st = i.status || "";
        var cls = (st === "open") ? "open" : (st === "in_progress") ? "in_progress" : "resolved";
        var meta = [dstr(i.raised_date) + (i.resolved_date ? " → resolved " + dstr(i.resolved_date) : "")];
        if (i.priority) meta.push(escHtml(UI.label(i.priority)));
        if (i.raised_by_name_resolved) meta.push("raised by " + escHtml(i.raised_by_name_resolved));
        var latest = i.latest_action
          ? '<div class="pc-latest">latest action: ' + escHtml(i.latest_action) +
            (i.latest_action_date ? " (" + Dash.klDateTime(i.latest_action_date) + ")" : "") + "</div>"
          : "";
        return '<div class="pc-issue"><strong>#' + i.issue_number + "</strong> " + escHtml(i.title || "") +
               ' <span class="badge badge-' + cls + '">' + escHtml(UI.label(st)) + "</span>" +
               '<div class="pc-meta">' + meta.join(" · ") + "</div>" + latest + "</div>";
      }).join("");
    }

    // office/management only: reassign the machine from its record card.
    // The database re-checks the caller and logs the move (0039) — this
    // control is convenience, never the guard.
    var MOVE = { can: false, projects: [] };
    // toolbar + fleet-card filters. state is shared: pressing a card and
    // choosing from the Status dropdown drive the same value.
    var FLT = { state: "all", q: "", site: "all" };

    function machineMatches(m) {
      if (FLT.state !== "all" && fleetStateOf(m) !== FLT.state) return false;
      if (FLT.site !== "all" && (m.current_site || "Unassigned") !== FLT.site) return false;
      if (FLT.q) {
        var hay = [m.machine_code, m.machine_type, m.brand, m.model, m.registration_no]
          .join(" ").toLowerCase();
        if (hay.indexOf(FLT.q) === -1) return false;
      }
      return true;
    }
    // 0044 operations data: 30d utilization + tagged productivity per machine,
    // machine move history (transfer_log), machines by id for the edit form
    var UTIL = {}, PROD = {}, MOVELOG = {}, MACHINES_BY_ID = {}, DIR_BY_CODE = {};
    // 0048 movement planning: this page's PLANNED machine plans (list + by id)
    var MACHINE_PLANS = [], PLANS_BY_MACHINE = {};
    var MACHINE_STATUSES = ["active", "maintenance", "idle", "decommissioned"];

    // parts entry = one row per part (name box + qty number box) — no format
    // to remember, nothing to mis-parse; blank-name rows are simply skipped
    function partRowHtml() {
      return '<span class="part-row">' +
             '<input type="text" class="part-name" size="16" placeholder="Part name">' +
             '<input type="number" class="part-qty" min="1" step="1" value="1" title="Quantity">' +
             '<button type="button" data-action="mc-part-del" title="Remove this part">&times;</button>' +
             "</span>";
    }
    function collectParts(host) {
      var parts = [];
      host.querySelectorAll(".part-row").forEach(function (row) {
        var n = row.querySelector(".part-name").value.trim();
        var q = Math.max(1, Math.round(Number(row.querySelector(".part-qty").value) || 1));
        if (n) parts.push({ name: n, qty: q });
      });
      return parts.length ? parts : null;
    }

    function mcEditForm(m) {
      var typeOpts = MACHINE_TYPES.map(function (t) {
        return '<option value="' + t + '"' + (t === m.machine_type ? " selected" : "") + ">" +
               UI.label(t) + "</option>";
      }).join("");
      var stOpts = MACHINE_STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (s === m.machine_status ? " selected" : "") + ">" + UI.label(s) + "</option>";
      }).join("");
      return '<div class="claim-form">' +
        "<strong>Edit " + escHtml(m.machine_code) + "</strong>" +
        '<label>Type <select id="me-type">' + typeOpts + "</select></label>" +
        '<label>Brand <input id="me-brand" size="10" value="' + esc(m.brand || "") + '"></label>' +
        '<label>Model <input id="me-model" size="10" value="' + esc(m.model || "") + '"></label>' +
        '<label>Reg No <input id="me-reg" size="10" value="' + esc(m.registration_no || "") + '"></label>' +
        '<label>Serial <input id="me-serial" size="12" value="' + esc(m.serial_number || "") + '"></label>' +
        '<label>Year <input id="me-year" type="number" min="1980" max="2100" value="' + (m.year_manufactured || "") + '"></label>' +
        '<label>Service Interval (h) <input id="me-interval" type="number" min="0" step="50" value="' + (m.service_interval_hours || "") + '"></label>' +
        '<label>Status <select id="me-status">' + stOpts + "</select></label>" +
        '<label>Mobilised <input id="me-mobilised" type="date" value="' + esc(m.mobilised_date || "") +
          '" title="Correction only — Move stamps this itself (backdatable there too)"></label>' +
        '<label class="mc-check"><input type="checkbox" id="me-clearmobilised"> clear mobilised</label>' +
        '<button type="button" data-action="mc-edit-save" data-machine-id="' + m.machine_id + '">Save</button>' +
        '<button type="button" data-action="mc-cancel" data-machine-id="' + m.machine_id + '">Cancel</button>' +
        "</div>";
    }

    function mcServiceForm(m) {
      return '<div class="claim-form">' +
        "<strong>Log Service — " + escHtml(m.machine_code) + "</strong>" +
        '<label>Date <input id="ms-date" type="date" value="' + Dash.todayKL() + '"></label>' +
        '<label>Type <select id="ms-type">' +
          '<option value="routine">routine</option><option value="repair">repair</option>' +
          '<option value="inspection">inspection</option><option value="other">other</option></select></label>' +
        '<label>description <input id="ms-desc" size="26"></label>' +
        '<label>Hour Meter <input id="ms-hm" type="number" min="0" placeholder="Optional"></label>' +
        '<label>Parts Used <span id="ms-parts-rows">' + partRowHtml() + "</span>" +
        '<button type="button" data-action="mc-part-add" data-machine-id="' + m.machine_id + '">+ part</button></label>' +
        '<label>Cost RM <input id="ms-cost" type="number" min="0" step="0.01" placeholder="Optional"></label>' +
        '<label>Vendor <input id="ms-vendor" size="12" placeholder="Optional"></label>' +
        '<label>Remarks <input id="ms-remarks" size="16"></label>' +
        '<button type="button" data-action="mc-service-save" data-machine-id="' + m.machine_id + '">Save service</button>' +
        '<button type="button" data-action="mc-cancel" data-machine-id="' + m.machine_id + '">Cancel</button>' +
        "</div>";
    }

    function mcHoursForm(m) {
      return '<div class="claim-form">' +
        "<strong>Hour Meter — " + escHtml(m.machine_code) + "</strong>" +
        '<label>Reading (h) <input id="mh-hours" type="number" min="0" value="' +
          (m.current_hour_meter === null || m.current_hour_meter === undefined ? "" : m.current_hour_meter) + '"></label>' +
        '<label>Date <input id="mh-date" type="date" value="' + Dash.todayKL() + '"></label>' +
        '<button type="button" data-action="mc-hours-save" data-machine-id="' + m.machine_id + '">Save reading</button>' +
        '<button type="button" data-action="mc-cancel" data-machine-id="' + m.machine_id + '">Cancel</button>' +
        '<span class="muted-line">lights the service-due tracking (interval is already set)</span>' +
        "</div>";
    }
    function moveControl(m) {
      if (!MOVE.can) return "";
      var opts = ['<option value="">move to…</option>'].concat(
        MOVE.projects.filter(function (p) {
          return (p.status === "active" || p.status === "completed") &&
                 p.project_code.indexOf("TEST") !== 0;
        }).map(function (p) {
          // code AND name — the office knows sites by name, no cross-checking
          return '<option value="' + p.project_id + '">' +
                 escHtml(p.project_code + " — " + (p.project_name || "")) +
                 (p.status === "completed" ? " (completed)" : "") + "</option>";
        }),
        ['<option value="unassign">— unassigned —</option>']).join("");
      return '<div class="pc-line"><span class="move-ctl">' +
             '<select data-machine-id="' + m.machine_id + '">' + opts + "</select>" +
             '<input type="date" id="mv-date-' + m.machine_id + '" value="' + Dash.todayKL() +
             '" title="When the move really happened — backdate for corrections (mobilised date gets THIS date)">' +
             '<input type="text" id="mv-remarks-' + m.machine_id + '" size="10" placeholder="Remarks">' +
             '<button type="button" data-action="move-machine" data-machine-id="' + m.machine_id + '">Move</button>' +
             "</span></div>";
    }

    // ---- movement planning (0048) ------------------------------------------
    // Plans are INTENTIONS — they never move anything by themselves. Execute
    // = "the lorry actually went": it moves the machine through the same
    // validated path as the Move button and links the transfer_log row.
    function planButtons(p) {
      if (!MOVE.can) return "";
      var label = (p.machine_code || p.full_name || "") + " → " + (p.to_project_code || "unassigned");
      // Execute is the primary action (blue); Cancel stays neutral so the
      // destructive one is never the easy one to hit by reflex
      return '<span class="move-ctl mv-actions">' +
             '<button type="button" class="btn-primary" data-action="mp-execute" data-plan-id="' + p.plan_id +
             '" data-label="' + esc(label) + '">Execute now</button>' +
             '<button type="button" data-action="mp-cancel" data-plan-id="' + p.plan_id +
             '" data-label="' + esc(label) + '">Cancel</button></span>';
    }

    // this machine's planned moves inside the record card, plus "Plan move…"
    function plannedMovesHtml(m) {
      var plans = PLANS_BY_MACHINE[m.machine_id] || [];
      var lines = plans.map(function (p) {
        var days = daysSince(p.planned_date);
        var late = days !== null && days > 0;
        var dest = p.to_project_code
          ? escHtml(p.to_project_code + (p.to_project_name ? " — " + p.to_project_name : ""))
          : "unassigned (mob out)";
        return '<div class="pc-line"><span class="' + (late ? "stale-warn" : "") + '">' +
               dstr(p.planned_date) +
               (late ? " — planned " + days + " day" + (days === 1 ? "" : "s") + " ago" : "") +
               "</span> &rarr; " + dest +
               (p.remarks ? ' <span class="muted">(' + escHtml(p.remarks) + ")</span>" : "") +
               planButtons(p) + "</div>";
      }).join("");
      var control = MOVE.can
        ? '<div class="pc-line"><button type="button" data-action="mp-plan" data-machine-id="' +
          m.machine_id + '">Plan move…</button></div>' +
          '<div id="mpf-' + m.machine_id + '"></div>'
        : "";
      if (!lines && !control) return "";
      return (lines
        ? '<div class="pc-line" style="margin-top:4px"><strong>Planned Moves</strong></div>' + lines
        : "") + control;
    }

    // mini form: date · destination (same picker filter as Move) · remarks
    function planFormHtml(m) {
      var opts = ['<option value="">destination…</option>'].concat(
        MOVE.projects.filter(function (p) {
          return (p.status === "active" || p.status === "completed") &&
                 p.project_code.indexOf("TEST") !== 0;
        }).map(function (p) {
          return '<option value="' + p.project_id + '">' +
                 escHtml(p.project_code + " — " + (p.project_name || "")) +
                 (p.status === "completed" ? " (completed)" : "") + "</option>";
        }),
        ['<option value="unassign">— mob out / unassigned —</option>']).join("");
      return '<div class="claim-form">' +
        "<strong>Plan Move — " + escHtml(m.machine_code) + "</strong>" +
        '<label>When <input id="mp-date-' + m.machine_id + '" type="date" value="' + Dash.todayKL() + '"></label>' +
        '<label>To <select id="mp-dest-' + m.machine_id + '">' + opts + "</select></label>" +
        '<label>Remarks <input id="mp-remarks-' + m.machine_id + '" size="16" placeholder="Optional"></label>' +
        '<button type="button" data-action="mp-save" data-machine-id="' + m.machine_id + '">Save plan</button>' +
        '<button type="button" data-action="mp-form-cancel" data-machine-id="' + m.machine_id + '">Cancel</button>' +
        "</div>";
    }

    // ---- movement history maintenance (0050) --------------------------------
    // The log shows WHEN it really happened (effective_date; entry time in the
    // tooltip). The office maintains its own history: fix a row's date/remarks,
    // delete a wrong row, or backfill a pre-dashboard move — backfill NEVER
    // touches the current site (that's what Move is for).
    function movementHistoryHtml(m) {
      var moves = MOVELOG[m.machine_id] || [];
      var lines = moves.slice(0, 6).map(function (t) {
        return '<div class="pc-line"><strong title="entered ' + esc(Dash.klDateTime(t.moved_at)) + '">' +
               dstr(t.effective_date) + "</strong> " +
               escHtml(t.from_project) + " &rarr; " + escHtml(t.to_project) +
               (t.source === "backfill" ? ' <span class="badge badge-gray">backfill</span>' : "") +
               (t.remarks ? ' <span class="muted">(' + escHtml(t.remarks) + ")</span>" : "") +
               ' <span class="muted">by ' + escHtml(t.moved_by_name || t.source) + "</span>" +
               (MOVE.can
                 ? ' <span class="move-ctl">' +
                   '<button type="button" data-action="th-edit" data-transfer-id="' + t.transfer_id +
                   '" data-machine-id="' + m.machine_id + '" data-date="' + esc(t.effective_date) +
                   '" data-remarks="' + esc(t.remarks || "") + '">edit</button>' +
                   '<button type="button" class="danger" data-action="th-del" data-transfer-id="' +
                   t.transfer_id + '">delete</button></span>'
                 : "") +
               "</div>";
      }).join("");
      if (moves.length > 6) {
        lines += '<div class="pc-meta">+ ' + (moves.length - 6) + " older move(s) recorded</div>";
      }
      if (!lines && !MOVE.can) return "";
      var control = MOVE.can
        ? '<div class="pc-line"><button type="button" data-action="th-add" data-machine-id="' +
          m.machine_id + '">Add past move…</button></div>' +
          '<div id="thf-' + m.machine_id + '"></div>'
        : "";
      return "<div><h3>Movement history</h3>" +
             (lines || '<div class="muted-line">No moves recorded yet.</div>') + control + "</div>";
    }

    function thEditForm(machineId, transferId, date, remarks) {
      return '<div class="claim-form">' +
        "<strong>Fix history row</strong>" +
        '<label>Happened On <input id="th-date-' + machineId + '" type="date" value="' + esc(date) + '"></label>' +
        '<label>Remarks <input id="th-remarks-' + machineId + '" size="16" value="' + esc(remarks) + '"></label>' +
        '<button type="button" data-action="th-edit-save" data-transfer-id="' + transferId +
        '" data-machine-id="' + machineId + '">Save</button>' +
        '<button type="button" data-action="th-form-cancel" data-machine-id="' + machineId + '">Cancel</button>' +
        '<span class="muted-line">wrong sites? delete the row and add a past move instead</span>' +
        "</div>";
    }

    function thAddForm(m) {
      var opts = MOVE.projects.filter(function (p) {
        return (p.status === "active" || p.status === "completed") &&
               p.project_code.indexOf("TEST") !== 0;
      }).map(function (p) {
        return '<option value="' + p.project_id + '">' +
               escHtml(p.project_code + " — " + (p.project_name || "")) + "</option>";
      }).join("");
      return '<div class="claim-form">' +
        "<strong>Add past move — " + escHtml(m.machine_code) + "</strong>" +
        '<label>From <select id="tha-from-' + m.machine_id + '"><option value="">— unassigned —</option>' +
          opts + "</select></label>" +
        '<label>To <select id="tha-to-' + m.machine_id + '"><option value="">— unassigned —</option>' +
          opts + "</select></label>" +
        '<label>Happened On <input id="tha-date-' + m.machine_id + '" type="date"></label>' +
        '<label>Remarks <input id="tha-remarks-' + m.machine_id + '" size="14" placeholder="Optional"></label>' +
        '<button type="button" data-action="th-add-save" data-machine-id="' + m.machine_id + '">Add to history</button>' +
        '<button type="button" data-action="th-form-cancel" data-machine-id="' + m.machine_id + '">Cancel</button>' +
        '<span class="muted-line">history only — the current site is NOT changed (use Move for that)</span>' +
        "</div>";
    }

    // ================= UPCOMING MOVES (0048) =================
    // every planned machine move, earliest first; overdue rows amber
    // the panel shows the next few; the footer link opens the rest in place
    var MOVES_CAP = 3, MOVES_ALL = false;

    function upcomingMovesZone() {
      if (!MACHINE_PLANS.length) return "";
      var overdue = 0;
      var shown = MOVES_ALL ? MACHINE_PLANS : MACHINE_PLANS.slice(0, MOVES_CAP);
      // count overdue across ALL plans, not just the visible slice
      MACHINE_PLANS.forEach(function (p) {
        var d = daysSince(p.planned_date);
        if (d !== null && d > 0) overdue++;
      });
      var rows = shown.map(function (p) {
        var days = daysSince(p.planned_date);
        var late = days !== null && days > 0;
        var dest = p.to_project_code
          ? escHtml(p.to_project_code + (p.to_project_name ? " — " + p.to_project_name : ""))
          : "unassigned (mob out)";
        // two columns: what is moving where on the left, the actions hard
        // right — inline buttons used to break the sentence mid-line
        return '<div class="mv-row">' +
                 '<div class="mv-text">' +
                   '<div class="mv-head"><strong>' + escHtml(p.machine_code || "") + "</strong>" +
                     ' <span class="mv-arrow">&rarr;</span> ' + dest + "</div>" +
                   '<div class="mv-sub' + (late ? " stale-warn" : "") + '">Planned ' +
                     dstr(p.planned_date) +
                     (late ? " — " + days + " day" + (days === 1 ? "" : "s") + " ago" : "") +
                     (p.created_by_name ? " by " + escHtml(p.created_by_name) : "") +
                     (p.remarks ? " · " + escHtml(p.remarks) : "") +
                   "</div>" +
                 "</div>" +
                 planButtons(p) +
               "</div>";
      }).join("");
      // chase-panel gives it the same card as Needs Attention — without it the
      // moves list sat as bare text beside a boxed panel
      return '<details class="zone chase-panel panel-eq" open>' +
             '<summary><span class="panel-ic tone-brand">' + UI.icon("machine") + "</span>" +
             '<span class="zone-name">Upcoming Moves</span>' +
             '<span class="zone-count">' + MACHINE_PLANS.length + " planned" +
             (overdue ? " · " + overdue + " overdue" : "") + "</span></summary>" +
             '<div class="chase-body">' + rows + "</div>" +
             // there is no separate moves page to link to, so the link does
             // the only real thing available: opens the rest of the list here
             '<div class="panel-foot">' +
               (MACHINE_PLANS.length > MOVES_CAP
                 ? '<a href="#" data-action="moves-toggle">' +
                   (MOVES_ALL ? "Show fewer &larr;" : "View all " + MACHINE_PLANS.length + " moves &rarr;") +
                   "</a>"
                 : '<span class="muted">All planned moves shown</span>') +
             "</div></details>";
    }

    function machineCard(m, services, activity, issues) {
      var chips = [];
      if (m.registration_no) chips.push("Reg " + escHtml(m.registration_no));
      if (m.serial_number) chips.push("S/N " + escHtml(m.serial_number));
      if (m.year_manufactured) chips.push("Year " + m.year_manufactured);

      var head =
        '<div class="pc-head"><strong>' + escHtml(m.machine_code) + "</strong> " +
        escHtml(typeLabel(m.machine_type)) +
        (m.brand || m.model ? " · " + escHtml([m.brand, m.model].filter(Boolean).join(" ")) : "") +
        (chips.length ? ' <span class="pc-chips">' + chips.join(" · ") + "</span>" : "") + "</div>";

      var where =
        "<div><h3>Whereabouts</h3>" +
        '<div class="pc-line">Site: ' + (m.current_site
          ? escHtml(m.current_site) + (m.current_site_name ? " — " + escHtml(m.current_site_name) : "")
          : "unassigned") + "</div>" +
        '<div class="pc-line">Mobilised: ' + dstr(m.mobilised_date) + "</div>" +
        '<div class="pc-line">Next move: ' + dstr(m.next_move_date) + "</div>" +
        moveControl(m) + plannedMovesHtml(m) + "</div>";

      var spend = 0;
      (services || []).forEach(function (r) { spend += Number(r.cost_total) || 0; });

      var tracking =
        "<div><h3>Service tracking</h3>" +
        '<div class="pc-line">Hour meter: ' + numOr(m.current_hour_meter, "h") + "</div>" +
        '<div class="pc-line">Next service due: ' + numOr(m.next_service_due_hours, "h") +
        (m.hour_service_overdue ? ' <span class="badge badge-critical">overdue</span>' : "") + "</div>" +
        '<div class="pc-line">Last touched: ' + dstr(m.last_touched_date) + "</div>" +
        (spend ? '<div class="pc-line">Recorded spend: <strong>RM ' + spend.toFixed(2) + "</strong></div>" : "") +
        "</div>";

      // usage (0044 views): 30d utilization + tagged rig productivity
      var util = UTIL[m.machine_id];
      var prod = PROD[m.machine_id];
      var usage =
        "<div><h3>Usage (30 days)</h3>" +
        (util && Number(util.days_reported) > 0
          ? '<div class="pc-line">' + util.days_operating + " operating · " + util.days_standby +
            " standby · " + util.days_breakdown + " breakdown" +
            (Number(util.days_maintenance) ? " · " + util.days_maintenance + " maintenance" : "") + "</div>" +
            ((Number(util.hours_operated) || Number(util.fuel_l))
              ? '<div class="pc-line">' + util.hours_operated + " h operated · " +
                Math.round(util.fuel_l) + " L diesel</div>"
              : "")
          : '<div class="pc-line muted-line">No reports in the last 30 days.</div>') +
        (prod
          ? '<div class="pc-line">Tagged boring: ' + prod.metres_bored + " m · " +
            prod.piles_bored_on + " pile" + (Number(prod.piles_bored_on) === 1 ? "" : "s") +
            " · last " + dstr(prod.last_activity_date) + "</div>"
          : "") +
        "</div>";

      // movement history (transfer_log; maintainable since 0050)
      var movesHtml = movementHistoryHtml(m);

      // office controls (0044): edit / log service / hour meter — DB re-checks
      var ops = MOVE.can
        ? '<div class="claim-actions" style="padding:6px 0 0">' +
          '<button type="button" data-action="mc-edit" data-machine-id="' + m.machine_id + '">Edit machine…</button>' +
          '<button type="button" data-action="mc-service" data-machine-id="' + m.machine_id + '">Log service…</button>' +
          '<button type="button" data-action="mc-hours" data-machine-id="' + m.machine_id + '">Update hour meter…</button>' +
          '</div><div class="mc-form" id="mcf-' + m.machine_id + '"></div>'
        : "";

      return '<tr class="pile-card-row" hidden><td colspan="8"><div class="pile-card">' +
             head + ops +
             '<div class="pc-grid"><div><h3>Servicing history</h3>' + serviceListHtml(services) + "</div>" +
             '<div class="pc-side">' + where + tracking + usage + "</div></div>" +
             "<div><h3>Recent activity (14 days)</h3>" + activityListHtml(activity) + "</div>" +
             movesHtml +
             "<div><h3>Track record</h3>" + issueListHtml(issues) + "</div>" +
             "</div></td></tr>";
    }

    var THEAD =
      "<thead><tr>" +
      "<th>Machine</th><th>Type</th><th>Brand / Model</th>" +
      '<th title="Latest daily report: state, and how long ago (real date on hover)">Last Report</th>' +
      '<th class="num" title="Diesel consumed, last 7 days (L)">Diesel 7d</th>' +
      '<th title="Hours left until the next routine service (due meter on hover)">Service</th>' +
      '<th title="Days at this site (mobilised date on hover)">On Site</th>' +
      '<th class="num" title="Issues currently OPEN against this machine — hover for the full track record, resolved included">Open Issues</th>' +
      "</tr></thead>";

    function siteTables(machines, allIssuesByMachine, serviceByMachine, activityByMachine) {
      var groups = {};
      machines.forEach(function (m) {
        var k = m.current_site || "Unassigned";
        (groups[k] = groups[k] || []).push(m);
      });
      var keys = Object.keys(groups).sort(function (a, b) {
        if (a === "Unassigned") return 1;
        if (b === "Unassigned") return -1;
        return a.localeCompare(b);
      });

      return keys.map(function (k) {
        var list = groups[k];
        var operating = list.filter(function (m) { return m.last_status === "operating"; }).length;
        var title = k === "Unassigned" ? "Unassigned"
                  : k + (list[0].current_site_name ? " — " + escHtml(list[0].current_site_name) : "");
        // work-line scope tag (BP/SP/BP+SP) from the scope tables via the directory
        var scopeTag = "";
        var dir = DIR_BY_CODE[k];
        if (dir) {
          var t = dir.has_bored_scope && dir.has_sheet_scope ? "BP+SP"
                : dir.has_bored_scope ? "BP" : dir.has_sheet_scope ? "SP" : "";
          if (t) scopeTag = '<span class="chip chip-tag">' + t + "</span>";
        }
        var rows = list.map(function (m) {
          return '<tr class="machine-row" data-machine="' + esc(m.machine_code) + '" title="Click to open the full record">' +
            UI.td("Machine", '<span class="row-caret">&#9656;</span><strong>' + escHtml(m.machine_code) + "</strong>") +
            UI.td("Type", escHtml(typeLabel(m.machine_type))) +
            UI.td("Brand / model", escHtml([m.brand, m.model].filter(Boolean).join(" ")), "wrap") +
            UI.td("Last report", lastReportCell(m)) +
            UI.td("Diesel 7d", (m.last_status ? String(Math.round(m.diesel_last_7_days || 0)) : "—"), "num") +
            UI.td("Service", serviceCell(m)) +
            UI.td("On Site", onSiteCell(m)) +
            UI.td("Open Issues", commentCell(allIssuesByMachine[m.machine_code]), "num") +
          "</tr>" +
          machineCard(m, serviceByMachine[m.machine_code], activityByMachine[m.machine_code],
                      allIssuesByMachine[m.machine_code]);
        }).join("");
        var breakdown = list.filter(function (m) { return m.last_status === "breakdown"; }).length;
        var chips = [];
        if (scopeTag) chips.push(scopeTag);
        chips = chips.concat([
          '<span class="chip">' + list.length + " machine" + (list.length === 1 ? "" : "s") + "</span>",
          '<span class="chip' + (operating ? " chip-ok" : "") + '">' + operating + " operating</span>"]);
        if (breakdown) chips.push('<span class="chip chip-bad">' + breakdown + " breakdown</span>");
        return '<details class="zone" open data-group="' + esc(k) + '">' +
               '<summary><span class="zone-name">' + title + "</span>" +
               '<span class="group-head">' + chips.join(" ") + "</span></summary>" +
               // mach-table = one shared column ruler for every site block:
               // each site renders its own <table>, so without it each one
               // sized its columns from its own rows and the headings landed
               // on a different x in every block.
               '<div class="table-wrap zone-table table-stack"><table class="mach-table">' + THEAD +
               "<tbody>" + rows + "</tbody></table></div>" +
               "</details>";
      }).join("");
    }

    // chip click -> jump to the machine's row, open its site block + card
    function wireAttentionJumps() {
      document.getElementById("attention").addEventListener("click", function (ev) {
        var btn = ev.target.closest("button.chase-pile");
        if (!btn) return;
        var code = btn.getAttribute("data-machine").replace(/"/g, '\\"');
        var row = document.querySelector('tr.machine-row[data-machine="' + code + '"]');
        if (!row) return;
        var det = row.closest("details");
        if (det) det.open = true;
        var card = row.nextElementSibling;
        if (card && card.classList.contains("pile-card-row") && card.hidden) {
          card.hidden = false;
          row.classList.add("open");
        }
        row.scrollIntoView({ behavior: "smooth", block: "center" });
        row.classList.add("flash");
        setTimeout(function () { row.classList.remove("flash"); }, 1700);
      });
    }

    // click a machine row -> toggle its record card
    function wireCardToggles() {
      document.getElementById("sites").addEventListener("click", function (ev) {
        var tr = ev.target.closest("tr.machine-row");
        if (!tr) return;
        var card = tr.nextElementSibling;
        if (!card || !card.classList.contains("pile-card-row")) return;
        card.hidden = !card.hidden;
        tr.classList.toggle("open", !card.hidden);
      });
    }

    // "+ Add machine" (management/office): inline form -> add_machine (0040).
    // Duplicate codes are refused by the database with 'duplicate_machine_code'.
    var MACHINE_TYPES = ["boring_rig", "crawler_crane", "mobile_crane", "excavator",
                         "vibro_hammer", "lorry", "wheel_loader", "generator",
                         "compressor", "concrete_pump", "forklift", "other"];

    function wireAddMachine() {
      if (!MOVE.can) return;
      var btn = document.getElementById("add-machine-btn");
      btn.hidden = false;
      btn.addEventListener("click", function () {
        var host = document.getElementById("add-machine");
        if (host.innerHTML) { host.innerHTML = ""; return; }   // toggle
        var typeOpts = MACHINE_TYPES.map(function (t) {
          return '<option value="' + t + '">' + UI.label(t) + "</option>";
        }).join("");
        var siteOpts = '<option value="">— Unassigned —</option>' +
          MOVE.projects.filter(function (p) {
            return (p.status === "active" || p.status === "completed") &&
                   p.project_code.indexOf("TEST") !== 0;
          }).map(function (p) {
            return '<option value="' + p.project_id + '">' +
                   escHtml(p.project_code + " — " + (p.project_name || "")) +
                   (p.status === "completed" ? " (completed)" : "") + "</option>";
          }).join("");
        host.innerHTML = '<div class="claim-form">' +
          "<strong>New machine</strong>" +
          '<label>Code <input type="text" id="am-code" size="10" placeholder="e.g. BR10"></label>' +
          '<label>Type <select id="am-type">' + typeOpts + "</select></label>" +
          '<label>Brand <input type="text" id="am-brand" size="10"></label>' +
          '<label>Model <input type="text" id="am-model" size="10"></label>' +
          '<label>Registration No <input type="text" id="am-reg" size="10"></label>' +
          '<label>Site <select id="am-site">' + siteOpts + "</select></label>" +
          '<label>Service Interval (h) <input type="number" id="am-interval" min="0" step="50" placeholder="Optional"></label>' +
          '<button type="button" id="am-save">Add machine</button>' +
          '<button type="button" id="am-cancel">Cancel</button>' +
          "</div>";
        document.getElementById("am-cancel").addEventListener("click", function () {
          host.innerHTML = "";
        });
        document.getElementById("am-save").addEventListener("click", async function () {
          var code = document.getElementById("am-code").value.trim();
          if (!code) return;
          try {
            await Dash.addMachine({
              machineCode: code,
              machineType: document.getElementById("am-type").value,
              brand: document.getElementById("am-brand").value || null,
              model: document.getElementById("am-model").value || null,
              registrationNo: document.getElementById("am-reg").value || null,
              projectId: document.getElementById("am-site").value || null,
              serviceIntervalHours: document.getElementById("am-interval").value
            });
            reloadKeepingPlace();               // appears under its site
          } catch (e) {
            var msg = (e && e.message) || String(e);
            document.getElementById("error").innerHTML =
              '<div class="banner banner-red">' +
              (msg === "duplicate_machine_code"
                ? "Machine code " + escHtml(code) + " already exists."
                : "Could not add: " + escHtml(msg)) + "</div>";
          }
        });
      });
    }

    // 0044 office controls in the record card: edit / log service / hour meter.
    // Forms render into the card's mc-form host; saves reload the page.
    function wireMachineOps() {
      if (!MOVE.can) return;
      document.getElementById("sites").addEventListener("click", async function (ev) {
        var btn = ev.target.closest('button[data-action^="mc-"]');
        if (!btn) return;
        var act = btn.getAttribute("data-action");

        // part-row controls carry no machine id — handle before the lookup
        if (act === "mc-part-add") {
          var rows = document.getElementById("ms-parts-rows");
          if (rows) rows.insertAdjacentHTML("beforeend", partRowHtml());
          return;
        }
        if (act === "mc-part-del") {
          var row = btn.closest(".part-row");
          if (row) row.remove();
          return;
        }

        var id = btn.getAttribute("data-machine-id");
        var m = MACHINES_BY_ID[id];
        var host = document.getElementById("mcf-" + id);
        if (!m || !host) return;

        function fail(e) {
          var msg = (e && e.message) || String(e);
          if (msg === "machine_unassigned")
            msg = "assign the machine to a site first — hour-meter readings write a daily log row, which needs a site";
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Could not save: ' + escHtml(msg) + "</div>";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (act === "mc-edit")    { host.innerHTML = mcEditForm(m); return; }
        if (act === "mc-service") { host.innerHTML = mcServiceForm(m); return; }
        if (act === "mc-hours")   { host.innerHTML = mcHoursForm(m); return; }
        if (act === "mc-cancel")  { host.innerHTML = ""; return; }

        if (act === "mc-edit-save") {
          var newStatus = document.getElementById("me-status").value;
          if (newStatus === "decommissioned" && m.machine_status !== "decommissioned" &&
              !window.confirm("Decommission " + m.machine_code +
                              "? It leaves the move targets and the active fleet.")) return;
          try {
            await Dash.updateMachine(id, {
              machineType: document.getElementById("me-type").value,
              brand: document.getElementById("me-brand").value || null,
              model: document.getElementById("me-model").value || null,
              registrationNo: document.getElementById("me-reg").value || null,
              serialNumber: document.getElementById("me-serial").value || null,
              yearManufactured: document.getElementById("me-year").value,
              serviceIntervalHours: document.getElementById("me-interval").value,
              status: newStatus,
              mobilisedDate: document.getElementById("me-mobilised").value || null,
              clearMobilised: document.getElementById("me-clearmobilised").checked
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }

        if (act === "mc-service-save") {
          try {
            await Dash.addServiceRecord(id, {
              serviceDate: document.getElementById("ms-date").value,
              serviceType: document.getElementById("ms-type").value,
              description: document.getElementById("ms-desc").value || null,
              hourMeter: document.getElementById("ms-hm").value,
              parts: collectParts(host),
              costTotal: document.getElementById("ms-cost").value,
              vendor: document.getElementById("ms-vendor").value || null,
              remarks: document.getElementById("ms-remarks").value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }

        if (act === "mc-hours-save") {
          var hv = document.getElementById("mh-hours").value;
          if (hv === "") return;
          try {
            await Dash.setMachineHourMeter(id, hv,
              document.getElementById("mh-date").value || null);
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
      });
    }

    // move button inside a record card -> move_machine, then reload (the
    // machine reappears under its new site — self-evident feedback).
    // The date box (default today) backdates mobilised_date for catch-up
    // moves / corrections; remarks land in the transfer log.
    function wireMachineMoves() {
      document.getElementById("sites").addEventListener("click", async function (ev) {
        var btn = ev.target.closest('button[data-action="move-machine"]');
        if (!btn) return;
        var id = btn.getAttribute("data-machine-id");
        var sel = document.querySelector('select[data-machine-id="' + id + '"]');
        if (!sel || !sel.value) return;
        var dateEl = document.getElementById("mv-date-" + id);
        var remEl = document.getElementById("mv-remarks-" + id);
        try {
          await Dash.moveMachine(id, sel.value === "unassign" ? null : sel.value,
            remEl && remEl.value ? remEl.value : null,
            dateEl && dateEl.value ? dateEl.value : null);
          reloadKeepingPlace();
        } catch (e) {
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Could not move: ' + escHtml((e && e.message) || e) + "</div>";
        }
      });
    }

    // movement-plan buttons live in the record cards AND the Upcoming Moves
    // panel — one delegated listener on <main> covers both. The database
    // re-checks the caller on every call; buttons are convenience only.
    function wireMovementPlans() {
      document.getElementById("main").addEventListener("click", async function (ev) {
        var btn = ev.target.closest('button[data-action^="mp-"]');
        if (!btn) return;
        var act = btn.getAttribute("data-action");

        function fail(e) {
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Could not save: ' + escHtml((e && e.message) || e) + "</div>";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (act === "mp-plan" || act === "mp-form-cancel") {
          var id = btn.getAttribute("data-machine-id");
          var m = MACHINES_BY_ID[id];
          var host = document.getElementById("mpf-" + id);
          if (!m || !host) return;
          host.innerHTML = (act === "mp-plan" && !host.innerHTML) ? planFormHtml(m) : "";
          return;
        }

        if (act === "mp-save") {
          var mid = btn.getAttribute("data-machine-id");
          var date = document.getElementById("mp-date-" + mid).value;
          var dest = document.getElementById("mp-dest-" + mid).value;
          if (!date || !dest) return;               // destination must be chosen
          try {
            await Dash.addMovementPlan({
              machineId: mid,
              plannedDate: date,
              toProjectId: dest === "unassign" ? null : dest,
              remarks: document.getElementById("mp-remarks-" + mid).value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }

        var planId = btn.getAttribute("data-plan-id");
        var label = btn.getAttribute("data-label") || "this move";
        if (act === "mp-execute") {
          if (!window.confirm("Execute now — " + label +
              "? The machine moves immediately (this applies the real move).")) return;
          try { await Dash.executeMovementPlan(planId); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
        if (act === "mp-cancel") {
          if (!window.confirm("Cancel the planned move " + label + "?")) return;
          try { await Dash.cancelMovementPlan(planId); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
      });
    }

    // transfer-history maintenance buttons (0050) — edit/delete/backfill rows
    // in the record cards. The database re-checks the caller on every call.
    function wireTransferHistory() {
      document.getElementById("main").addEventListener("click", async function (ev) {
        var btn = ev.target.closest('button[data-action^="th-"]');
        if (!btn) return;
        var act = btn.getAttribute("data-action");
        var mid = btn.getAttribute("data-machine-id");
        var host = mid ? document.getElementById("thf-" + mid) : null;

        function fail(e) {
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Could not save: ' + escHtml((e && e.message) || e) + "</div>";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (act === "th-add") {
          if (!host) return;
          host.innerHTML = host.innerHTML ? "" : thAddForm(MACHINES_BY_ID[mid]);
          return;
        }
        if (act === "th-edit") {
          if (!host) return;
          host.innerHTML = thEditForm(mid, btn.getAttribute("data-transfer-id"),
            btn.getAttribute("data-date"), btn.getAttribute("data-remarks"));
          return;
        }
        if (act === "th-form-cancel") { if (host) host.innerHTML = ""; return; }

        if (act === "th-edit-save") {
          try {
            await Dash.updateTransfer(btn.getAttribute("data-transfer-id"), {
              effectiveDate: document.getElementById("th-date-" + mid).value || null,
              remarks: document.getElementById("th-remarks-" + mid).value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
        if (act === "th-del") {
          if (!window.confirm("Delete this history row? This cannot be undone.")) return;
          try { await Dash.deleteTransfer(btn.getAttribute("data-transfer-id")); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
        if (act === "th-add-save") {
          var d = document.getElementById("tha-date-" + mid).value;
          if (!d) return;                            // "happened on" is required
          try {
            await Dash.addPastMove({
              machineId: mid,
              fromProjectId: document.getElementById("tha-from-" + mid).value || null,
              toProjectId: document.getElementById("tha-to-" + mid).value || null,
              effectiveDate: d,
              remarks: document.getElementById("tha-remarks-" + mid).value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
      });
    }

    window.onShellReady = async function () {
      document.getElementById("sites").innerHTML = UI.empty("Loading the fleet…");
      try {
        var results = await Promise.all([
          Dash.getMachines(),
          Dash.getIssues("all"),           // full history — Comment col wants resolved ones too
          Dash.getMachineServiceHistory(), // record card: servicing history (incl. cost since 0044)
          Dash.getMachineActivity(),       // record card: last 14 days of reports
          Dash.getMyProfile(),             // move/ops controls: management/office only
          Dash.getProjectDirectory(),      // move pickers: ALL sites (pulse is BP-only)
          Dash.getMachineUtilization(),    // card usage: 30d status-day counts
          Dash.getMachineProductivity(),   // card usage: tagged boring metres/piles
          Dash.getMovementPlans()          // 0048: planned moves (never auto-applied)
        ]);
        var machines = results[0];
        MOVE.can = Dash.can("machines.edit");
        MOVE.projects = results[5];
        MOVE.projects.forEach(function (p) { DIR_BY_CODE[p.project_code] = p; });
        results[6].forEach(function (u) { UTIL[u.machine_id] = u; });
        results[7].forEach(function (p) { PROD[p.machine_id] = p; });
        machines.forEach(function (m) { MACHINES_BY_ID[m.machine_id] = m; });

        // 0048: this page only shows the machine plans still PLANNED —
        // executed/cancelled ones are history (movement log has the applied)
        results[8].forEach(function (p) {
          if (p.subject_type !== "machine" || p.status !== "planned") return;
          MACHINE_PLANS.push(p);
          (PLANS_BY_MACHINE[p.machine_id] = PLANS_BY_MACHINE[p.machine_id] || []).push(p);
        });

        // movement history (gated read — silently absent for other logins).
        // 500 = the feed's cap: the drift watchdog compares each machine
        // against its LATEST row, so the fetch must reach every machine's
        // newest move even as backfill grows the log.
        if (MOVE.can) {
          try {
            // keyed by machine_id (0051 feed) — codes are unique today, but
            // ids can never collide, and it matches the manpower page's keying
            (await Dash.getTransferLog(500)).forEach(function (t) {
              if (t.subject_type !== "machine" || !t.machine_id) return;
              (MOVELOG[t.machine_id] = MOVELOG[t.machine_id] || []).push(t);
            });
          } catch (e) { /* no history panel */ }
        }

        var serviceByMachine = {};
        results[2].forEach(function (r) {
          (serviceByMachine[r.machine_code] = serviceByMachine[r.machine_code] || []).push(r);
        });
        var activityByMachine = {};
        results[3].forEach(function (a) {
          (activityByMachine[a.machine_code] = activityByMachine[a.machine_code] || []).push(a);
        });

        // issues keyed by machine code (v_issue_board carries machine_code):
        // ALL issues feed the Comment column (track record), the open subset
        // feeds the needs-attention tooltips
        var allIssuesByMachine = {}, openIssuesByMachine = {};
        results[1].forEach(function (i) {
          if (!i.machine_code) return;
          (allIssuesByMachine[i.machine_code] = allIssuesByMachine[i.machine_code] || []).push(i);
          if (i.status === "open" || i.status === "in_progress") {
            (openIssuesByMachine[i.machine_code] = openIssuesByMachine[i.machine_code] || []).push(i);
          }
        });

        // ---- toolbar: options built once from the loaded data ----
        var statusSel = document.getElementById("mt-status");
        statusSel.innerHTML = ['<option value="all">Status: All</option>']
          .concat(FLEET_STATES.map(function (s) {
            return '<option value="' + esc(s[0]) + '">' + escHtml(s[0]) + "</option>";
          })).join("");

        var siteKeys = {};
        machines.forEach(function (m) { siteKeys[m.current_site || "Unassigned"] = true; });
        document.getElementById("mt-site").innerHTML =
          ['<option value="all">All sites / projects</option>']
            .concat(Object.keys(siteKeys).sort().map(function (k) {
              var name = DIR_BY_CODE[k] && DIR_BY_CODE[k].project_name;
              return '<option value="' + esc(k) + '">' +
                     escHtml(k + (name ? " — " + name : "")) + "</option>";
            })).join("");

        var shownNow = machines;    // what Export writes out

        // one place to repaint — the fleet cards and the toolbar both land here
        function paint() {
          shownNow = machines.filter(machineMatches);
          document.getElementById("fleet-strip").innerHTML = fleetStrip(machines);
          document.getElementById("attention").innerHTML = needsAttention(machines, openIssuesByMachine);
          document.getElementById("upcoming").innerHTML = upcomingMovesZone();
          document.getElementById("sites").innerHTML =
            siteTables(shownNow, allIssuesByMachine, serviceByMachine, activityByMachine);
          statusSel.value = FLT.state;          // keep the dropdown and cards in step
        }
        paint();
        document.getElementById("mach-tools").hidden = false;

        // the fleet cards are the state filter
        document.getElementById("fleet-strip").addEventListener("click", function (ev) {
          var b = ev.target.closest("button[data-fleet]");
          if (!b) return;
          var key = b.getAttribute("data-fleet");
          FLT.state = (FLT.state === key || key === "all") ? "all" : key;
          paint();
        });

        // "View all moves" — delegated on the static container, so it survives
        // every repaint of the panel's innerHTML
        document.getElementById("upcoming").addEventListener("click", function (ev) {
          var a = ev.target.closest('a[data-action="moves-toggle"]');
          if (!a) return;
          ev.preventDefault();
          MOVES_ALL = !MOVES_ALL;
          paint();
        });

        var tools = document.getElementById("mach-tools");
        tools.addEventListener("input", function (ev) {
          if (ev.target.id === "mt-q") { FLT.q = ev.target.value.trim().toLowerCase(); paint(); }
        });
        tools.addEventListener("change", function (ev) {
          if (ev.target.id === "mt-status")    { FLT.state = ev.target.value; paint(); }
          else if (ev.target.id === "mt-site") { FLT.site = ev.target.value; paint(); }
        });

        // CSV of exactly what is on screen — built here, no library, no upload
        document.getElementById("mt-export").addEventListener("click", function () {
          var cols = ["machine_code", "machine_type", "brand", "model", "registration_no",
                      "current_site", "current_site_name", "last_status", "last_status_date",
                      "mobilised_date", "current_hour_meter"];
          function cell(v) {
            if (v === null || v === undefined) return "";
            var s = String(v);
            return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
          }
          var csv = [cols.join(",")].concat(shownNow.map(function (m) {
            return cols.map(function (c) { return cell(m[c]); }).join(",");
          })).join("\r\n");
          var url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
          var a = document.createElement("a");
          a.href = url;
          a.download = "hf-machines-" + Dash.todayKL() + ".csv";
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
        });

        // coming back from a save? restore open site blocks + scroll position
        var savedOpen = OPEN.load();
        if (Object.keys(savedOpen).length) {
          document.querySelectorAll("#sites details.zone[data-group]").forEach(function (d) {
            d.open = !!savedOpen[d.getAttribute("data-group")];
          });
          OPEN.saveMap({});   // one-shot — don't keep overriding future visits
        }
        UI.restoreScroll();
        wireAttentionJumps();
        wireCardToggles();
        wireMachineMoves();
        wireMachineOps();
        wireAddMachine();
        wireMovementPlans();
        wireTransferHistory();
      } catch (e) {
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load: ' + (e.message || e) + "</div>";
      }
    };
  </script>
