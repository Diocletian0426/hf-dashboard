<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Delivery Status</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">
    <!-- ================= DELIVERY STATUS =========================
         One row per lorry-load: the date, which site it left, which
         site it is going to, who drove it, the D.O. number on the
         paperwork, the list of what was on it, and a tick once the
         receiving end confirms it arrived.

         A DELIVERY IS A TRIP, NOT A THING. One lorry-load is one
         D.O. with a list on it, so the table shows one row per trip
         and the items open underneath it. Recording five items as
         five rows would answer "five loads went to Rawang" when the
         truth is one.

         WHERE THE RECORD LIVES. The database — tables deliveries,
         delivery_items and delivery_drivers, read and written only
         through the RPCs
         get_deliveries / save_delivery / delete_delivery (+ the two
         driver ones), each of which checks a permission first. It
         began as a static file on the office machine; that meant the
         published dashboard could only ever look at it, and that the
         whole record was readable by anyone who guessed the URL.

         NOTHING SAVES AS YOU TYPE. Changes pile up until Save is
         pressed, so a mis-typed row can be thrown away with Discard.
         Save then makes one call per changed line — see save().

         Access: deliveries.view to open it, deliveries.edit to change
         anything, .create to add, .delete to remove. The page asks
         once (can_edit) to decide what to show; the database checks
         every write regardless.
    -->
    <div class="page-eyebrow">Machines</div>
    <h1>Delivery Status</h1>

    <p id="dlv-sub" class="page-caption">Loading…</p>

    <div id="error"></div>

    <!-- Overall, one month, or one year. The cards AND the table follow this
         switch together: counts that do not match the lines underneath them are
         the fastest way to lose trust in a page. -->
    <div class="period-switch" id="period-switch">
      <span class="ps-label">Showing</span>
      <button type="button" data-period="all" class="active">Overall</button>
      <button type="button" data-period="month">By month</button>
      <button type="button" data-period="year">By year</button>
      <select id="f-period" hidden aria-label="Which month or year"></select>
    </div>

    <!-- the four questions asked before any others: how many deliveries are on
         the book, how many are still on the road, how many have landed, and
         how many have no D.O. number to match against the paperwork -->
    <div class="istats" id="dlv-stats"></div>

    <div class="mp-controls" id="dlv-controls">
      <span>Show:
        <button type="button" data-status="" class="active">All</button>
        <button type="button" data-status="transit">On the way</button>
        <button type="button" data-status="done">Delivered</button>
      </span>
      <span>Site: <select id="f-site"></select></span>
      <span>Driver: <select id="f-driver"></select>
        <button type="button" id="btn-drivers" class="dlv-link">Edit list</button>
      </span>
      <!-- same search field as the Tooling page: icon inside on the left, pill
           outline, and the count riding inside the right-hand end -->
      <span class="tool-search">
        <svg class="ric" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20.5 20.5"/>
        </svg>
        <input type="search" id="f-text"
               placeholder="Search item, site, driver, D.O. or remark…"
               aria-label="Search deliveries" />
        <span class="muted" id="f-count"></span>
      </span>
    </div>

    <!-- Who drives what. Loader, cargo, lorries — the office's own order, and
         the office's own list: it changes when somebody joins or leaves, and a
         code change for that is a code change nobody will ask for twice. -->
    <div id="driver-panel" class="driver-panel" hidden></div>

    <div id="dlv-body"></div>

    <!-- A new delivery appears AS A ROW at the top of the table, open, with
         its own item list — the same shape it will have once it is saved.
         It used to be typed into a separate little table down here, which
         cannot hold a list, and taught the wrong shape besides. -->
    <div id="dlv-edit">
      <div id="pending-bar" class="banner banner-info" hidden></div>
      <p class="tool-edit-actions">
        <button type="button" id="btn-add" class="btn">+ Add delivery record</button>
        <span class="muted" id="edit-note"></span>
      </p>
    </div>

    <!-- Sites already used are offered as you type, but the list is not a fence:
         a delivery can come from a supplier that is not one of our sites. Drivers
         ARE a list (see the panel above) — a delivery has a driver, not a guess
         at one, and a name typed six different ways cannot be counted. -->
    <datalist id="dlv-sites"></datalist>

    <p class="page-caption" id="dlv-source"></p>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="tooling-data.js"></script>
  <script src="shell.js"></script>

  <script>
    "use strict";

    var esc = UI.esc, escHtml = UI.escHtml;

    // the site list the Tooling page already keeps — one list of sites for the
    // whole store, so "Tasek Store" is spelled the same on both pages
    var SITES = (window.TOOLING_DATA && window.TOOLING_DATA.siteOptions) || [];

    // What each driver drives, and the order the office reads the list in:
    // loader, cargo, then the lorries. Anything else typed in lands after them.
    var VEHICLES = ["Loader", "Cargo", "Lorry"];

    var DRIVERS = [];          // the crew list, straight from get_deliveries
    var DRIVER_ADDS = [];      // new drivers waiting to be saved
    var DRIVER_DROPS = {};     // name -> true, drivers waiting to come off the list

    // the trip's own columns. The items are a list of their own — see itemsOf.
    var FIELDS = ["date", "from", "to", "driver", "doNum", "remark", "received"];

    var ALL = [];          // the record, filled by load()
    var BY_ID = {};

    var EDITS = {};        // id -> { field: value } waiting to be saved
    var ITEM_EDITS = {};   // id -> the WHOLE item list, once it has been touched
    var NEWROWS = [];      // deliveries being typed, not yet in the database
    var DELETED = {};      // id -> true, trips marked for removal
    var OPEN = {};         // id -> true, whose item list is showing
    var NEWSEQ = 0;

    var CAN_SAVE = false;  // deliveries.edit — the database says, not the page
    // Deleting is its own permission. The page draws the ✕ only for logins that
    // hold it: a button that is always refused teaches people to distrust every
    // other button beside it.
    var CAN_DROP = false;

    /* ---------------------------- where it lives ---------------------------
       The database. One call brings back the trips (each with its item list),
       the driver list, and what this login may do. The permissions are
       re-checked by the database on every write regardless; can_edit and
       can_delete only decide what is worth showing. */
    function load() {
      return Dash.getDeliveries().then(function (res) {
        if (!res || res.ok === false) throw new Error((res && res.message) || "could not read the deliveries");
        ALL = (res.deliveries || []).map(function (r) {
          var o = { id: r.id, items: [] };
          FIELDS.forEach(function (f) {
            o[f] = f === "received" ? !!r[f] : (r[f] === null || r[f] === undefined ? "" : String(r[f]));
          });
          (r.items || []).forEach(function (it) {
            o.items.push({ item: String(it.item || ""), qty: String(it.qty || "") });
          });
          return o;
        });
        BY_ID = {};
        ALL.forEach(function (r) { BY_ID[r.id] = r; });

        DRIVERS = (res.drivers || []).map(function (d) {
          return { name: String(d.name || ""), vehicle: String(d.vehicle || "") };
        }).filter(function (d) { return d.name; });

        CAN_SAVE = !!res.can_edit;
        CAN_DROP = CAN_SAVE && !!res.can_delete;
      });
    }

    /* ------------------------- the current picture --------------------------
       What a cell should show: the unsaved edit if there is one, else the
       record. A row being typed has no saved version to fall back to, so it
       carries its own values. */

    function val(r, field) {
      if (r.isNew) return r[field];
      var e = EDITS[r.id];
      return (e && e[field] !== undefined) ? e[field] : r[field];
    }

    function changed(r, field) {
      if (r.isNew) return false;                 // the whole row is new
      var e = EDITS[r.id];
      return !!(e && e[field] !== undefined && e[field] !== r[field]);
    }

    // the item list as it stands now — the edited one once it has been touched
    function itemsOf(r) {
      if (r.isNew) return r.items;
      return ITEM_EDITS[r.id] || r.items;
    }

    // Take a working copy before the first change, so the saved list is still
    // there to compare against (and to put back on Discard).
    function editableItems(r) {
      if (r.isNew) return r.items;
      if (!ITEM_EDITS[r.id]) {
        ITEM_EDITS[r.id] = r.items.map(function (i) { return { item: i.item, qty: i.qty }; });
      }
      return ITEM_EDITS[r.id];
    }

    function itemsChanged(r) {
      if (r.isNew || !ITEM_EDITS[r.id]) return false;
      return JSON.stringify(ITEM_EDITS[r.id]) !== JSON.stringify(r.items);
    }

    // an item line is worth keeping once it says what it is; the quantity can
    // follow later, the name cannot
    function realItems(list) {
      return (list || []).filter(function (i) { return String(i.item).trim(); });
    }

    /* -------------------------------- filters ------------------------------ */

    var F = { period: "all", month: "", year: "", status: "", site: "", driver: "", text: "" };

    // A trip with no date cannot be in August, so a chosen period drops it.
    // That is the honest answer: an undated delivery belongs to no month.
    function inPeriod(r) {
      if (F.period === "all") return true;
      var d = val(r, "date");
      if (!d) return false;
      if (F.period === "month") return !F.month || d.slice(0, 7) === F.month;
      return !F.year || d.slice(0, 4) === F.year;
    }

    function periodLabel() {
      if (F.period === "month" && F.month) return UI.mstr(F.month + "-01");
      if (F.period === "year" && F.year) return F.year;
      return "";
    }

    function match(r) {
      if (!inPeriod(r)) return false;
      var done = !!val(r, "received");
      if (F.status === "transit" && done) return false;
      if (F.status === "done" && !done) return false;
      if (F.site && val(r, "from") !== F.site && val(r, "to") !== F.site) return false;
      if (F.driver && val(r, "driver") !== F.driver) return false;
      if (F.text) {
        // the items are searched too — "where did the 600mm auger go" is the
        // question this page exists to answer
        var hay = [val(r, "from"), val(r, "to"), val(r, "driver"),
                   val(r, "doNum"), val(r, "remark")]
                  .concat(itemsOf(r).map(function (i) { return i.item; }))
                  .join(" ").toLowerCase();
        if (hay.indexOf(F.text) === -1) return false;
      }
      return true;
    }

    // Newest first — a delivery book is read from today backwards. Trips with
    // no date yet sit at the top, because a line with no date is one somebody
    // is still filling in, not one from 1970.
    function shown() {
      return ALL.filter(match).sort(function (a, b) {
        var da = val(a, "date"), db = val(b, "date");
        if (!da && !db) return 0;
        if (!da) return -1;
        if (!db) return 1;
        return db.localeCompare(da);
      });
    }

    /* ------------------------------- counts -------------------------------- */

    function renderStats() {
      var rows = shown();
      var done = rows.filter(function (r) { return !!val(r, "received"); }).length;
      var noDo = rows.filter(function (r) { return !String(val(r, "doNum")).trim(); }).length;
      var items = 0;
      rows.forEach(function (r) { items += realItems(itemsOf(r)).length; });

      var where = periodLabel();
      var cards = [
        { n: rows.length, label: "Deliveries",
          sub: items ? items + " item" + (items === 1 ? "" : "s") + (where ? " in " + where : " in all")
                     : (where ? "trips in " + where : "trips on the book"),
          icon: "delivery", tone: "brand" },
        { n: rows.length - done, label: "On the way", sub: "not ticked as arrived",
          icon: "clock", tone: rows.length - done ? "info" : "grey" },
        { n: done, label: "Delivered", sub: "the receiving end confirmed it",
          icon: "check", tone: done ? "ok" : "grey" },
        { n: noDo, label: "No D.O. number", sub: "nothing to match the paperwork to",
          icon: "question", tone: "grey" }
      ];

      document.getElementById("dlv-stats").innerHTML = cards.map(function (c) {
        return '<div class="istat tone-' + c.tone + '">' +
                 '<span class="istat-ic">' + UI.icon(c.icon) + "</span>" +
                 '<span class="istat-body">' +
                   '<span class="istat-top"><b>' + c.n + "</b><i>" + escHtml(c.label) + "</i></span>" +
                   '<span class="istat-sub">' + escHtml(c.sub) + "</span>" +
                 "</span>" +
               "</div>";
      }).join("");
    }

    /* ---------------------------- the driver list --------------------------- */

    function driversNow() {
      return DRIVERS.concat(DRIVER_ADDS)
        .filter(function (d) { return !DRIVER_DROPS[d.name]; })
        .sort(function (a, b) {
          var ra = VEHICLES.indexOf(a.vehicle), rb = VEHICLES.indexOf(b.vehicle);
          return (ra === -1 ? VEHICLES.length : ra) - (rb === -1 ? VEHICLES.length : rb);
        });
    }

    // Grouped by what they drive, so a dropdown reads as three short lists
    // rather than one long one. A name already on a delivery but no longer on
    // the list is kept at the top: a record must never quietly lose its driver.
    function driverOptions(current, opt) {
      opt = opt || {};
      var list = driversNow(), groups = {}, order = [], html = "";

      if (opt.blank !== false) html += '<option value=""' + (current ? "" : " selected") + ">—</option>";
      if (current && !list.some(function (d) { return d.name === current; })) {
        html += '<option value="' + esc(current) + '" selected>' + escHtml(current) +
                " (not on the list)</option>";
      }

      list.forEach(function (d) {
        if (!groups[d.vehicle]) { groups[d.vehicle] = []; order.push(d.vehicle); }
        groups[d.vehicle].push(d);
      });
      html += order.map(function (v) {
        return '<optgroup label="' + esc(v || "Other") + '">' +
          groups[v].map(function (d) {
            return '<option value="' + esc(d.name) + '"' +
                   (d.name === current ? " selected" : "") + ">" + escHtml(d.name) + "</option>";
          }).join("") + "</optgroup>";
      }).join("");

      var strays = (opt.extra || []).filter(function (n) {
        return n && !list.some(function (d) { return d.name === n; }) && n !== current;
      });
      if (strays.length) {
        html += '<optgroup label="Not on the list">' + strays.map(function (n) {
          return '<option value="' + esc(n) + '">' + escHtml(n) + "</option>";
        }).join("") + "</optgroup>";
      }
      return html;
    }

    function driverPanelHtml() {
      var list = driversNow(), groups = {}, order = [];
      list.forEach(function (d) {
        if (!groups[d.vehicle]) { groups[d.vehicle] = []; order.push(d.vehicle); }
        groups[d.vehicle].push(d);
      });

      var body = order.map(function (v) {
        return '<div class="drv-group"><span class="drv-kind">' + escHtml(v || "Other") + "</span>" +
          groups[v].map(function (d) {
            return '<span class="drv-chip">' + escHtml(d.name) +
                   '<button type="button" class="dlv-x" data-drv-drop="' + esc(d.name) +
                   '" title="Take ' + esc(d.name) + ' off the list" aria-label="Remove ' +
                   esc(d.name) + '">×</button></span>';
          }).join("") + "</div>";
      }).join("");
      if (!list.length) body = '<p class="muted">Nobody on the list yet.</p>';

      return body +
        '<div class="drv-add">' +
          '<input type="text" id="drv-name" placeholder="Driver name" aria-label="Driver name">' +
          '<select id="drv-vehicle" aria-label="What they drive">' +
            VEHICLES.map(function (v) {
              return '<option value="' + esc(v) + '">' + escHtml(v) + "</option>";
            }).join("") +
          "</select>" +
          '<button type="button" id="btn-drv-add" class="btn">+ Add driver</button>' +
          '<span class="muted">Saved with the rest of the page — press Save. Taking a driver ' +
            "off the list leaves the deliveries they already drove exactly as they are.</span>" +
        "</div>";
    }

    function renderDrivers() {
      document.getElementById("driver-panel").innerHTML = driverPanelHtml();
    }

    /* ------------------------------- the table ------------------------------ */

    function colCount() { return CAN_SAVE ? 8 : 7; }

    function thead() {
      return "<thead><tr>" +
               "<th>Date</th><th>From → To</th><th>Driver</th><th>D.O. No.</th>" +
               "<th>Items</th><th>Remark</th>" +
               '<th class="dlv-tick-head" title="Tick it when the site confirms it landed">Arrived</th>' +
               (CAN_SAVE ? "<th></th>" : "") +
             "</tr></thead>";
    }

    function textCell(r, field, ph) {
      return '<input type="text" class="cell-edit" data-id="' + esc(r.id) + '" data-field="' + field +
             '" value="' + esc(val(r, field)) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + ">";
    }

    // From and To share one column: on screen a trip reads as one movement,
    // "Tasek Store → Umech - Rawang", not as two unrelated facts. They stay two
    // inputs when editing, because they are two answers.
    function routeCell(r, editable) {
      if (!editable) {
        var a = val(r, "from"), b = val(r, "to");
        if (!a && !b) return "";
        return '<span class="dlv-route">' + escHtml(a || "—") +
               '<i aria-label="to">→</i>' + escHtml(b || "—") + "</span>";
      }
      return '<span class="dlv-route-edit">' +
               '<input type="text" list="dlv-sites" class="cell-edit" data-id="' + esc(r.id) +
                 '" data-field="from" value="' + esc(val(r, "from")) + '" placeholder="from">' +
               "<i>→</i>" +
               '<input type="text" list="dlv-sites" class="cell-edit" data-id="' + esc(r.id) +
                 '" data-field="to" value="' + esc(val(r, "to")) + '" placeholder="to">' +
             "</span>";
    }

    function driverCell(r, editable) {
      if (!editable) return escHtml(val(r, "driver"));
      return '<select class="cell-edit" data-id="' + esc(r.id) + '" data-field="driver">' +
               driverOptions(val(r, "driver")) + "</select>";
    }

    function dateCell(r, editable) {
      if (!editable) {
        var d = val(r, "date");
        return d ? UI.dstr(d) : '<span class="muted">no date</span>';
      }
      return '<input type="date" class="cell-edit" data-id="' + esc(r.id) +
             '" data-field="date" value="' + esc(val(r, "date")) + '">';
    }

    // The tick. It is an edit like any other — it goes amber and waits for
    // Save, because "arrived" is a claim about the real world and a stray click
    // on a trackpad should be as undoable as a mis-typed number.
    function tickCell(r, editable) {
      var on = !!val(r, "received");
      if (!editable) {
        return on ? '<span class="chip chip-ok">arrived</span>'
                  : '<span class="chip">on the way</span>';
      }
      return '<label class="dlv-tick"><input type="checkbox" class="dlv-check" data-id="' + esc(r.id) +
             '" data-field="received"' + (on ? " checked" : "") +
             ' aria-label="Arrived"><span></span></label>';
    }

    // The count IS the control: pressing it opens the list underneath.
    function itemsCell(r) {
      var n = realItems(itemsOf(r)).length;
      var open = !!OPEN[r.id];
      return '<button type="button" class="dlv-items-btn' + (open ? " open" : "") +
               '" data-toggle="' + esc(r.id) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
               (n ? n + " item" + (n === 1 ? "" : "s") : '<span class="muted">no items</span>') +
               '<i aria-hidden="true">▾</i></button>';
    }

    // The item list, as rows under its trip. One cell spanning the table rather
    // than columns of its own: the trip's ruler is set by dates and site names,
    // and an item list forced through it would be squeezed into a gutter.
    function itemRowsHtml(r, editable) {
      var list = itemsOf(r), lines;

      if (!editable) {
        if (!realItems(list).length) return "";
        lines = realItems(list).map(function (i) {
          return '<li><span class="di-name">' + escHtml(i.item) + "</span>" +
                 '<span class="di-qty">' + escHtml(i.qty || "—") + "</span></li>";
        }).join("");
        return '<tr class="dlv-item-row"><td colspan="' + colCount() + '">' +
                 '<ul class="dlv-items">' + lines + "</ul></td></tr>";
      }

      lines = list.map(function (i, k) {
        return '<li><input type="text" class="di-edit di-name" data-id="' + esc(r.id) +
                 '" data-i="' + k + '" data-field="item" value="' + esc(i.item) +
                 '" placeholder="what was sent">' +
               '<input type="text" class="di-edit di-qty" data-id="' + esc(r.id) +
                 '" data-i="' + k + '" data-field="qty" value="' + esc(i.qty) +
                 '" placeholder="qty" aria-label="Quantity">' +
               '<button type="button" class="dlv-x" data-drop-item="' + esc(r.id) + "|" + k +
                 '" title="Take this item off" aria-label="Remove item">×</button></li>';
      }).join("");

      return '<tr class="dlv-item-row"><td colspan="' + colCount() + '">' +
               '<ul class="dlv-items">' + lines + "</ul>" +
               '<button type="button" class="dlv-add-item" data-add-item="' + esc(r.id) +
                 '">+ Add item</button>' +
             "</td></tr>";
    }

    function rowHtml(r, editable) {
      var gone = !!DELETED[r.id];
      var cls = function (field) { return changed(r, field) ? "cell-changed" : ""; };
      var route = changed(r, "from") || changed(r, "to") ? "cell-changed" : "";

      var tr = '<tr data-id="' + esc(r.id) + '" class="' +
                 (gone ? "row-deleted " : "") + (r.isNew ? "row-new " : "") +
                 (val(r, "received") ? "row-done" : "") + '">' +
        UI.td("Date", dateCell(r, editable), cls("date")) +
        UI.td("From → To", routeCell(r, editable), (editable ? "" : "wrap ") + route) +
        UI.td("Driver", driverCell(r, editable), cls("driver")) +
        UI.td("D.O. No.", editable ? textCell(r, "doNum", "D.O.")
                                   : (val(r, "doNum") ? "<code>" + escHtml(val(r, "doNum")) + "</code>" : ""),
              cls("doNum")) +
        UI.td("Items", itemsCell(r), itemsChanged(r) ? "cell-changed" : "") +
        UI.td("Remark", editable ? textCell(r, "remark", "—") : escHtml(val(r, "remark")),
              (editable ? "" : "wrap ") + cls("remark")) +
        '<td data-label="Arrived" class="dlv-tick-cell ' + cls("received") + '">' +
          tickCell(r, editable) + "</td>" +
        (editable
          ? '<td class="dlv-row-act">' + ((CAN_DROP || r.isNew)
              ? '<button type="button" class="dlv-x" data-drop="' + esc(r.id) +
                '" title="' + (gone ? "Put this trip back" : "Remove this trip") + '" aria-label="' +
                (gone ? "Undo remove" : "Remove") + '">' + (gone ? "↺" : "×") + "</button>"
              : "") + "</td>"
          : "") +
      "</tr>";

      return tr + (OPEN[r.id] ? itemRowsHtml(r, editable) : "");
    }

    function table(rows) {
      return '<div class="table-wrap table-stack"><table class="tool-table dlv-table' +
               (CAN_SAVE ? " dlv-editable tool-editable with-remove" : "") + '">' +
               thead() + "<tbody>" +
               rows.map(function (r) { return rowHtml(r, CAN_SAVE); }).join("") +
             "</tbody></table></div>";
    }

    /* --------------------------- new deliveries ----------------------------- */

    function blankRow() {
      NEWSEQ += 1;
      return { id: "new-" + NEWSEQ, isNew: true, date: Dash.todayKL(),
               from: "", to: "", driver: "", doNum: "", remark: "", received: false,
               items: [{ item: "", qty: "1" }] };
    }

    /* ------------------------------- pending -------------------------------- */

    // a trip is worth writing once it carries an item, or a D.O. to match
    function pendingAdds() {
      return NEWROWS.filter(function (n) {
        return realItems(n.items).length || String(n.doNum).trim();
      });
    }

    function pendingEdits() {
      var out = [];
      ALL.forEach(function (r) {
        if (DELETED[r.id]) return;                    // a removed trip's edits are moot
        if (itemsChanged(r)) { out.push(r.id); return; }
        var e = EDITS[r.id];
        if (!e) return;
        for (var i = 0; i < FIELDS.length; i++) {
          var f = FIELDS[i];
          if (e[f] !== undefined && e[f] !== r[f]) { out.push(r.id); return; }
        }
      });
      return out;
    }

    function pendingDrops() { return Object.keys(DELETED); }

    function pendingCrew() { return DRIVER_ADDS.length + Object.keys(DRIVER_DROPS).length; }

    // one trip, as the database wants it: the header AND the whole item list.
    // save_delivery replaces the items rather than merging, so a half-filled
    // payload would drop the lines it forgot to mention.
    function payload(r) {
      return { id: r.isNew ? null : r.id,
               date: val(r, "date") || null,
               from: val(r, "from"), to: val(r, "to"),
               driver: val(r, "driver"), doNum: val(r, "doNum"),
               remark: val(r, "remark"), received: !!val(r, "received"),
               items: realItems(itemsOf(r)) };
    }

    function renderPendingBarOnly() {
      var edits = pendingEdits(), adds = pendingAdds(), drops = pendingDrops();
      var crew = pendingCrew();
      var n = edits.length + adds.length + drops.length + crew;
      var bar = document.getElementById("pending-bar");
      bar.hidden = !n;
      if (!n) return;
      bar.className = "banner banner-info";
      bar.innerHTML =
        "<strong>" + n + " unsaved change" + (n === 1 ? "" : "s") + "</strong> — " +
        edits.length + " edited, " + adds.length + " new" +
        (drops.length ? ", " + drops.length + " removed" : "") +
        (crew ? ", " + crew + " to the driver list" : "") + ". " +
        "Nothing has been written to the record yet. " +
        '<button type="button" id="btn-save" class="btn btn-primary">Save</button> ' +
        '<button type="button" id="btn-discard" class="btn">Discard</button>';
    }

    function renderEdit() {
      renderPendingBarOnly();
      document.getElementById("btn-add").disabled = !CAN_SAVE;
      document.getElementById("edit-note").innerHTML = CAN_SAVE
        ? "Saved straight into the company record — everyone signed in sees the same lines."
        : "Your login can see deliveries but not change them. Ask an administrator " +
          "for <code>deliveries.edit</code>.";
    }

    /* -------------------------------- saving --------------------------------
       One call per thing that changed, in an order that cannot contradict
       itself: the driver list first (a trip may point at a driver added in the
       same breath), then edits, then new trips, then removals.

       Sequential, not parallel — twelve simultaneous writes report their
       failures in a random order, and the office needs to be told WHICH trip
       the database refused, not that something somewhere went wrong. */
    function save() {
      var bar = document.getElementById("pending-bar");
      var btn = document.getElementById("btn-save");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

      function name(r) {
        var items = realItems(itemsOf(r));
        return val(r, "doNum") || (items.length ? items[0].item : "") ||
               (val(r, "date") ? UI.dstr(val(r, "date")) : "a trip");
      }

      var jobs = [];
      DRIVER_ADDS.forEach(function (d) {
        jobs.push({ what: "driver " + d.name,
                    run: function () { return Dash.saveDeliveryDriver(d.name, d.vehicle); } });
      });
      Object.keys(DRIVER_DROPS).forEach(function (n) {
        jobs.push({ what: "driver " + n,
                    run: function () { return Dash.deleteDeliveryDriver(n); } });
      });
      pendingEdits().forEach(function (id) {
        var body = payload(BY_ID[id]), what = name(BY_ID[id]);
        jobs.push({ what: what, run: function () { return Dash.saveDelivery(body); } });
      });
      pendingAdds().forEach(function (r) {
        var body = payload(r), what = name(r);
        jobs.push({ what: what, run: function () { return Dash.saveDelivery(body); } });
      });
      pendingDrops().forEach(function (id) {
        var what = BY_ID[id] ? name(BY_ID[id]) : "a trip";
        jobs.push({ what: what, run: function () { return Dash.deleteDelivery(id); } });
      });

      var refused = [];
      var chain = Promise.resolve();
      jobs.forEach(function (job) {
        chain = chain.then(function () {
          return job.run().then(function (res) {
            // a database that says no says why — carry its own words through
            if (res && res.ok === false) refused.push(job.what + " — " + (res.message || res.code));
          });
        });
      });

      chain.then(function () {
        if (refused.length) {
          if (btn) { btn.disabled = false; btn.textContent = "Save"; }
          bar.className = "banner banner-amber";
          bar.innerHTML = "<strong>" + (jobs.length - refused.length) + " saved, " +
            refused.length + " refused:</strong><ul>" +
            refused.map(function (x) { return "<li>" + escHtml(x) + "</li>"; }).join("") + "</ul>" +
            '<button type="button" class="btn" onclick="window.location.reload()">Reload the page</button>';
          return;
        }
        UI.saveScroll();
        window.location.reload();            // show what the record now says
      }).catch(function (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save"; }
        var msg = String((e && e.message) || e);
        bar.className = "banner banner-red";
        bar.innerHTML = /not_authorised/.test(msg)
          ? "Your login is not allowed to change deliveries. Nothing was written."
          : "Could not save: " + escHtml(msg) +
            '<br><span class="muted">Some earlier trips in this batch may already have gone in — ' +
            "reload to see exactly where it stopped.</span>";
      });
    }

    /* ------------------------------- render -------------------------------- */

    function render() {
      var rows = shown();
      renderStats();
      document.getElementById("f-count").textContent =
        rows.length === ALL.length ? "" : rows.length + " of " + ALL.length + " shown";

      // deliveries being typed sit at the top, whatever the filters say — a row
      // that vanishes because it does not match the search yet is a row the
      // office will type again
      var body = document.getElementById("dlv-body");
      if (!ALL.length && !NEWROWS.length) {
        body.innerHTML = UI.empty("No deliveries recorded yet.",
          CAN_SAVE ? "Press “+ Add delivery record” below to write the first one."
                   : "Nobody has written one yet.");
      } else if (!rows.length && !NEWROWS.length) {
        body.innerHTML = UI.empty("Nothing matches that.",
                                  "Clear the search or pick a different site.");
      } else {
        body.innerHTML = table(NEWROWS.concat(rows));
      }

      renderEdit();
    }

    /* ------------------------------- controls ------------------------------ */

    function usedValues(field) {
      var m = {};
      ALL.forEach(function (r) { var v = val(r, field); if (v) m[v] = (m[v] || 0) + 1; });
      return m;
    }

    function fillDatalists() {
      var sites = {};
      SITES.forEach(function (s) { sites[s] = 1; });
      Object.keys(usedValues("from")).forEach(function (s) { sites[s] = 1; });
      Object.keys(usedValues("to")).forEach(function (s) { sites[s] = 1; });
      document.getElementById("dlv-sites").innerHTML = Object.keys(sites).sort()
        .map(function (s) { return '<option value="' + esc(s) + '">'; }).join("");
    }

    function fillFilters() {
      var sites = {};
      Object.keys(usedValues("from")).forEach(function (s) { sites[s] = 1; });
      Object.keys(usedValues("to")).forEach(function (s) { sites[s] = 1; });
      document.getElementById("f-site").innerHTML = '<option value="">All sites</option>' +
        Object.keys(sites).sort().map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === F.site ? " selected" : "") + ">" +
                 escHtml(s) + "</option>";
        }).join("");

      document.getElementById("f-driver").innerHTML =
        '<option value=""' + (F.driver ? "" : " selected") + ">All drivers</option>" +
        driverOptions(F.driver, { blank: false, extra: Object.keys(usedValues("driver")) });
    }

    // The months and years the record actually covers, newest first — with
    // today's own month and year always offered, because a page that cannot be
    // pointed at this month until somebody types a delivery into it argues back.
    function periodOptions(kind) {
      var cut = kind === "month" ? 7 : 4;
      var m = {};
      m[Dash.todayKL().slice(0, cut)] = 1;
      ALL.forEach(function (r) {
        var d = val(r, "date");
        if (d) m[d.slice(0, cut)] = 1;
      });
      return Object.keys(m).sort().reverse();
    }

    function fillPeriod() {
      var sel = document.getElementById("f-period");
      sel.hidden = F.period === "all";
      if (F.period === "all") return;
      var kind = F.period;
      var opts = periodOptions(kind);
      var current = kind === "month" ? F.month : F.year;
      if (opts.indexOf(current) === -1) current = opts[0];      // first visit: the newest
      if (kind === "month") F.month = current; else F.year = current;
      sel.innerHTML = opts.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === current ? " selected" : "") + ">" +
               escHtml(kind === "month" ? UI.mstr(o + "-01") : o) + "</option>";
      }).join("");
    }

    function rowById(id) {
      if (BY_ID[id]) return BY_ID[id];
      for (var i = 0; i < NEWROWS.length; i++) if (NEWROWS[i].id === id) return NEWROWS[i];
      return null;
    }

    function noteEdit(r, field, value) {
      if (r.isNew) { r[field] = value; return true; }
      var e = EDITS[r.id] = EDITS[r.id] || {};
      if (value === r[field]) delete e[field];        // typed it back — not a change
      else e[field] = value;
      if (!Object.keys(e).length) delete EDITS[r.id];
      return !!(EDITS[r.id] && EDITS[r.id][field] !== undefined);
    }

    function wire() {
      fillDatalists();
      fillFilters();
      fillPeriod();

      document.getElementById("period-switch").addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-period]");
        if (!b) return;
        F.period = b.getAttribute("data-period");
        b.parentElement.querySelectorAll("button").forEach(function (x) {
          x.classList.toggle("active", x === b);
        });
        fillPeriod();
        render();
      });

      document.getElementById("f-period").addEventListener("change", function (e) {
        if (F.period === "month") F.month = e.target.value;
        else F.year = e.target.value;
        render();
      });

      document.getElementById("dlv-controls").addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-status]");
        if (!b) return;
        F.status = b.getAttribute("data-status");
        b.parentElement.querySelectorAll("button").forEach(function (x) {
          x.classList.toggle("active", x === b);
        });
        render();
      });

      document.getElementById("f-site").addEventListener("change", function (e) {
        F.site = e.target.value; render();
      });
      document.getElementById("f-driver").addEventListener("change", function (e) {
        F.driver = e.target.value; render();
      });
      document.getElementById("f-text").addEventListener("input", function (e) {
        F.text = e.target.value.trim().toLowerCase(); render();
      });

      document.getElementById("btn-drivers").addEventListener("click", function (ev) {
        var panel = document.getElementById("driver-panel");
        panel.hidden = !panel.hidden;
        ev.target.textContent = panel.hidden ? "Edit list" : "Close list";
        if (!panel.hidden) { renderDrivers(); document.getElementById("drv-name").focus(); }
      });

      function afterCrewChange() { renderDrivers(); fillFilters(); render(); }

      document.getElementById("driver-panel").addEventListener("click", function (ev) {
        var drop = ev.target.closest("button[data-drv-drop]");
        if (drop) {
          var nm = drop.getAttribute("data-drv-drop"), at = -1;
          DRIVER_ADDS.forEach(function (d, k) { if (d.name === nm) at = k; });
          if (at !== -1) DRIVER_ADDS.splice(at, 1);   // never saved — just forget it
          else DRIVER_DROPS[nm] = true;
          afterCrewChange();
          return;
        }
        if (ev.target.id !== "btn-drv-add") return;
        var box = document.getElementById("drv-name");
        var nm2 = box.value.trim();
        if (!nm2) { box.focus(); return; }
        delete DRIVER_DROPS[nm2];                     // re-adding puts them back
        var known = driversNow().some(function (d) {
          return d.name.toLowerCase() === nm2.toLowerCase();
        });
        if (!known) {
          DRIVER_ADDS.push({ name: nm2, vehicle: document.getElementById("drv-vehicle").value });
        }
        afterCrewChange();
        document.getElementById("drv-name").focus();
      });

      document.getElementById("driver-panel").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && ev.target.id === "drv-name") {
          ev.preventDefault();
          document.getElementById("btn-drv-add").click();
        }
      });

      var body = document.getElementById("dlv-body");

      // typing in a cell records the change; it does not send it anywhere
      body.addEventListener("change", function (ev) {
        var el = ev.target.closest(".cell-edit, .dlv-check, .di-edit");
        if (!el) return;
        var r = rowById(el.getAttribute("data-id"));
        if (!r) return;

        if (el.classList.contains("di-edit")) {
          editableItems(r)[Number(el.getAttribute("data-i"))][el.getAttribute("data-field")] = el.value;
          var ic = el.closest("tr").previousElementSibling;
          if (ic) {
            var cell = ic.querySelector('td[data-label="Items"]');
            if (cell) {
              cell.classList.toggle("cell-changed", itemsChanged(r));
              cell.innerHTML = itemsCell(r);          // the count follows the list
            }
          }
          renderStats();
          return renderPendingBarOnly();
        }

        var field = el.getAttribute("data-field");
        var isTick = el.classList.contains("dlv-check");
        var dirty = noteEdit(r, field, isTick ? el.checked : el.value);

        var td = el.closest("td");
        if (td) td.classList.toggle("cell-changed", dirty);
        if (field === "from" || field === "to") {
          if (td) td.classList.toggle("cell-changed", changed(r, "from") || changed(r, "to"));
        }
        if (isTick) {
          var tr = el.closest("tr");
          if (tr) tr.classList.toggle("row-done", el.checked);
          renderStats();                              // the tick moves the counts above
        }
        renderPendingBarOnly();
      });

      // free text needs the same treatment on every keystroke, or the pending
      // count only catches up when the field loses focus
      body.addEventListener("input", function (ev) {
        if (ev.target.closest('input[type="text"].cell-edit, input.di-edit')) {
          ev.target.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });

      body.addEventListener("click", function (ev) {
        var t = ev.target.closest("button");
        if (!t) return;

        var open = t.getAttribute("data-toggle");
        if (open) {
          if (OPEN[open]) delete OPEN[open]; else OPEN[open] = true;
          return render();
        }

        var add = t.getAttribute("data-add-item");
        if (add) {
          var ra = rowById(add);
          if (ra) { editableItems(ra).push({ item: "", qty: "1" }); OPEN[add] = true; render();
            var last = document.querySelector('tr[data-id="' + add + '"] + .dlv-item-row li:last-child .di-name');
            if (last) last.focus();
          }
          return;
        }

        var di = t.getAttribute("data-drop-item");
        if (di) {
          var pi = di.split("|"), rd = rowById(pi[0]);
          if (rd) { editableItems(rd).splice(Number(pi[1]), 1); render(); }
          return;
        }

        // Remove marks the trip and leaves it on screen, struck through, until
        // Save — so it can be put back without reloading the page. A trip that
        // was never saved is simply forgotten.
        var drop = t.getAttribute("data-drop");
        if (drop) {
          var rr = rowById(drop);
          if (rr && rr.isNew) {
            NEWROWS = NEWROWS.filter(function (x) { return x.id !== drop; });
            delete OPEN[drop];
            return render();
          }
          if (DELETED[drop]) delete DELETED[drop]; else DELETED[drop] = true;
          return render();
        }
      });

      document.getElementById("btn-add").addEventListener("click", function () {
        var r = blankRow();
        NEWROWS.unshift(r);
        OPEN[r.id] = true;                            // a new trip needs its item list open
        render();
        var first = document.querySelector('tr[data-id="' + r.id + '"] input[data-field="from"]');
        if (first) first.focus();
      });

      document.getElementById("pending-bar").addEventListener("click", function (ev) {
        if (ev.target.id === "btn-save") return save();
        if (ev.target.id === "btn-discard") {
          EDITS = {}; ITEM_EDITS = {}; NEWROWS = []; DELETED = {};
          DRIVER_ADDS = []; DRIVER_DROPS = {};
          renderDrivers();
          fillFilters();
          render();
        }
      });
    }

    // The dev server reloads this page when a frontend file changes — never
    // while there is unsaved typing on screen. See tools/serve-live.py.
    window.__hfHoldReload = function () {
      return pendingEdits().length + pendingAdds().length +
             pendingDrops().length + pendingCrew() > 0;
    };

    window.onShellReady = function () {
      document.getElementById("dlv-sub").innerHTML =
        "One row per trip — press the item count to see what was on the lorry.";

      document.getElementById("dlv-source").innerHTML =
        "Kept in the company database — every signed-in office login sees the same " +
        "trips, and every change is recorded against the name that made it.";

      // Everything below waits for the record: a page that draws its controls
      // before it knows whether this login may use them is a page that offers
      // an Add button and then refuses the save.
      load()
        .then(function () {
          wire();
          render();
          UI.restoreScroll();
        })
        .catch(function (e) {
          var msg = String((e && e.message) || e);
          document.getElementById("dlv-body").innerHTML = "";
          document.getElementById("error").innerHTML = /not_authorised/.test(msg)
            ? '<div class="banner banner-amber">Your login cannot see deliveries. ' +
              "Ask an administrator for <code>deliveries.view</code>.</div>"
            : UI.errorBanner(msg);
        });
    };
  </script>
</body>
</html>
