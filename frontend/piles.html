<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Dashboard — Pile Records</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= PAGE HEADER (step 1) ================= -->
    <div class="page-eyebrow">Pile Records</div>
    <h1 id="project-title">Loading…</h1>

    <!-- ================= WORKING TABLES (step 2) =================
         One COLLAPSIBLE block per zone (click the zone header to open/close).
         Header shows: zone name · pile count · cast count.
         Columns: Pile | Stage | Depth (reported / design) | Bore log | Testing | Comment
         "Comment" = Yes/No: has any problem ever been recorded against this
         pile (site issues linked to it)? Tooltip lists the issues.

         RECORD CARD (step 3, draft): click a pile row and a full-width card
         opens under it — design vs site-reported vs verified numbers, key
         dates, bore-log state, tests, and the pile's full problem track
         record. Click the row again to close.

         RECORDS TO CHASE (step 4): collapsible panel listing piles with
         missing paperwork, four rules — 1) cast but no bore log,
         2) test date missed (booked date passed), 3) test to arrange
         (curing done, not booked — chip shows days waiting), 4) test done
         but report reference missing. Click a pile chip to jump to its row
         and open its card.

         PIPELINE STRIP (step 5): one thin segmented meter — how many piles
         sit at each stage. Planned = neutral grey (not yet progress); the
         five working stages wear one blue, light to dark toward done
         (ordinal ramp, validated). Hover a segment for the exact count.

         TEST OPERATIONS (step 6, 0052): the page gains its first write
         actions, office/management only, database-enforced. TEST SPEC panel
         (collapsed, below chase): the project's contract percentages per
         test type with live coverage (implied vs assigned vs done), editable.
         Record card Testing section: book / unbook / record result per test,
         remove a requirement (refused once used), "+ require test" picker.
         The thin cross-project queue lives at tests.html; rows there deep-
         link here via &pile= (handled like the hub's &zone= jump).

         QUANTITIES (step 7, 0054): collapsed panel below the test spec —
         design-vs-actual by ZONE (boring m / concrete m³ / steel t) plus a
         project-level STEEL BY BAR SIZE table (T12/T25/T32…, design vs
         in-ground vs as-built). Each pile's record card carries the full
         working: by-size split, cage table, and the parameters the numbers
         were computed from (cover/lap/stock/starter + the concrete formula
         with values substituted). -->
    <div id="pipeline"></div>
    <div id="chase"></div>
    <div id="testspec"></div>
    <div id="pilequantities"></div>
    <div class="zone-tools" id="zone-tools" hidden>
      <button type="button" onclick="setAllZones(true)">Expand all</button>
      <button type="button" onclick="setAllZones(false)">Collapse all</button>
    </div>
    <div id="zones"></div>

    <div id="error"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    // ---- helpers: canonical copies live in ui.js (window.UI) ----
    var STAGES = UI.PILE_STAGES, stageOf = UI.stageOf;
    // open zones + scroll position survive the reload-after-save pattern
    var OPEN = UI.openState("zones");
    function stageBadge(r) {
      var s = r.construction_status || "";
      var cls = (s === "cast_complete" || s === "head_trimmed") ? "approved"
              : (s === "planned") ? "gray" : "in_progress";
      return '<span class="badge badge-' + cls + '">' + stageOf(s) + "</span>";
    }
    function boreChip(r) {
      if (r.bore_review_status === "confirmed")
        return '<span class="badge badge-approved">verified</span>';
      if (r.bore_log_ref !== null || r.bore_review_status !== null)
        return '<span class="badge badge-pending">in review</span>';
      var st = stageOf(r.construction_status);
      if (st === "Cast" || st === "Trimmed")
        return '<span class="badge badge-anomaly">pending</span>';
      return "—";
    }
    function testBadge(r) {
      var t = r.testing_status || "";
      if (t === "passed") return '<span class="badge badge-passed">Passed</span>';
      if (t === "failed") return '<span class="badge badge-failed">Failed</span>';
      if (t === "not_assigned" || t === "") return "—";
      return UI.badge(t, "badge-gray");
    }
    function n(v) { return v === null || v === undefined ? null : Number(v); }
    function f(v, dp) { return v === null ? "—" : v.toFixed(dp === undefined ? 1 : dp); }
    var esc = UI.esc;
    function depthCell(r) {
      var design   = n(r.design_depth_m);
      var actual   = n(r.actual_depth_m);
      var reported = actual !== null ? actual : n(r.current_depth_m);
      if (reported === null && design === null) return "—";
      return f(reported, 2) + " / " + f(design, 2);
    }

    // "Comment" = have any problems ever been recorded against this pile?
    // Source: site issues linked to the pile. Yes -> tooltip lists them;
    // amber when at least one is still open, grey when all are closed.
    function commentCell(pileIssues) {
      if (!pileIssues || !pileIssues.length) return '<span class="muted-line">No</span>';
      var open = pileIssues.some(function (i) {
        return i.status === "open" || i.status === "in_progress";
      });
      var tip = pileIssues.map(function (i) {
        return "#" + i.issue_number + " " + (i.title || "") + " (" + i.status + ")";
      }).join("\n");
      return '<span class="badge ' + (open ? "badge-anomaly" : "badge-gray") + '" title="' + esc(tip) + '">Yes' +
             (pileIssues.length > 1 ? " (" + pileIssues.length + ")" : "") + "</span>";
    }

    // ================= RECORD CARD (step 3) helpers =================

    var escHtml = UI.escHtml, dstr = UI.dstr;
    // number + unit, or em-dash when the database has nothing
    function numCell(v, dp, unit) {
      var x = n(v);
      return x === null ? "—" : f(x, dp) + (unit ? " " + unit : "");
    }
    // as-built steel from the bore log: {by_size:{T20:kg,…}, total_kg} —
    // show the tonnage; legacy array payloads fall back to a section count
    function steelCell(js) {
      if (js === null || js === undefined) return "—";
      if (typeof js === "string") { try { js = JSON.parse(js); } catch (e) { return "recorded"; } }
      if (Array.isArray(js)) return js.length + " cage section" + (js.length === 1 ? "" : "s");
      if (js && js.total_kg !== null && js.total_kg !== undefined)
        return f(Number(js.total_kg) / 1000, 2) + " t";
      return "recorded";
    }
    // reported depth + variance vs design (red when short of design)
    function depthReportedCell(r) {
      var actual = n(r.actual_depth_m), current = n(r.current_depth_m);
      var v = actual !== null ? actual : current;
      if (v === null) return "—";
      var txt = f(v, 2) + " m" + (actual === null ? ' <span class="muted">(in progress)</span>' : "");
      var dv = n(r.depth_variance_m);
      if (dv !== null && actual !== null)
        txt += ' <span class="' + (dv < 0 ? "neg" : "muted") + '">(' + (dv > 0 ? "+" : "") + f(dv, 2) + ")</span>";
      return txt;
    }
    // verified concrete: actual poured, with the theoretical volume alongside
    function concreteVerifiedCell(r) {
      var a = n(r.actual_concrete_m3), t = n(r.theoretical_concrete_m3);
      if (a === null && t === null) return "—";
      var s = a === null ? "—" : f(a, 1) + " m³";
      if (t !== null) s += ' <span class="muted">(theo ' + f(t, 1) + ")</span>";
      return s;
    }
    function cmpRow(label, design, reported, verified) {
      return "<tr><th>" + label + "</th><td>" + design + "</td><td>" + reported + "</td><td>" + verified + "</td></tr>";
    }
    // badge for a test status; unknown statuses fall back to grey
    function testStatusBadge(s) {
      s = s || "";
      var known = ["scheduled", "completed", "passed", "failed", "pending", "rejected"];
      var cls = known.indexOf(s) !== -1 ? s : "gray";
      return '<span class="badge badge-' + cls + '">' + (s ? escHtml(UI.label(s)) : "—") + "</span>";
    }

    // ================= TEST OPERATIONS (step 6, 0052) =================
    // TOPS.can gates the buttons only — the database re-checks the caller on
    // every call. Requirements add as 'pending' ("to arrange"); booking sets
    // the date; recording a result flips the requirement and the pile rollup.
    var TOPS = { can: false, types: [], specs: [], byCode: {},
                 projectId: null, testsByPile: {}, pilesById: {} };

    // report references are URLs when filed from the dashboard — link them
    function reportLink(ref) {
      if (/^https?:\/\//i.test(ref)) {
        return '<a href="' + esc(ref) + '" target="_blank" rel="noopener">open</a>';
      }
      return escHtml(ref);
    }

    // tests assigned to this pile (from the test tracker) + inline actions
    function testListHtml(tests, r) {
      var doneStates = ["completed", "passed"];
      var lines = (tests || []).map(function (t) {
        var when = t.actual_test_date ? "done " + dstr(t.actual_test_date)
                 : t.scheduled_test_date ? "booked " + dstr(t.scheduled_test_date)
                 : "to arrange";
        var bits = [when];
        if (t.test_result) bits.push("result: " + escHtml(t.test_result));
        if (t.report_reference) bits.push("report: " + reportLink(t.report_reference));
        var over = t.is_overdue ? ' <span class="badge badge-critical">overdue ' + (t.overdue_days || 0) + "d</span>" : "";
        var actions = "";
        if (TOPS.can && doneStates.indexOf(t.status) === -1) {
          var tt = TOPS.byCode[t.test_code];
          actions = ' <span class="move-ctl">' +
            '<input type="date" id="tob-' + t.test_req_id + '" value="' + esc(t.scheduled_test_date || "") + '">' +
            '<button type="button" data-action="to-book" data-req="' + t.test_req_id + '">' +
            (t.scheduled_test_date ? "Rebook" : "Book") + "</button>" +
            (t.scheduled_test_date
              ? '<button type="button" data-action="to-unbook" data-req="' + t.test_req_id + '">Unbook</button>'
              : "") +
            '<button type="button" data-action="to-result" data-req="' + t.test_req_id +
            '" data-pile-id="' + r.pile_id + '" data-code="' + esc(t.test_code || "") +
            '" data-mark="' + esc(t.pile_mark_no || "") + '">result…</button>' +
            (!t.test_result && !t.actual_test_date && tt
              ? '<button type="button" class="danger" data-action="to-remove" data-pile-id="' + r.pile_id +
                '" data-type="' + tt.test_type_id + '" data-code="' + esc(t.test_code || "") + '">remove</button>'
              : "") +
            "</span>";
        }
        return '<div class="pc-line"><strong>' + escHtml(t.test_code || "") + "</strong> " +
               escHtml(t.test_name || "") + " " + testStatusBadge(t.status) + over +
               ' <span class="pc-meta-inline">· ' + bits.join(" · ") + "</span>" + actions + "</div>";
      }).join("");
      var control = TOPS.can
        ? '<div class="pc-line"><button type="button" data-action="to-require" data-pile-id="' +
          r.pile_id + '">+ require test…</button></div>' +
          '<div id="tof-' + r.pile_id + '"></div>'
        : "";
      if (!lines && !control) return '<div class="muted-line">No tests assigned to this pile.</div>';
      return (lines || '<div class="muted-line">No tests assigned to this pile.</div>') + control;
    }

    function resultFormHtml(reqId, code, mark, pileId) {
      return '<div class="claim-form">' +
        "<strong>Record result — " + escHtml(code) + " on " + escHtml(mark) + "</strong>" +
        '<label>test date <input id="tor-date-' + reqId + '" type="date" value="' + Dash.todayKL() + '"></label>' +
        '<label>result <select id="tor-status-' + reqId + '">' +
          '<option value="passed">passed</option><option value="failed">failed</option>' +
          '<option value="inconclusive">inconclusive</option>' +
          '<option value="pending_review">pending review</option></select></label>' +
        '<label>report URL <input id="tor-url-' + reqId + '" size="22" placeholder="optional — Drive link"></label>' +
        '<label>remarks <input id="tor-remarks-' + reqId + '" size="12" placeholder="optional"></label>' +
        '<button type="button" data-action="to-result-save" data-req="' + reqId + '">Save result</button>' +
        '<button type="button" data-action="to-form-cancel" data-host="tof-' + pileId + '">Cancel</button>' +
        "</div>";
    }

    function requireFormHtml(r, existing) {
      var opts = TOPS.types.filter(function (t) {
        return existing.indexOf(t.test_code) === -1;
      }).map(function (t) {
        return '<option value="' + t.test_type_id + '">' + escHtml(t.test_code + " — " + t.test_name) + "</option>";
      }).join("");
      if (!opts) return '<div class="muted-line">All test types are already required on this pile.</div>';
      return '<div class="claim-form">' +
        "<strong>Require a test — " + escHtml(r.pile_mark_no || "") + "</strong>" +
        '<label>type <select id="tor-type-' + r.pile_id + '">' + opts + "</select></label>" +
        '<button type="button" data-action="to-require-save" data-pile-id="' + r.pile_id + '">Add requirement</button>' +
        '<button type="button" data-action="to-form-cancel" data-host="tof-' + r.pile_id + '">Cancel</button>' +
        '<span class="muted-line">added as &quot;to arrange&quot; — book it once curing is done</span>' +
        "</div>";
    }

    // per-project test spec panel: contract percentages + live coverage
    function specPanel() {
      var rows = TOPS.specs.map(function (s) {
        return '<div class="pc-line"><strong>' + escHtml(s.test_code) + "</strong> " +
          escHtml(s.test_name || "") + " · " + Number(s.percentage) + "%" +
          ' <span class="muted">&rArr; ~' + s.implied_tests + " of " + s.piles_registered + " piles</span>" +
          " · " + s.tests_assigned + " assigned · " + s.tests_done + " done" +
          (s.remarks ? ' <span class="muted">(' + escHtml(s.remarks) + ")</span>" : "") +
          (TOPS.can
            ? ' <span class="move-ctl">' +
              '<button type="button" data-action="to-spec-edit" data-type="' + s.test_type_id +
              '" data-pct="' + Number(s.percentage) + '" data-remarks="' + esc(s.remarks || "") + '">edit</button>' +
              '<button type="button" class="danger" data-action="to-spec-remove" data-type="' + s.test_type_id +
              '" data-code="' + esc(s.test_code) + '">remove</button></span>'
            : "") +
          "</div>";
      }).join("");
      var control = TOPS.can
        ? '<div class="pc-line"><button type="button" data-action="to-spec-add">+ add spec…</button></div>' +
          '<div id="tosf"></div>'
        : "";
      if (!rows && !control) return "";
      return '<details class="zone chase-panel"><summary><span class="zone-name">Test spec</span>' +
             '<span class="zone-count">' + TOPS.specs.length + " test type" + (TOPS.specs.length === 1 ? "" : "s") +
             " · contract percentages vs live coverage</span></summary>" +
             '<div class="chase-body">' +
             (rows || '<div class="muted-line">No test spec recorded for this project.</div>') +
             control + "</div></details>";
    }

    function specFormHtml(typeId, pct, remarks) {
      var opts = TOPS.types.map(function (t) {
        return '<option value="' + t.test_type_id + '"' + (t.test_type_id === typeId ? " selected" : "") + ">" +
               escHtml(t.test_code + " — " + t.test_name) + "</option>";
      }).join("");
      return '<div class="claim-form">' +
        "<strong>Test spec</strong>" +
        '<label>type <select id="tos-type">' + opts + "</select></label>" +
        '<label>percentage <input id="tos-pct" type="number" min="0.01" max="100" step="0.01" value="' + (pct || "") + '"></label>' +
        '<label>remarks <input id="tos-remarks" size="14" value="' + esc(remarks || "") + '" placeholder="optional"></label>' +
        '<button type="button" data-action="to-spec-save">Save spec</button>' +
        '<button type="button" data-action="to-form-cancel" data-host="tosf">Cancel</button>' +
        '<span class="muted-line">saving an existing type updates its percentage</span>' +
        "</div>";
    }

    // saves which zones are open + how far down the page is, THEN reloads —
    // so the office doesn't lose their place after every save
    function reloadKeepingPlace() {
      OPEN.saveFrom(document.getElementById("zones"));
      UI.saveScroll();
      window.location.reload();
    }

    // test-op buttons live in the spec panel AND the record cards — one
    // delegated listener on <main> covers both.
    function wireTestOps() {
      document.getElementById("main").addEventListener("click", async function (ev) {
        var btn = ev.target.closest('button[data-action^="to-"]');
        if (!btn) return;
        var act = btn.getAttribute("data-action");

        function fail(e) {
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Could not save: ' + escHtml((e && e.message) || e) + "</div>";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (act === "to-form-cancel") {
          var ch = document.getElementById(btn.getAttribute("data-host"));
          if (ch) ch.innerHTML = "";
          return;
        }
        if (act === "to-book") {
          var d = document.getElementById("tob-" + btn.getAttribute("data-req")).value;
          if (!d) return;
          try { await Dash.bookTest(btn.getAttribute("data-req"), d); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
        if (act === "to-unbook") {
          try { await Dash.bookTest(btn.getAttribute("data-req"), null); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
        if (act === "to-result") {
          var host = document.getElementById("tof-" + btn.getAttribute("data-pile-id"));
          if (host) host.innerHTML = resultFormHtml(btn.getAttribute("data-req"),
            btn.getAttribute("data-code"), btn.getAttribute("data-mark"),
            btn.getAttribute("data-pile-id"));
          return;
        }
        if (act === "to-result-save") {
          var req = btn.getAttribute("data-req");
          var rd = document.getElementById("tor-date-" + req).value;
          if (!rd) return;
          try {
            await Dash.recordTestResult(req, {
              testDate: rd,
              resultStatus: document.getElementById("tor-status-" + req).value,
              reportUrl: document.getElementById("tor-url-" + req).value || null,
              remarks: document.getElementById("tor-remarks-" + req).value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
        if (act === "to-remove") {
          if (!window.confirm("Remove the " + (btn.getAttribute("data-code") || "") +
                              " requirement from this pile?")) return;
          try {
            await Dash.setPileTestRequirement(btn.getAttribute("data-pile-id"),
              btn.getAttribute("data-type"), true);
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
        if (act === "to-require") {
          var pid = btn.getAttribute("data-pile-id");
          var rhost = document.getElementById("tof-" + pid);
          var pile = TOPS.pilesById[pid];
          if (!rhost || !pile) return;
          if (rhost.innerHTML) { rhost.innerHTML = ""; return; }
          var existing = (TOPS.testsByPile[pile.pile_mark_no] || []).map(function (t) { return t.test_code; });
          rhost.innerHTML = requireFormHtml(pile, existing);
          return;
        }
        if (act === "to-require-save") {
          var pid2 = btn.getAttribute("data-pile-id");
          var sel = document.getElementById("tor-type-" + pid2);
          if (!sel || !sel.value) return;
          try { await Dash.setPileTestRequirement(pid2, sel.value); reloadKeepingPlace(); }
          catch (e) { fail(e); }
          return;
        }
        if (act === "to-spec-add") {
          var sh = document.getElementById("tosf");
          if (sh) sh.innerHTML = sh.innerHTML ? "" : specFormHtml(null, "", "");
          return;
        }
        if (act === "to-spec-edit") {
          var sh2 = document.getElementById("tosf");
          if (sh2) sh2.innerHTML = specFormHtml(btn.getAttribute("data-type"),
            btn.getAttribute("data-pct"), btn.getAttribute("data-remarks"));
          return;
        }
        if (act === "to-spec-save") {
          var tsel = document.getElementById("tos-type");
          var pct = document.getElementById("tos-pct").value;
          if (!tsel || !tsel.value || !pct) return;
          try {
            await Dash.setProjectTestSpec(TOPS.projectId, tsel.value, {
              percentage: pct,
              remarks: document.getElementById("tos-remarks").value || null
            });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
        if (act === "to-spec-remove") {
          if (!window.confirm("Remove the " + (btn.getAttribute("data-code") || "") +
                              " spec row for this project?")) return;
          try {
            await Dash.setProjectTestSpec(TOPS.projectId, btn.getAttribute("data-type"),
              { remove: true });
            reloadKeepingPlace();
          } catch (e) { fail(e); }
          return;
        }
      });
    }

    // the pile's problem track record — every issue ever linked to it,
    // newest first, resolved ones kept (that is the point: memory)
    function issueListHtml(list) {
      if (!list || !list.length)
        return '<div class="muted-line">No problems recorded against this pile.</div>';
      var sorted = list.slice().sort(function (a, b) {
        return String(b.raised_date || "").localeCompare(String(a.raised_date || ""));
      });
      return sorted.map(function (i) {
        var st = i.status || "";
        var cls = (st === "open") ? "open" : (st === "in_progress") ? "in_progress" : "resolved";
        var meta = [dstr(i.raised_date) + (i.resolved_date ? " → resolved " + dstr(i.resolved_date) : "")];
        if (i.priority) meta.push(escHtml(UI.label(i.priority)));
        if (i.category) meta.push(escHtml(UI.label(i.category)));
        if (i.raised_by_name_resolved) meta.push("raised by " + escHtml(i.raised_by_name_resolved));
        var latest = i.latest_action
          ? '<div class="pc-latest">latest action: ' + escHtml(i.latest_action) +
            (i.latest_action_date ? " (" + Dash.klDateTime(i.latest_action_date) + ")" : "") + "</div>"
          : "";
        return '<div class="pc-issue"><strong>#' + i.issue_number + "</strong> " + escHtml(i.title || "") +
               ' <span class="badge badge-' + cls + '">' + escHtml(UI.label(st)) + "</span>" +
               '<div class="pc-meta">' + meta.join(" · ") + "</div>" + latest + "</div>";
      }).join("");
    }

    // ================= QUANTITIES DETAIL (step 7, 0054) =================
    // Steel by bar size + the parameters behind each number. The design-side
    // by-size split is rolled up from steel_breakdown.by_cage[] (bars mass
    // per diameter; each cage's spiral mass under its link diameter) — the
    // as-built side arrives ready-made as {by_size, total_kg}.
    function jparse(js) {
      if (js === null || js === undefined) return null;
      if (typeof js === "string") { try { return JSON.parse(js); } catch (e) { return null; } }
      return js;
    }
    function designBySize(sb) {
      sb = jparse(sb);
      if (!sb || !Array.isArray(sb.by_cage)) return null;
      var out = {};
      function add(dia, kg) {
        if (dia === null || dia === undefined || !kg) return;
        var k = "T" + Number(dia);
        out[k] = (out[k] || 0) + Number(kg);
      }
      sb.by_cage.forEach(function (c) {
        (c.bars || []).forEach(function (b) { add(b.dia_mm, b.mass_kg); });
        if (c.link) add(c.link.dia_mm, c.links_kg);
      });
      return Object.keys(out).length ? out : null;
    }
    function mergeBySize(into, map) {
      if (!map) return into;
      Object.keys(map).forEach(function (k) { into[k] = (into[k] || 0) + Number(map[k] || 0); });
      return into;
    }
    function sizeKeys(map) {
      return Object.keys(map).sort(function (a, b) { return Number(a.slice(1)) - Number(b.slice(1)); });
    }
    function fmtT(kg, dp) {
      if (kg === null || kg === undefined) return "—";
      var d = dp === undefined ? 2 : dp;
      return (Number(kg) / 1000).toLocaleString("en-MY",
        { minimumFractionDigits: d, maximumFractionDigits: d }) + " t";
    }
    function bySizeLine(map) {
      if (!map) return "—";
      return sizeKeys(map).map(function (k) {
        return "<strong>" + escHtml(k) + "</strong> " + fmtT(map[k]);
      }).join(" · ");
    }

    // per-pile fold-open: by-size split, parameters, the cage table — the
    // full working behind the card's Concrete and Steel numbers
    function steelDetailHtml(r) {
      var sb = jparse(r.steel_breakdown);
      var spec = jparse(r.design_reinforcement);
      var ab = jparse(r.as_built_steel);
      var abSpec = jparse(r.asbuilt_reinforcement);
      if (!sb && !ab && !spec) return "";

      var parts = [];

      var dMap = designBySize(sb);
      if (dMap) {
        parts.push('<div class="pc-line">Design by size: ' + bySizeLine(dMap) +
          (sb && sb.spacers_kg ? ' <span class="muted">(+ spacers ' + fmtT(sb.spacers_kg) + ")</span>" : "") +
          "</div>");
      }
      if (ab && ab.by_size) {
        parts.push('<div class="pc-line">As-built by size (bore log): ' + bySizeLine(ab.by_size) + "</div>");
      }

      var ps = [];
      var dia = (r.design_diameter_mm !== null && r.design_diameter_mm !== undefined)
        ? r.design_diameter_mm : r.diameter_mm;
      if (dia) ps.push("Ø " + dia + " mm");
      if (r.design_depth_m !== null && r.design_depth_m !== undefined)
        ps.push("depth " + f(n(r.design_depth_m), 2) + " m");
      var a = (sb && sb.assumptions) ? sb.assumptions : {};
      if (a.cover_mm !== null && a.cover_mm !== undefined) ps.push("cover " + a.cover_mm + " mm");
      if (a.lap_factor) ps.push("lap " + a.lap_factor + "D");
      if (a.stock_m) ps.push("stock " + a.stock_m + " m");
      if (a.starter_mm) ps.push("starter " + f(Number(a.starter_mm) / 1000, 1) + " m");
      if (spec && spec.fy) ps.push("fy " + spec.fy);
      if (ps.length) parts.push('<div class="pc-line">Parameters: ' + escHtml(ps.join(" · ")) + "</div>");
      if (spec && spec.spec_source)
        parts.push('<div class="pc-line muted-line">Spec source: ' + escHtml(spec.spec_source) + "</div>");

      if (dia && r.design_depth_m !== null && r.design_depth_m !== undefined &&
          r.design_concrete_m3 !== null && r.design_concrete_m3 !== undefined) {
        parts.push('<div class="pc-line">Concrete: π/4 × ' + f(Number(dia) / 1000, 3) + "² × " +
          f(n(r.design_depth_m), 2) + " m = <strong>" + f(n(r.design_concrete_m3), 2) + " m³</strong>" +
          ' <span class="muted">(generated in the database)</span></div>');
      }

      if (sb && Array.isArray(sb.by_cage) && sb.by_cage.length) {
        var secs = (spec && Array.isArray(spec.sections)) ? spec.sections : [];
        var rows = sb.by_cage.map(function (c) {
          var bars = (c.bars || []).map(function (b) {
            return b.count + "T" + b.dia_mm;
          }).join(" + ") + ((c.bars || []).length > 1 ? " (" + c.bars.length + " layers)" : "");
          var spiral = c.link
            ? "T" + c.link.dia_mm + " @ " + c.link.pitch_mm +
              (c.link.splice_laps ? ' <span class="muted">(' + c.link.splice_laps + " splice laps)</span>" : "")
            : "—";
          var sec = (secs[c.section] && secs[c.section].label)
            ? ' <span class="muted">' + escHtml(secs[c.section].label) + "</span>" : "";
          return "<tr><th>Cage " + c.cage + (c.top ? " (top)" : "") + sec + "</th>" +
            "<td>" + escHtml(bars) + "</td>" +
            "<td>" + spiral + "</td>" +
            '<td class="num">' + f(n(c.bar_len_m), 1) + " / " + f(n(c.coverage_m), 1) + " / " +
              f(n(c.overlap_m), 2) + "</td>" +
            '<td class="num">' + (c.mass_kg !== undefined && c.mass_kg !== null
              ? Number(c.mass_kg).toLocaleString("en-MY") : "—") + "</td></tr>";
        }).join("");
        parts.push('<table class="pc-table"><thead><tr><th></th><th>Main bars</th><th>Spiral</th>' +
          '<th class="num">Bar / coverage / overlap (m)</th><th class="num">kg</th></tr></thead><tbody>' +
          rows + "</tbody></table>");
      }

      if (abSpec && Array.isArray(abSpec.cages) && abSpec.cages.length) {
        var abRows = abSpec.cages.map(function (c) {
          var bits = [];
          if (c.main_count && c.main_dia_mm) bits.push(c.main_count + "T" + c.main_dia_mm);
          if (c.length_m) bits.push(f(Number(c.length_m), 1) + " m");
          if (c.spiral_dia_mm) bits.push("spiral T" + c.spiral_dia_mm +
            (c.spiral_pitch_mm ? " @ " + c.spiral_pitch_mm : ""));
          if (c.lap_to_next_m) bits.push("lap " + f(Number(c.lap_to_next_m), 2) + " m");
          return '<div class="pc-line"><span class="muted">Cage ' + (c.seq || "?") + ":</span> " +
                 escHtml(bits.join(" · ")) + "</div>";
        }).join("");
        parts.push('<div class="pc-line"><strong>As-built cages (bore-log sheet)</strong>' +
          (abSpec.starter_bar_length_m
            ? ' <span class="muted">starter ' + f(Number(abSpec.starter_bar_length_m), 1) + " m</span>" : "") +
          "</div>" + abRows);
      }

      if (sb && Array.isArray(sb.warnings) && sb.warnings.length) {
        parts.push('<div class="pc-line stale-warn">&#9888; ' + sb.warnings.map(escHtml).join(" · ") + "</div>");
      }

      if (!parts.length) return "";
      // plain <details> on purpose — details.zone would get swept up by
      // setAllZones / the open-state store
      return "<details><summary><strong>Calculation — steel by size &amp; parameters</strong></summary>" +
             '<div class="chase-body">' + parts.join("") + "</div></details>";
    }

    // the full record card — a hidden table row that sits under the pile's row
    function pileCard(r, pileIssues, pileTests) {
      var chips = [];
      if (r.design_concrete_grade) chips.push("Grade " + escHtml(r.design_concrete_grade));
      if (r.drawing_no) chips.push("Drawing " + escHtml(r.drawing_no) + (r.drawing_rev ? " rev " + escHtml(r.drawing_rev) : ""));

      var head =
        '<div class="pc-head"><strong>' + escHtml(r.pile_mark_no || "") + "</strong> " + stageBadge(r) +
        (chips.length ? ' <span class="pc-chips">' + chips.join(" · ") + "</span>" : "") + "</div>";
      var steelDetail = steelDetailHtml(r);

      var dims =
        "<div><h3>Design vs site vs verified</h3>" +
        '<table class="pc-table"><thead><tr><th></th><th>Design</th><th>Site reported</th><th>Verified (bore log)</th></tr></thead><tbody>' +
        cmpRow("Diameter",
               numCell(r.design_diameter_mm !== null ? r.design_diameter_mm : r.diameter_mm, 0, "mm"),
               numCell(r.diameter_mm, 0, "mm"),
               numCell(r.as_built_diameter_mm, 0, "mm")) +
        cmpRow("Depth / length", numCell(r.design_depth_m, 2, "m"), depthReportedCell(r), numCell(r.verified_pile_length_m, 2, "m")) +
        // site never reports socket/concrete — those columns were dropped in
        // 0029; the site cells are honestly blank (verified side fills them)
        cmpRow("Rock socket", numCell(r.design_socket_length_m, 2, "m"), "—", numCell(r.verified_cored_socket_m, 2, "m")) +
        cmpRow("Concrete", numCell(r.design_concrete_m3, 1, "m³"), "—", concreteVerifiedCell(r)) +
        cmpRow("Steel", numCell(r.design_steel_total_t, 2, "t"), "—", steelCell(r.as_built_steel)) +
        cmpRow("Cast date", "—", dstr(r.cast_date), dstr(r.verified_cast_date)) +
        "</tbody></table></div>";

      var dates =
        "<div><h3>Key dates</h3>" +
        '<div class="pc-line">Boring: ' + dstr(r.bore_start_date) + " → " + dstr(r.bore_end_date) + "</div>" +
        '<div class="pc-line">Cast (site): ' + dstr(r.cast_date) + "</div>" +
        '<div class="pc-line">Cast (verified): ' + dstr(r.verified_cast_date) + "</div></div>";

      var bore =
        "<div><h3>Bore log</h3>" +
        '<div class="pc-line">' + boreChip(r) + (r.bore_log_ref ? " · ref " + escHtml(r.bore_log_ref) : "") + "</div>" +
        (r.bore_verified_by_name
          ? '<div class="pc-line">verified by ' + escHtml(r.bore_verified_by_name) +
            (r.bore_verified_at ? " · " + Dash.klDateTime(r.bore_verified_at) : "") + "</div>"
          : "") + "</div>";

      return '<tr class="pile-card-row" hidden><td colspan="6"><div class="pile-card">' +
             head +
             '<div class="pc-grid">' + dims + '<div class="pc-side">' + dates + bore + "</div></div>" +
             steelDetail +
             "<div><h3>Testing</h3>" + testListHtml(pileTests, r) + "</div>" +
             "<div><h3>Track record</h3>" + issueListHtml(pileIssues) + "</div>" +
             "</div></td></tr>";
    }

    // ================= QUANTITIES PANEL (step 7) — by zone + by bar size ====
    // Same semantics as the hub summary: "in ground" = cast piles at design
    // quantities; boring reported = site-reported depth; per-pile working
    // lives in each record card's Calculation fold-open.
    function pileQuantitiesPanel(piles) {
      if (!piles.length) return "";
      var CAST = ["cast_complete", "head_trimmed"];
      function isCast(r) { return CAST.indexOf(r.construction_status) !== -1; }
      function sumBy(list, fn) {
        var s = null;
        list.forEach(function (r) {
          var v = fn(r);
          if (v === null || v === undefined || isNaN(Number(v))) return;
          s = (s === null ? 0 : s) + Number(v);
        });
        return s;
      }
      function fmtN(v, dp) {
        if (v === null || v === undefined) return "—";
        return Number(v).toLocaleString("en-MY",
          { minimumFractionDigits: dp, maximumFractionDigits: dp });
      }
      function pair(a, b, dp) {
        return fmtN(a, dp) + ' <span class="muted">/ ' + fmtN(b, dp) + "</span>";
      }

      var zones = {};
      piles.forEach(function (r) { var z = r.zone || "Unzoned"; (zones[z] = zones[z] || []).push(r); });

      function zRow(name, list, bold) {
        var cast = list.filter(isCast);
        return "<tr>" +
          UI.td("Zone", bold ? "<strong>" + escHtml(name) + "</strong>" : escHtml(name)) +
          UI.td("Piles cast", cast.length + " / " + list.length, "num") +
          UI.td("Boring m (reported / design)",
            pair(sumBy(list, function (r) {
                   return (r.actual_depth_m !== null && r.actual_depth_m !== undefined)
                     ? r.actual_depth_m : r.current_depth_m;
                 }),
                 sumBy(list, function (r) { return r.design_depth_m; }), 1), "num") +
          UI.td("Concrete m³ (in ground / design)",
            pair(sumBy(cast, function (r) { return r.design_concrete_m3; }),
                 sumBy(list, function (r) { return r.design_concrete_m3; }), 1), "num") +
          UI.td("Steel t (in ground / design)",
            pair(sumBy(cast, function (r) { return r.design_steel_total_t; }),
                 sumBy(list, function (r) { return r.design_steel_total_t; }), 2), "num") +
        "</tr>";
      }

      var zoneNames = Object.keys(zones).sort();
      var zoneRows = zoneNames.map(function (z) { return zRow(z, zones[z], false); }).join("");
      var totalRow = zRow("Project total", piles, true);

      var zoneTable =
        '<div class="table-wrap table-stack"><table>' +
        '<thead><tr><th>Zone</th><th class="num">Piles cast</th>' +
        '<th class="num">Boring m<br><span class="muted">reported / design</span></th>' +
        '<th class="num">Concrete m³<br><span class="muted">in ground / design</span></th>' +
        '<th class="num">Steel t<br><span class="muted">in ground / design</span></th></tr></thead>' +
        "<tbody>" + zoneRows + totalRow + "</tbody></table></div>";

      // steel by bar size (project level): design vs in-ground vs as-built
      var dAll = {}, dCast = {}, abAll = {};
      var withBreakdown = 0;
      piles.forEach(function (r) {
        var m = designBySize(r.steel_breakdown);
        if (m) {
          withBreakdown++;
          mergeBySize(dAll, m);
          if (isCast(r)) mergeBySize(dCast, m);
        }
        var ab = jparse(r.as_built_steel);
        if (ab && ab.by_size) mergeBySize(abAll, ab.by_size);
      });
      var allKeys = sizeKeys(mergeBySize(mergeBySize({}, dAll), abAll));
      var sizeTable = "";
      if (allKeys.length) {
        var sRows = allKeys.map(function (k) {
          return "<tr>" +
            UI.td("Size", "<strong>" + escHtml(k) + "</strong>") +
            UI.td("Design", dAll[k] !== undefined ? fmtT(dAll[k]) : "—", "num") +
            UI.td("In ground (cast piles)", dCast[k] !== undefined ? fmtT(dCast[k]) : "—", "num") +
            UI.td("As-built (bore logs)", abAll[k] !== undefined ? fmtT(abAll[k]) : "—", "num") +
          "</tr>";
        }).join("");
        sizeTable =
          '<div class="pc-line" style="margin-top:8px"><strong>Steel by bar size</strong></div>' +
          '<div class="table-wrap table-stack"><table>' +
          '<thead><tr><th>Size</th><th class="num">Design</th>' +
          '<th class="num">In ground</th><th class="num">As-built</th></tr></thead>' +
          "<tbody>" + sRows + "</tbody></table></div>";
      }

      var notes = [];
      if (withBreakdown < piles.length) {
        notes.push('<span class="stale-warn">steel spec on ' + withBreakdown + " of " +
                   piles.length + " piles — size totals exclude the rest</span>");
      }
      notes.push("in ground = cast piles at design quantities · boring reported = site-reported depth");
      notes.push("concrete per pile = π/4 × Ø² × design depth · steel = per-pile cage model — " +
                 "open a pile's record card for its full working");

      return '<details class="zone chase-panel">' +
             '<summary><span class="zone-name">Quantities — design vs actual</span>' +
             '<span class="zone-count">' + zoneNames.length + " zone" + (zoneNames.length === 1 ? "" : "s") +
             " · by zone, by bar size</span></summary>" +
             '<div class="chase-body">' + zoneTable + sizeTable +
             '<div class="pipe-note">' + notes.join(" · ") + "</div></div></details>";
    }

    // ================= PIPELINE STRIP (step 5) =================
    // Planned = grey (no progress ink); boring stages = blues deepening
    // with progress; Cast/Trimmed switch to green — same "green = cast"
    // language as the stage badges. Palette validated (CVD-safe on white);
    // the canonical copy lives in ui.js.
    var STAGE_COLORS = UI.STAGE_COLORS;

    function pipelineStrip(piles) {
      var counts = {};
      STAGES.forEach(function (s) { counts[s[0]] = 0; });
      piles.forEach(function (r) { counts[stageOf(r.construction_status)]++; });
      var total = piles.length;
      if (!total) return "";

      var segs = STAGES.map(function (s) {
        var name = s[0], c = counts[name];
        if (!c) return "";
        var pct = Math.round(c * 100 / total);
        return '<span class="pipe-seg" style="flex-grow:' + c + ";background:" + STAGE_COLORS[name] +
               '" title="' + name + " — " + c + " pile" + (c === 1 ? "" : "s") + " (" + pct + '%)"></span>';
      }).join("");

      var keys = STAGES.map(function (s) {
        var name = s[0], c = counts[name];
        return '<span class="pipe-key' + (c ? "" : " zero") + '">' +
               '<i style="background:' + STAGE_COLORS[name] + '"></i>' +
               name + " <b>" + c + "</b></span>";
      }).join("");

      return '<div class="pipe-card"><div class="pipe-bar">' + segs + "</div>" +
             '<div class="pipe-legend"><span class="pipe-total">' + total + " piles</span>" +
             keys + "</div></div>";
    }

    // ================= RECORDS TO CHASE (step 4) =================

    // a clickable pile chip; data-pile lets the click handler find the row
    function chaseChip(pileMark, label) {
      return '<button type="button" class="chase-pile" data-pile="' + esc(pileMark) + '">' +
             escHtml(label) + "</button>";
    }
    function chaseRow(title, chips) {
      return '<div class="chase-row"><span class="chase-label">' + title +
             ' <span class="chase-count">' + chips.length + "</span></span>" +
             '<span class="chase-chips">' + chips.join("") + "</span></div>";
    }

    // the four chase rules, computed from data the page already loaded
    function chaseChecklist(piles, testsByPile) {
      var done = ["completed", "passed", "failed"];
      var allTests = [];
      Object.keys(testsByPile).forEach(function (k) { allTests = allTests.concat(testsByPile[k]); });
      allTests.sort(function (a, b) { return String(a.pile_mark_no).localeCompare(String(b.pile_mark_no)); });

      // 1) cast but no bore log captured at all
      var boreMissing = piles.filter(function (r) {
        return (r.construction_status === "cast_complete" || r.construction_status === "head_trimmed") &&
               r.bore_log_ref === null && r.bore_review_status === null;
      }).map(function (r) { return chaseChip(r.pile_mark_no, r.pile_mark_no); });

      // 2) booked test date came and went (the tracker computes is_overdue)
      var missed = allTests.filter(function (t) { return t.is_overdue === true; })
        .map(function (t) {
          return chaseChip(t.pile_mark_no, t.pile_mark_no + " · " + (t.test_code || t.test_name || "test") +
                           (t.overdue_days ? " · " + t.overdue_days + "d late" : ""));
        });

      // 3) curing done, test not booked yet ("to arrange"; days since curing
      //    shown so long-idle ones stand out — red escalation lives on the hub)
      var toArrange = allTests.filter(function (t) {
        return !t.scheduled_test_date && !t.actual_test_date && !t.test_result &&
               done.indexOf(t.status) === -1 &&
               t.days_until_eligible !== null && t.days_until_eligible <= 0;
      }).map(function (t) {
        return chaseChip(t.pile_mark_no, t.pile_mark_no + " · " + (t.test_code || t.test_name || "test") +
                         " · curing done " + (-t.days_until_eligible) + "d");
      });

      // 4) test carried out but no report reference filed
      var reportMissing = allTests.filter(function (t) {
        return (t.actual_test_date || t.test_result) && !t.report_reference;
      }).map(function (t) {
        return chaseChip(t.pile_mark_no, t.pile_mark_no + " · " + (t.test_code || t.test_name || "test"));
      });

      var sections = [];
      if (boreMissing.length)   sections.push(chaseRow("Bore log missing", boreMissing));
      if (missed.length)        sections.push(chaseRow("Test date missed", missed));
      if (toArrange.length)     sections.push(chaseRow("Test to arrange", toArrange));
      if (reportMissing.length) sections.push(chaseRow("Test report missing", reportMissing));

      var total = boreMissing.length + missed.length + toArrange.length + reportMissing.length;
      var body = total === 0
        ? '<div class="muted-line">&#10003; Nothing to chase — pile records are up to date.</div>'
        : sections.join("");
      return '<details class="zone chase-panel" open>' +
             '<summary><span class="zone-name">Records to chase</span>' +
             '<span class="zone-count">' + total + " item" + (total === 1 ? "" : "s") + "</span></summary>" +
             '<div class="chase-body">' + body + "</div></details>";
    }

    // click a chase chip -> jump to that pile's row, open its zone + card
    function wireChaseJumps() {
      document.getElementById("chase").addEventListener("click", function (ev) {
        var btn = ev.target.closest("button.chase-pile");
        if (!btn) return;
        var mark = btn.getAttribute("data-pile").replace(/"/g, '\\"');
        var row = document.querySelector('tr.pile-row[data-pile="' + mark + '"]');
        if (!row) return;
        var det = row.closest("details");
        if (det) det.open = true;
        var card = row.nextElementSibling;
        if (card && card.classList.contains("pile-card-row") && card.hidden) {
          card.hidden = false;
          row.classList.add("open");
        }
        row.scrollIntoView({ behavior: "smooth", block: "center" });
        row.classList.add("flash");
        setTimeout(function () { row.classList.remove("flash"); }, 1700);
      });
    }

    // header line for a zone block: "12 piles · 9 cast"
    // "cast" = concrete actually poured (cast_complete or head_trimmed)
    function zoneSummary(zr) {
      var cast = zr.filter(function (r) {
        return r.construction_status === "cast_complete" || r.construction_status === "head_trimmed";
      }).length;
      return zr.length + " pile" + (zr.length === 1 ? "" : "s") + " · " + cast + " cast";
    }

    function setAllZones(open) {
      document.querySelectorAll("details.zone").forEach(function (d) { d.open = open; });
    }

    var THEAD =
      "<thead><tr>" +
      "<th>Pile</th><th>Stage</th>" +
      '<th class="num" title="Latest reported depth (site reports, provisional) / design depth (drawing)">Depth — reported / design (m)</th>' +
      '<th title="Bore-log record state">Bore log</th>' +
      "<th>Testing</th>" +
      '<th title="Has any problem been recorded against this pile? Hover a Yes for the list.">Problems</th>' +
      "</tr></thead>";

    window.onShellReady = async function () {
      var projectId = new URLSearchParams(location.search).get("project");
      var titleEl = document.getElementById("project-title");

      if (!projectId) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-amber">No project selected — open a project from the ' +
          '<a href="index.html">Overview</a> or <a href="projects.html">Progress</a> page.</div>';
        return;
      }

      try {
        var results = await Promise.all([
          Dash.getProjectPulse(),
          Dash.getPileRegister(projectId),
          Dash.getIssues("all"),
          Dash.getTests(true),         // all tests incl. completed — for the record card
          Dash.getMyProfile(),         // test-op buttons: management/office only
          Dash.getTestTypes(),         // require-test picker + spec form
          Dash.getProjectTestSpecs()   // this project's spec panel
        ]);
        var p = results[0].find(function (x) { return x.project_id === projectId; });
        var piles = results[1];
        titleEl.textContent = p ? p.project_code + " — " + (p.project_name || "") : "Unknown project";

        // test operations context (0052)
        var profile = results[4];
        TOPS.can = !!(profile &&
          (profile.designation === "management" || profile.designation === "office"));
        TOPS.types = results[5];
        TOPS.types.forEach(function (t) { TOPS.byCode[t.test_code] = t; });
        TOPS.specs = results[6].filter(function (s) { return s.project_id === projectId; });
        TOPS.projectId = projectId;
        piles.forEach(function (r) { TOPS.pilesById[r.pile_id] = r; });

        // issues recorded against THIS project's piles, keyed by pile mark
        var issuesByPile = {};
        if (p) {
          results[2].forEach(function (i) {
            if (i.project_code === p.project_code && i.affected_pile_mark) {
              (issuesByPile[i.affected_pile_mark] = issuesByPile[i.affected_pile_mark] || []).push(i);
            }
          });
        }

        // tests for THIS project's piles, keyed by pile mark (for the card)
        var testsByPile = {};
        if (p) {
          results[3].forEach(function (t) {
            if (t.project_code === p.project_code && t.pile_mark_no) {
              (testsByPile[t.pile_mark_no] = testsByPile[t.pile_mark_no] || []).push(t);
            }
          });
        }
        TOPS.testsByPile = testsByPile;   // the require-test picker filters against these

        var zonesEl = document.getElementById("zones");
        if (!piles.length) {
          zonesEl.innerHTML = '<div class="table-wrap"><table><tbody><tr><td class="empty">No piles registered for this project yet.</td></tr></tbody></table></div>';
          return;
        }

        // one table block per zone
        var zones = {};
        piles.forEach(function (r) { var z = r.zone || "Unzoned"; (zones[z] = zones[z] || []).push(r); });

        zonesEl.innerHTML = Object.keys(zones).sort().map(function (z) {
          var zr = zones[z];
          var rows = zr.map(function (r) {
            return '<tr class="pile-row" data-pile="' + esc(r.pile_mark_no || "") + '" title="Click to open the full record">' +
              '<td><span class="row-caret">&#9656;</span><strong>' + (r.pile_mark_no || "") + "</strong></td>" +
              "<td>" + stageBadge(r) + "</td>" +
              '<td class="num">' + depthCell(r) + "</td>" +
              "<td>" + boreChip(r) + "</td>" +
              "<td>" + testBadge(r) + "</td>" +
              "<td>" + commentCell(issuesByPile[r.pile_mark_no]) + "</td>" +
            "</tr>" +
            pileCard(r, issuesByPile[r.pile_mark_no], testsByPile[r.pile_mark_no]);
          }).join("");
          return '<details class="zone" open data-zone="' + esc(z) + '" data-group="' + esc(z) + '">' +
                 '<summary><span class="zone-name">' + z + '</span>' +
                 '<span class="zone-count">' + zoneSummary(zr) + "</span></summary>" +
                 '<div class="table-wrap zone-table table-sticky-first"><table>' + THEAD +
                 "<tbody>" + rows + "</tbody></table></div>" +
                 "</details>";
        }).join("");
        document.getElementById("zone-tools").hidden = false;

        // coming back from a save? restore which zones were open + the scroll
        var savedOpen = OPEN.load();
        if (Object.keys(savedOpen).length) {
          zonesEl.querySelectorAll("details.zone[data-group]").forEach(function (d) {
            d.open = !!savedOpen[d.getAttribute("data-group")];
          });
          OPEN.saveMap({});   // one-shot — don't keep overriding future visits
        }
        UI.restoreScroll();

        // pipeline strip + records-to-chase panel + test spec above the tables
        document.getElementById("pipeline").innerHTML = pipelineStrip(piles);
        document.getElementById("chase").innerHTML = chaseChecklist(piles, testsByPile);
        document.getElementById("testspec").innerHTML = specPanel();
        document.getElementById("pilequantities").innerHTML = pileQuantitiesPanel(piles);
        wireChaseJumps();
        wireTestOps();

        // arrived via a zone link on the project hub? land on that zone
        var zoneParam = new URLSearchParams(location.search).get("zone");
        if (zoneParam) {
          var targetZone = document.querySelector(
            'details.zone[data-zone="' + zoneParam.replace(/"/g, '\\"') + '"]');
          if (targetZone) {
            targetZone.open = true;
            targetZone.scrollIntoView({ behavior: "smooth", block: "start" });
            targetZone.classList.add("flash-zone");
            setTimeout(function () { targetZone.classList.remove("flash-zone"); }, 1700);
          }
        }

        // arrived via a tests-queue link? land on that pile with its card open
        var pileParam = new URLSearchParams(location.search).get("pile");
        if (pileParam) {
          var pileRow = document.querySelector(
            'tr.pile-row[data-pile="' + pileParam.replace(/"/g, '\\"') + '"]');
          if (pileRow) {
            var pd = pileRow.closest("details");
            if (pd) pd.open = true;
            var pcard = pileRow.nextElementSibling;
            if (pcard && pcard.classList.contains("pile-card-row")) {
              pcard.hidden = false;
              pileRow.classList.add("open");
            }
            pileRow.scrollIntoView({ behavior: "smooth", block: "center" });
            pileRow.classList.add("flash");
            setTimeout(function () { pileRow.classList.remove("flash"); }, 1700);
          }
        }

        // click a pile row -> toggle the record card row that sits under it
        zonesEl.addEventListener("click", function (ev) {
          var tr = ev.target.closest("tr.pile-row");
          if (!tr) return;
          var card = tr.nextElementSibling;
          if (!card || !card.classList.contains("pile-card-row")) return;
          card.hidden = !card.hidden;
          tr.classList.toggle("open", !card.hidden);
        });
      } catch (e) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load: ' + (e.message || e) + "</div>";
      }
    };
  </script>
</body>
</html>
