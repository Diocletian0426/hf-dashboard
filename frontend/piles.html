<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Dashboard — Pile Records</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= PAGE HEADER (step 1) =================
         "This is the pile record page for which project:
          project code — project name."                        -->
    <div class="page-eyebrow">Pile Records</div>
    <h1 id="project-title">Loading…</h1>

    <div id="error"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="shell.js"></script>

  <script>
    window.onShellReady = async function () {
      var projectId = new URLSearchParams(location.search).get("project");
      var titleEl = document.getElementById("project-title");

      if (!projectId) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-amber">No project selected — open a project from the ' +
          '<a href="index.html">Overview</a> or <a href="projects.html">Progress</a> page.</div>';
        return;
      }

      try {
        var projects = await Dash.getProjectPulse();
        var p = projects.find(function (x) { return x.project_id === projectId; });
        titleEl.textContent = p
          ? p.project_code + " — " + (p.project_name || "")
          : "Unknown project";
      } catch (e) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load: ' + (e.message || e) + "</div>";
      }
    };
  </script>
</body>
</html>
