<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Claims</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= PROJECT CLAIMS (working page — MONEY) =================
         Reached from the project hub's "Open claims page" link. This is where
         the OFFICE works claims: create a claim, enter/correct line quantities,
         certify, mark paid, delete the latest claim. The hub's claims section
         is the view-only mirror of this page.
         Access: shell PAGE_ACCESS gates the page to management/office, and the
         database re-checks the caller's designation on EVERY read and write
         (0035-0037 SECURITY DEFINER functions) — buttons are convenience,
         never the guard. BQ entry deliberately has no form (SQL sessions). -->
    <div class="page-eyebrow">Project claims</div>
    <h1 id="claims-title">Loading…</h1>
    <p id="claims-sub" class="page-caption"></p>

    <div id="claims"></div>

    <div id="error"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="claims-ui.js"></script>
  <script src="shell.js"></script>

  <script>
    // ---- shared helpers + rendering live in ui.js / claims-ui.js ----
    var esc = UI.esc, escHtml = UI.escHtml, dstr = UI.dstr;
    var fmtRM = UI.fmtRM, fmtPct = UI.fmtPct, mstr = UI.mstr;
    // '2026-05' (month picker) -> '2026-05-31' (period_to stores the month's last day)
    function monthEnd(ym) {
      if (!ym) return null;
      var p = ym.split("-");
      var last = new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate();
      return ym + "-" + (last < 10 ? "0" + last : last);
    }

    // shared claims state — survives every re-render between edits
    var CL = {
      projectId: null, p: null, sum: null, register: [], bq: [],
      linesByClaim: {}, open: {}, edit: null, err: "", ok: ""
    };
    function claimByNo(no) {
      return CL.register.find(function (c) { return c.claim_no === Number(no); });
    }
    function maxClaimNo() {
      return CL.register.reduce(function (m, c) { return Math.max(m, c.claim_no); }, 0);
    }

    var claimsSummaryCards = ClaimsUI.summaryCards;
    var claimLinesTable = ClaimsUI.linesTable;

    // EDIT LINES: one qty input per BQ item (blank/0 = not claimed this claim);
    // per-line amount and the claim total recompute live as you type.
    function claimLinesEditTable(claim) {
      var lines = CL.linesByClaim[claim.claim_no] || [];
      var byItem = {};
      lines.forEach(function (l) { byItem[l.bq_item_id] = l; });
      var rows = CL.bq.map(function (b) {
        var l = byItem[b.bq_item_id];
        var val = l ? l.qty_claimed : "";
        return "<tr>" +
          "<td>" + escHtml(b.item_code || "") + "</td>" +
          '<td class="wrap">' + escHtml(b.description) + "</td>" +
          "<td>" + escHtml(b.unit || "") + "</td>" +
          '<td class="num">' + (b.rate === null ? "—" : fmtRM(b.rate)) + "</td>" +
          '<td class="num">' + (l && Number(l.prev_qty_claimed) ? l.prev_qty_claimed : "—") + "</td>" +
          '<td class="num"><input class="qty" type="number" step="0.01" min="0"' +
            ' data-item="' + b.bq_item_id + '" data-old="' + val + '"' +
            ' data-rate="' + (b.rate === null ? "" : b.rate) + '" value="' + val + '" placeholder="—"></td>' +
          '<td class="num line-amt">' + (l ? fmtRM(l.amount_claimed) : "—") + "</td>" +
        "</tr>";
      }).join("");
      return '<table class="claim-lines">' +
             "<thead><tr><th>#</th><th>Description</th><th>Unit</th>" +
             '<th class="num">Rate</th><th class="num">Previous</th>' +
             '<th class="num">This claim qty</th><th class="num">Amount</th></tr></thead>' +
             "<tbody>" + rows + "</tbody>" +
             '<tfoot><tr><td colspan="6">This claim total</td>' +
             '<td class="num claim-live-total"></td></tr></tfoot></table>' +
             '<div class="claim-actions">' +
             '<button type="button" data-action="save-lines" data-claim="' + claim.claim_no + '">Save lines</button>' +
             '<button type="button" data-action="cancel-edit">Cancel</button>' +
             '<span class="muted-line">blank or 0 = not claimed (an uncertified line is removed)</span></div>';
    }

    // CERTIFY: inputs only for the lines this claim actually claimed.
    function claimCertifyTable(claim) {
      var lines = CL.linesByClaim[claim.claim_no] || [];
      if (!lines.length) {
        return '<div class="muted-line" style="padding:8px 12px">Nothing claimed — nothing to certify.</div>' +
               '<div class="claim-actions"><button type="button" data-action="cancel-edit">Close</button></div>';
      }
      var rows = lines.map(function (l) {
        var val = l.qty_certified === null ? "" : l.qty_certified;
        return "<tr>" +
          "<td>" + escHtml(l.item_code || "") + "</td>" +
          '<td class="wrap">' + escHtml(l.description) + "</td>" +
          "<td>" + escHtml(l.unit || "") + "</td>" +
          '<td class="num">' + (l.rate === null ? "—" : fmtRM(l.rate)) + "</td>" +
          '<td class="num">' + l.qty_claimed + "</td>" +
          '<td class="num"><input class="qty" type="number" step="0.01" min="0"' +
            ' data-item="' + l.bq_item_id + '" data-old="' + val + '" value="' + val + '" placeholder="—"></td>' +
        "</tr>";
      }).join("");
      return '<table class="claim-lines">' +
             "<thead><tr><th>#</th><th>Description</th><th>Unit</th>" +
             '<th class="num">Rate</th><th class="num">Claimed</th>' +
             '<th class="num">Certified qty</th></tr></thead>' +
             "<tbody>" + rows + "</tbody></table>" +
             '<div class="claim-actions">' +
             '<label>certified date <input type="date" id="certify-date" value="' +
               esc(claim.certified_date || Dash.todayKL()) + '"></label>' +
             '<button type="button" data-action="save-certify" data-claim="' + claim.claim_no + '">Save &amp; mark certified</button>' +
             '<button type="button" data-action="cancel-edit">Cancel</button>' +
             '<span class="muted-line">blank = not certified</span></div>';
    }

    // header facts form (period / submitted / retention / remarks)
    function claimHeaderForm(claim) {
      var ym = claim.period_to ? String(claim.period_to).slice(0, 7) : "";
      return '<div class="claim-form">' +
        '<label>period (month) <input type="month" id="cf-period" value="' + ym + '"></label>' +
        '<label>submitted <input type="date" id="cf-submitted" value="' + esc(claim.submitted_date || "") + '"></label>' +
        '<label>retention % <input type="number" id="cf-ret" step="0.5" min="0" max="100" value="' + claim.retention_pct + '"></label>' +
        '<label>cap % of contract <input type="number" id="cf-cap" step="0.5" min="0" max="100" value="' +
          (claim.retention_cap_pct === null ? "" : claim.retention_cap_pct) + '"></label>' +
        '<label>remarks <input type="text" id="cf-remarks" size="30" value="' + esc(claim.remarks || "") + '"></label>' +
        '<button type="button" data-action="save-header" data-claim="' + claim.claim_no + '">Save</button>' +
        '<button type="button" data-action="cancel-edit">Cancel</button>' +
        "</div>";
    }

    function newClaimForm() {
      return '<div class="claim-form">' +
        "<strong>New claim #" + (maxClaimNo() + 1) + "</strong>" +
        '<label>period (month) <input type="month" id="nc-period"></label>' +
        '<label>submitted <input type="date" id="nc-submitted" value="' + Dash.todayKL() + '"></label>' +
        '<label>retention % <input type="number" id="nc-ret" step="0.5" min="0" max="100" value="10"></label>' +
        '<label>cap % of contract <input type="number" id="nc-cap" step="0.5" min="0" max="100" value="5"></label>' +
        '<label>remarks <input type="text" id="nc-remarks" size="24"></label>' +
        '<button type="button" data-action="create-claim">Create — then enter quantities</button>' +
        '<button type="button" data-action="cancel-edit">Cancel</button>' +
        "</div>";
    }

    function claimActionsBar(claim) {
      var b = [
        '<button type="button" data-action="edit-lines" data-claim="' + claim.claim_no + '">Edit lines</button>',
        '<button type="button" data-action="certify" data-claim="' + claim.claim_no + '">Certify…</button>',
        '<button type="button" data-action="edit-header" data-claim="' + claim.claim_no + '">Claim info…</button>'
      ];
      if (claim.status === "certified")
        b.push('<button type="button" data-action="mark-paid" data-claim="' + claim.claim_no + '">Mark paid</button>');
      if (claim.status === "paid")
        b.push('<button type="button" data-action="unmark-paid" data-claim="' + claim.claim_no + '">Back to certified</button>');
      if (claim.claim_no === maxClaimNo())
        b.push('<button type="button" class="danger" data-action="delete-claim" data-claim="' + claim.claim_no + '">Delete claim…</button>');
      return '<div class="claim-actions">' + b.join("") + "</div>";
    }

    // register rows come from the shared renderer; the fold-open cell is this
    // page's working surface (action bar / edit-lines / certify / claim info)
    function claimRegisterTable() {
      return ClaimsUI.registerTable(CL.register, CL.open, function (c) {
        var editing = (CL.edit && CL.edit.claimNo === c.claim_no) ? CL.edit.mode : null;
        if (editing === "lines")   return claimLinesEditTable(c);
        if (editing === "certify") return claimCertifyTable(c);
        if (editing === "header")  return claimHeaderForm(c) + claimLinesTable(CL.linesByClaim[c.claim_no] || []);
        return claimActionsBar(c) + claimLinesTable(CL.linesByClaim[c.claim_no] || []);
      });
    }

    function bqStatusBlock(bq) {
      return ClaimsUI.bqTable(bq, "BQ entry stays a working-session job");
    }

    async function fetchClaims() {
      var res = await Promise.all([
        Dash.getClaimSummaries(),
        Dash.getClaimRegister(CL.projectId),
        Dash.getBqStatus(CL.projectId),
        Dash.getClaimLines(CL.projectId)
      ]);
      CL.sum = res[0].find(function (s) { return s.project_id === CL.projectId; }) || null;
      CL.register = res[1];
      CL.bq = res[2];
      CL.linesByClaim = {};
      res[3].forEach(function (l) {
        (CL.linesByClaim[l.claim_no] = CL.linesByClaim[l.claim_no] || []).push(l);
      });
    }

    function renderClaims() {
      var el = document.getElementById("claims");
      if (!el) return;

      if (!CL.sum && !CL.register.length) {
        el.innerHTML =
          '<div class="muted-line" style="margin-top:8px">No BQ entered for this project yet — ' +
          "money figures appear once its Bill of Quantities is in the system (BQ entry stays a working-session job).</div>";
        return;
      }

      // honesty pairing: physical progress vs money progress, side by side
      var castPct = Math.max(0, Math.min(100, Number(CL.p.progress_pct) || 0));
      var honesty = CL.sum
        ? '<div class="muted-line" style="margin:2px 0 12px">' +
          "Physical vs money: piles cast <strong>" + castPct + "%</strong> · claimed <strong>" +
          fmtPct(CL.sum.pct_claimed) + "</strong> · certified <strong>" + fmtPct(CL.sum.pct_certified) +
          "</strong></div>"
        : "";

      var err = CL.err
        ? '<div class="banner banner-red" style="margin-bottom:10px">Could not save: ' + escHtml(CL.err) + "</div>"
        : "";
      var ok = (!CL.err && CL.ok) ? UI.okBanner(CL.ok) : "";
      var newBtn = (CL.edit && CL.edit.mode === "new")
        ? newClaimForm()
        : '<div class="claim-actions" style="padding:0 0 10px">' +
          '<button type="button" data-action="new-claim-form">+ New claim</button></div>';

      el.innerHTML =
        err + ok + (CL.sum ? claimsSummaryCards(CL.sum) : "") + honesty + newBtn +
        '<h2 class="section-title">Claim register (' + CL.register.length + ")</h2>" +
        claimRegisterTable() + bqStatusBlock(CL.bq);
      updateLiveTotals(el);
    }

    // live per-line amount + claim total while typing in edit mode
    function updateLiveTotals(el) {
      el.querySelectorAll("table.claim-lines").forEach(function (tbl) {
        var totCell = tbl.querySelector(".claim-live-total");
        if (!totCell) return;
        var t = 0;
        tbl.querySelectorAll("input.qty").forEach(function (inp) {
          var rate = inp.getAttribute("data-rate");
          var amtCell = inp.closest("tr").querySelector(".line-amt");
          var v = inp.value === "" ? 0 : Number(inp.value);
          var amt = (rate === "" || rate === null) ? 0 : v * Number(rate);
          t += amt;
          if (amtCell) amtCell.textContent = inp.value === "" ? "—" : fmtRM(amt);
        });
        totCell.textContent = fmtRM(t);
      });
    }

    async function refreshClaims() {
      try { await fetchClaims(); } catch (e) { CL.err = (e && e.message) || String(e); }
      renderClaims();
    }

    // ---- write actions (each: try the database call, surface its error,
    //      re-fetch so every derived figure recomputes) ----
    function collectQtyChanges(el, blankIs) {
      var changes = [];
      el.querySelectorAll("table.claim-lines input.qty").forEach(function (inp) {
        var oldV = inp.getAttribute("data-old"), newV = inp.value;
        var oldN = oldV === "" ? blankIs : Number(oldV);
        var newN = newV === "" ? blankIs : Number(newV);
        if (oldN !== newN) changes.push({ item: inp.getAttribute("data-item"), qty: newN });
      });
      return changes;
    }

    async function actCreateClaim() {
      var period = document.getElementById("nc-period").value;
      try {
        var r = await Dash.createClaim(CL.projectId, {
          periodTo: period ? monthEnd(period) : null,
          submittedDate: document.getElementById("nc-submitted").value || null,
          retentionPct: document.getElementById("nc-ret").value,
          retentionCapPct: document.getElementById("nc-cap").value,
          remarks: document.getElementById("nc-remarks").value || null
        });
        CL.err = ""; CL.ok = "Claim #" + r.claim_no + " created — enter its quantities below.";
        CL.edit = { mode: "lines", claimNo: r.claim_no };   // straight into qty entry
        CL.open[r.claim_no] = true;
      } catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function actSaveLines(c) {
      var el = document.getElementById("claims");
      var changes = collectQtyChanges(el, 0);   // blank = 0 = not claimed
      try {
        for (var i = 0; i < changes.length; i++)
          await Dash.setClaimLine(c.claim_id, changes[i].item, changes[i].qty);
        CL.err = ""; CL.ok = "Claim #" + c.claim_no + " quantities saved."; CL.edit = null;
      } catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function actSaveCertify(c) {
      var el = document.getElementById("claims");
      var date = document.getElementById("certify-date").value || null;
      var changes = collectQtyChanges(el, null);   // blank = null = not certified
      try {
        for (var i = 0; i < changes.length; i++)
          await Dash.certifyClaimLine(c.claim_id, changes[i].item, changes[i].qty);
        await Dash.setClaimStatus(c.claim_id, "certified", date);
        CL.err = ""; CL.ok = "Claim #" + c.claim_no + " certified."; CL.edit = null;
      } catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function actSaveHeader(c) {
      var period = document.getElementById("cf-period").value;
      try {
        await Dash.updateClaim(c.claim_id, {
          periodTo: period ? monthEnd(period) : null,
          submittedDate: document.getElementById("cf-submitted").value || null,
          retentionPct: document.getElementById("cf-ret").value,
          retentionCapPct: document.getElementById("cf-cap").value,
          remarks: document.getElementById("cf-remarks").value || null
        });
        CL.err = ""; CL.ok = "Claim #" + c.claim_no + " info saved."; CL.edit = null;
      } catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function actStatus(c, status, date) {
      try {
        await Dash.setClaimStatus(c.claim_id, status, date);
        CL.err = "";
        CL.ok = "Claim #" + c.claim_no +
                (status === "paid" ? " marked paid." : " moved back to certified.");
      }
      catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function actDelete(c) {
      if (!window.confirm("Delete claim #" + c.claim_no + " and all its lines? This cannot be undone.")) return;
      try {
        await Dash.deleteClaim(c.claim_id);
        CL.err = ""; CL.ok = "Claim #" + c.claim_no + " deleted."; CL.edit = null;
        delete CL.open[c.claim_no];
      }
      catch (e) { CL.err = (e && e.message) || String(e); CL.ok = ""; }
      await refreshClaims();
    }

    async function onClaimsClick(ev) {
      var btn = ev.target.closest("button[data-action]");
      if (btn) {
        var act = btn.getAttribute("data-action");
        var c = btn.getAttribute("data-claim") ? claimByNo(btn.getAttribute("data-claim")) : null;
        if (act !== "cancel-edit") CL.ok = "";   // stale "saved" notes don't linger
        if (act === "new-claim-form")    { CL.edit = { mode: "new" }; renderClaims(); }
        else if (act === "cancel-edit")  { CL.edit = null; renderClaims(); }
        else if (act === "edit-lines")   { CL.edit = { mode: "lines",   claimNo: c.claim_no }; CL.open[c.claim_no] = true; renderClaims(); }
        else if (act === "certify")      { CL.edit = { mode: "certify", claimNo: c.claim_no }; CL.open[c.claim_no] = true; renderClaims(); }
        else if (act === "edit-header")  { CL.edit = { mode: "header",  claimNo: c.claim_no }; CL.open[c.claim_no] = true; renderClaims(); }
        else if (act === "create-claim") { await actCreateClaim(); }
        else if (act === "save-lines")   { await actSaveLines(c); }
        else if (act === "save-certify") { await actSaveCertify(c); }
        else if (act === "save-header")  { await actSaveHeader(c); }
        else if (act === "mark-paid")    { await actStatus(c, "paid", null); }
        else if (act === "unmark-paid")  { await actStatus(c, "certified", c.certified_date); }
        else if (act === "delete-claim") { await actDelete(c); }
        return;
      }
      var row = ev.target.closest("tr.claim-row");
      if (!row) return;
      var no = row.getAttribute("data-claim");
      CL.open[no] = !CL.open[no];
      renderClaims();
    }

    window.onShellReady = async function () {
      var projectId = new URLSearchParams(location.search).get("project");
      var titleEl = document.getElementById("claims-title");

      if (!projectId) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-amber">No project selected — open a project from the ' +
          '<a href="index.html">Overview</a> and use its claims link.</div>';
        return;
      }

      try {
        var projects = await Dash.getProjects();
        var p = projects.find(function (x) { return x.project_id === projectId; });
        if (!p) {
          titleEl.textContent = "";
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Project not found.</div>';
          return;
        }
        titleEl.textContent = p.project_code + " — " + (p.project_name || "");
        var subBits = [];
        if (p.client_name) subBits.push("Client: " + escHtml(p.client_name));
        subBits.push('<a href="project.html?project=' + projectId + '">&larr; back to project</a>');
        document.getElementById("claims-sub").innerHTML = subBits.join(" · ");

        CL.projectId = projectId; CL.p = p;
        await fetchClaims();
        renderClaims();

        var el = document.getElementById("claims");
        el.addEventListener("click", onClaimsClick);
        el.addEventListener("input", function (ev) {
          if (ev.target.classList && ev.target.classList.contains("qty")) updateLiveTotals(el);
        });
      } catch (e) {
        // shell PAGE_ACCESS already blocks other designations; this catches an
        // unlinked account or a database refusal — say so, don't render money.
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load claims: ' + escHtml((e && e.message) || e) + "</div>";
      }
    };
  </script>
</body>
</html>
