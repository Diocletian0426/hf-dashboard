<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Dashboard — Project</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="nav"></header>

  <main id="main">

    <!-- ================= PROJECT HUB (draft — adjust together) =================
         Reached by clicking a project card on the Overview. One page that
         answers "how is THIS site doing?" and links deeper:
           1. Header — code, name, status, client, dates, report health
           2. KPI cards — progress, cast, issues, tests overdue, machines, workers
           3. Progress by zone — all-zones bar + one thin bar per zone;
              zone names jump into the pile page at that zone
           4. 14-day production trend (this week vs last, daily bars)
           5. Management attention — ONE ranked exceptions panel:
              breakdowns, critical/high issues, test escalations,
              stale issues (7d no update), silent site, data gaps
           6. Machines on this site (last-known state)
         Reads: existing views + 0032 (supervisors, daily output). -->
    <div class="page-eyebrow">Project</div>
    <h1 id="project-title">Loading…</h1>
    <p id="project-sub" class="page-caption"></p>

    <div id="kpis" class="cards"></div>

    <div id="pile-strip"></div>

    <!-- Production trend (UX refresh round 3): responsive SVG with two
         stacked panels sharing one time axis — top: blue bars = metres bored
         (only reports carrying start/end depths) + green number = piles
         cast; bottom: orange line = diesel L on its own scale. Range
         controls: 7d / 14d / 28d / All time / custom; long ranges (and
         narrow phones) bucket to weekly bars. Preset ranges show a
         previous-equal-window comparison; tap a column to pin its numbers.
         Hidden when the project has no activity rows at all. -->
    <div id="trend"></div>

    <div id="sections"></div>

    <div id="error"></div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="dashboard-client.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>

  <script>
    // ---- shared helpers now live in ui.js (window.UI) — local aliases keep
    //      every call site below unchanged ----
    var esc = UI.esc, escHtml = UI.escHtml, dstr = UI.dstr, daysSince = UI.daysSince;
    var STAGES = UI.PILE_STAGES, stageOf = UI.stageOf, STAGE_COLORS = UI.STAGE_COLORS;

    // one segmented stage bar for any list of piles
    function stageBarHtml(list) {
      var counts = {};
      STAGES.forEach(function (s) { counts[s[0]] = 0; });
      list.forEach(function (r) { counts[stageOf(r.construction_status)]++; });
      var total = list.length;
      return STAGES.map(function (s) {
        var name = s[0], c = counts[name];
        if (!c) return "";
        var pct = Math.round(c * 100 / total);
        return '<span class="pipe-seg" style="flex-grow:' + c + ";background:" + STAGE_COLORS[name] +
               '" title="' + name + " — " + c + " pile" + (c === 1 ? "" : "s") + " (" + pct + '%)"></span>';
      }).join("");
    }

    // PROGRESS BY ZONE: all-zones bar + legend on top, then one thin bar per
    // zone (only when the project actually has 2+ zones). Zone names link
    // into the pile page, landing on that zone's block.
    function zoneProgress(piles, projectId) {
      if (!piles.length) return "";
      var counts = {};
      STAGES.forEach(function (s) { counts[s[0]] = 0; });
      piles.forEach(function (r) { counts[stageOf(r.construction_status)]++; });
      var keys = STAGES.map(function (s) {
        var name = s[0], c = counts[name];
        return '<span class="pipe-key' + (c ? "" : " zero") + '">' +
               '<i style="background:' + STAGE_COLORS[name] + '"></i>' + name + " <b>" + c + "</b></span>";
      }).join("");

      var zones = {};
      piles.forEach(function (r) { var z = r.zone || "Unzoned"; (zones[z] = zones[z] || []).push(r); });
      var zoneNames = Object.keys(zones).sort();
      var zoneRows = "";
      if (zoneNames.length > 1) {
        zoneRows = '<div class="zonebar-rows">' + zoneNames.map(function (z) {
          var zr = zones[z];
          var cast = zr.filter(function (r) {
            return r.construction_status === "cast_complete" || r.construction_status === "head_trimmed";
          }).length;
          return '<div class="zonebar-row">' +
                 '<a class="zonebar-label" title="Open pile records at ' + esc(z) + '" ' +
                 'href="piles.html?project=' + projectId + "&zone=" + encodeURIComponent(z) + '">' +
                 escHtml(z) + "</a>" +
                 '<span class="pipe-bar">' + stageBarHtml(zr) + "</span>" +
                 '<span class="zonebar-count">' + zr.length + " pile" + (zr.length === 1 ? "" : "s") +
                 " · " + cast + " cast</span></div>";
        }).join("") + "</div>";
      }

      return '<div class="pipe-card">' +
             '<div class="pipe-bar">' + stageBarHtml(piles) + "</div>" +
             '<div class="pipe-legend"><span class="pipe-total">' + piles.length + " piles</span>" + keys +
             '<a class="pipe-link" href="piles.html?project=' + projectId + '">Open pile records →</a></div>' +
             zoneRows + "</div>";
    }

    // ---- production trend (responsive; two stacked panels, one time axis) ----
    // TOP panel: blue bars = metres bored, green number = piles cast.
    // BOTTOM panel: orange line = diesel litres, on its own scale.
    // (The old chart put both measures on one plot with two y-scales — a
    // classic misread; separate panels keep each honest.)
    // Renders at the container's real pixel width so labels stay readable on
    // phones; re-renders on resize; tap/click a column pins its numbers to
    // the readout line under the chart.
    function buildTrendSvg(days, maxM, maxD, weekly, width, selIdx) {
      var W = Math.max(320, Math.floor(width));
      var L = 46, R = 10, T = 18;
      var ph1 = 108;                     // production panel height
      var base1 = T + ph1;
      var castY = base1 + 14;            // green cast numbers under the baseline
      var T2 = castY + 16;               // diesel panel top
      var ph2 = 52;
      var base2 = T2 + ph2;
      var H = base2 + 20;
      var pw = W - L - R, slot = pw / days.length;
      var parts = [];

      // panel captions + scale labels (left)
      parts.push('<text x="' + L + '" y="11" class="tx-axis">Metres bored' +
                 (weekly ? " / week" : " / day") + "</text>");
      parts.push('<text x="' + L + '" y="' + (T2 - 5) + '" class="tx-axis">Diesel L' +
                 (weekly ? " / week" : " / day") + "</text>");
      parts.push('<text x="' + (L - 5) + '" y="' + (T + 9) + '" text-anchor="end" class="tx-axis">' +
                 f1(maxM) + "</text>");
      parts.push('<text x="' + (L - 5) + '" y="' + base1 + '" text-anchor="end" class="tx-axis">0</text>');
      parts.push('<text x="' + (L - 5) + '" y="' + (T2 + 9) + '" text-anchor="end" class="tx-axis">' +
                 Math.round(maxD) + "</text>");
      parts.push('<text x="' + (L - 5) + '" y="' + base2 + '" text-anchor="end" class="tx-axis">0</text>');

      // tapped-column highlight (behind the marks)
      if (selIdx !== null && selIdx !== undefined && days[selIdx]) {
        parts.push('<rect x="' + (L + slot * selIdx).toFixed(1) + '" y="0" width="' + slot.toFixed(1) +
                   '" height="' + H + '" fill="#2563eb" opacity="0.08"/>');
      }

      // baselines
      parts.push('<line x1="' + L + '" y1="' + base1 + '" x2="' + (W - R) + '" y2="' + base1 +
                 '" stroke="#e4e8ee" stroke-width="1"/>');
      parts.push('<line x1="' + L + '" y1="' + base2 + '" x2="' + (W - R) + '" y2="' + base2 +
                 '" stroke="#e4e8ee" stroke-width="1"/>');

      // production: metres bars + cast numbers
      days.forEach(function (d, i) {
        var cx = L + slot * (i + 0.5);
        if (d.metres > 0) {
          var h = Math.max(3, d.metres / maxM * ph1);
          var bw = Math.min(26, slot * 0.55);
          parts.push('<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (base1 - h).toFixed(1) +
                     '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
                     '" rx="2" fill="#2a78d6"/>');
        }
        if (d.cast) {
          parts.push('<text x="' + cx.toFixed(1) + '" y="' + castY +
                     '" text-anchor="middle" class="tx-cast">' + d.cast + "</text>");
        }
      });

      // diesel line + dots (its own panel, its own scale)
      var pts = days.map(function (d, i) {
        return { x: L + slot * (i + 0.5), y: base2 - (d.diesel / maxD * ph2) };
      });
      parts.push('<polyline fill="none" stroke="#eb6834" stroke-width="2" points="' +
                 pts.map(function (pt) { return pt.x.toFixed(1) + "," + pt.y.toFixed(1); }).join(" ") + '"/>');
      pts.forEach(function (pt, i) {
        if (days[i].diesel > 0) {
          parts.push('<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) +
                     '" r="3" fill="#eb6834" stroke="#fff" stroke-width="1"/>');
        }
      });

      // date anchors: start · middle · end (deduped for tiny ranges)
      var anchorIdx = [0, Math.floor(days.length / 2), days.length - 1]
        .filter(function (v, i, arr) { return arr.indexOf(v) === i; });
      var anchors = [
        { x: L, a: "start" }, { x: L + pw / 2, a: "middle" }, { x: W - R, a: "end" }
      ];
      anchorIdx.forEach(function (idx, i) {
        var pos = anchors[anchorIdx.length === 1 ? 0 : (anchorIdx.length === 2 && i === 1 ? 2 : i)];
        parts.push('<text x="' + pos.x + '" y="' + (H - 4) + '" text-anchor="' + pos.a +
                   '" class="tx-axis">' + (weekly ? "wk " : "") + dstr(days[idx].date) + "</text>");
      });

      // hover/tap targets last (on top): whole column, native tooltip + index
      days.forEach(function (d, i) {
        parts.push('<rect data-idx="' + i + '" x="' + (L + slot * i).toFixed(1) +
                   '" y="0" width="' + slot.toFixed(1) +
                   '" height="' + H + '" fill="transparent"><title>' +
                   escHtml(colSummary(d, weekly)) + "</title></rect>");
      });

      return '<svg class="trend-svg" viewBox="0 0 ' + W + " " + H + '" role="img">' +
             parts.join("") + "</svg>";
    }

    // one column's numbers in words (tooltip + tap readout share it)
    function colSummary(d, weekly) {
      return (weekly ? "Week of " : "") + dstr(d.date) + " — " + f1(d.metres) + " m bored" +
             (d.boredOn ? " (" + d.boredOn + " pile" + (d.boredOn === 1 ? "" : "s") + ")" : "") +
             " · " + d.cast + " cast · " + Math.round(d.diesel) + " L diesel";
    }

    function addDays(dateStr, n) {
      var d = new Date(dateStr + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    var f1 = UI.f1;

    // range state: rows cached once, chart re-renders client-side.
    // _trendState remembers the current range so resize/tap can re-render it;
    // _trendSel is the tapped column (index into the rendered series).
    var _trendRows = null, _trendMin = null;
    var _trendState = null, _trendSel = null, _trendSeries = null, _trendWeekly = false;

    function trendSums(list) {
      return list.reduce(function (s, d) {
        return { cast: s.cast + d.cast, metres: s.metres + d.metres, diesel: s.diesel + d.diesel };
      }, { cast: 0, metres: 0, diesel: 0 });
    }

    function buildRangeDays(byDate, fromStr, toStr) {
      var days = [], cur = fromStr, guard = 0;
      while (cur <= toStr && guard++ < 4000) {
        var r = byDate[cur];
        days.push({
          date: cur,
          metres: r ? Number(r.metres_bored) || 0 : 0,
          cast: r ? Number(r.piles_cast) || 0 : 0,
          boredOn: r ? Number(r.piles_bored_on) || 0 : 0,
          diesel: r ? Number(r.diesel_l) || 0 : 0
        });
        cur = addDays(cur, 1);
      }
      return days;
    }

    // ranges longer than ~2 months read as slivers day-by-day -> weekly bars
    function weekStartOf(dateStr) {
      var d = new Date(dateStr + "T00:00:00Z");
      return addDays(dateStr, -((d.getUTCDay() + 6) % 7));   // back to Monday
    }
    function bucketWeekly(days) {
      var map = {}, order = [];
      days.forEach(function (d) {
        var wk = weekStartOf(d.date);
        if (!map[wk]) {
          map[wk] = { date: wk, metres: 0, cast: 0, boredOn: 0, diesel: 0 };
          order.push(wk);
        }
        map[wk].metres += d.metres; map[wk].cast += d.cast;
        map[wk].boredOn += d.boredOn; map[wk].diesel += d.diesel;
      });
      return order.map(function (k) { return map[k]; });
    }

    function renderTrendBody(mode, from, to) {
      _trendState = { mode: mode, from: from, to: to };
      var byDate = {};
      _trendRows.forEach(function (r) { byDate[r.log_date] = r; });
      var today = Dash.todayKL();
      var fromStr, toStr, label;
      if (mode === "all") { fromStr = _trendMin; toStr = today; label = "All time"; }
      else if (mode === "custom") { fromStr = from; toStr = to; label = dstr(from) + " → " + dstr(to); }
      else {
        var n = parseInt(mode, 10);
        fromStr = addDays(today, -(n - 1)); toStr = today; label = "Last " + n + " days";
      }

      var days = buildRangeDays(byDate, fromStr, toStr);
      // real rendering width: bars thinner than ~12px read as slivers, so
      // narrow screens switch to weekly buckets sooner than wide ones
      var bodyEl = document.getElementById("trend-body");
      var width = Math.max(320, bodyEl.clientWidth || 660);
      var weekly = days.length > Math.max(30, Math.floor((width - 56) / 12));
      var series = weekly ? bucketWeekly(days) : days;
      _trendSeries = series; _trendWeekly = weekly;
      if (_trendSel !== null && (_trendSel < 0 || _trendSel >= series.length)) _trendSel = null;
      var tot = trendSums(days);

      var head = "<strong>" + label + ": " + tot.cast + " pile" + (tot.cast === 1 ? "" : "s") +
                 " cast · " + f1(tot.metres) + " m bored · " + Math.round(tot.diesel) + " L diesel</strong>";

      // previous equal window comparison — presets only (meaningless for all/custom)
      var compare = "";
      if (mode !== "all" && mode !== "custom") {
        var n2 = parseInt(mode, 10);
        var pv = trendSums(buildRangeDays(byDate, addDays(fromStr, -n2), addDays(fromStr, -1)));
        var deltaBits = [
          (tot.cast === pv.cast ? "=" : tot.cast > pv.cast ? "↑" : "↓") + " casts " +
            (tot.cast - pv.cast >= 0 ? "+" : "") + (tot.cast - pv.cast),
          (tot.metres === pv.metres ? "=" : tot.metres > pv.metres ? "↑" : "↓") + " metres " +
            (tot.metres - pv.metres >= 0 ? "+" : "") + f1(tot.metres - pv.metres),
          (tot.diesel === pv.diesel ? "=" : tot.diesel > pv.diesel ? "↑" : "↓") + " diesel " +
            (tot.diesel - pv.diesel >= 0 ? "+" : "") + Math.round(tot.diesel - pv.diesel) + " L"
        ];
        compare = '<span class="trend-compare">previous ' + n2 + "d: " + pv.cast + " cast · " +
                  f1(pv.metres) + " m · " + Math.round(pv.diesel) + " L · " +
                  deltaBits.join(" · ") + "</span>";
      }

      var anything = days.some(function (d) {
        return d.metres > 0 || d.cast > 0 || d.boredOn > 0 || d.diesel > 0;
      });
      var body;
      if (!anything) {
        body = '<div class="muted-line" style="margin-top:10px">No reported activity in this period.</div>';
      } else {
        var maxM = Math.max.apply(null, series.map(function (d) { return d.metres; }).concat([1]));
        var maxD = Math.max.apply(null, series.map(function (d) { return d.diesel; }).concat([1]));
        body = buildTrendSvg(series, maxM, maxD, weekly, width, _trendSel) +
               '<div id="trend-readout" class="pipe-note">' + escHtml(trendReadout()) + "</div>" +
               '<div class="trend-castnote"><i class="key-metres"></i>bars = metres bored' +
               ' <i class="key-cast"></i>number = piles cast' +
               ' <i class="key-diesel"></i>bottom line = diesel' +
               (weekly ? " (weekly buckets — long range)" : "") + "</div>" +
               '<div class="pipe-note">metres count only the reports that included start/end depths — ' +
               "quiet days may still have had boring; diesel comes from the nightly machine reports; " +
               "bars split into soil/rock once reports tag rock coring separately</div>";
      }
      bodyEl.innerHTML =
        '<div class="trend-head">' + head + compare + "</div>" + body;
    }

    function trendReadout() {
      if (_trendSel !== null && _trendSeries && _trendSeries[_trendSel])
        return colSummary(_trendSeries[_trendSel], _trendWeekly);
      return "Tap or hover a column for that " + (_trendWeekly ? "week" : "day") + "'s exact numbers.";
    }

    function initTrend(rows) {
      var el = document.getElementById("trend");
      if (!rows.length) { el.innerHTML = ""; return; }
      _trendRows = rows;
      _trendMin = rows.reduce(function (m, r) {
        return (!m || r.log_date < m) ? r.log_date : m;
      }, null);

      el.innerHTML =
        '<div class="pipe-card">' +
        '<div class="trend-controls">' +
        '<button type="button" data-range="7">7d</button>' +
        '<button type="button" data-range="14" class="active">14d</button>' +
        '<button type="button" data-range="28">28d</button>' +
        '<button type="button" data-range="all">All time</button>' +
        '<span class="trend-custom">from <input type="date" id="trend-from" value="' + _trendMin + '">' +
        ' to <input type="date" id="trend-to" value="' + Dash.todayKL() + '">' +
        ' <button type="button" id="trend-apply">Apply</button></span>' +
        "</div>" +
        '<div id="trend-body"></div></div>';

      el.addEventListener("click", function (ev) {
        // tap a column -> pin its numbers to the readout line (tap again to unpin)
        var col = ev.target.closest ? ev.target.closest("rect[data-idx]") : null;
        if (col) {
          var idx = Number(col.getAttribute("data-idx"));
          _trendSel = (_trendSel === idx) ? null : idx;
          renderTrendBody(_trendState.mode, _trendState.from, _trendState.to);
          return;
        }
        var b = ev.target.closest("button");
        if (!b) return;
        if (b.id === "trend-apply") {
          var from = document.getElementById("trend-from").value;
          var to = document.getElementById("trend-to").value;
          if (!from || !to || from > to) return;
          el.querySelectorAll(".trend-controls button").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          _trendSel = null;
          renderTrendBody("custom", from, to);
        } else if (b.getAttribute("data-range")) {
          el.querySelectorAll(".trend-controls button").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          _trendSel = null;
          renderTrendBody(b.getAttribute("data-range"));
        }
      });

      // phones rotate, windows resize — re-render at the new width
      var resizeTimer = null;
      window.addEventListener("resize", function () {
        if (!_trendState) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          renderTrendBody(_trendState.mode, _trendState.from, _trendState.to);
        }, 150);
      });

      renderTrendBody("14");
    }

    // ---- MANAGEMENT ATTENTION (round D) ----
    // One ranked panel replacing the separate issues + tests sections:
    // exceptions only, worst first. Everything else lives in the drill-downs.
    function attLine(badgeCls, badgeText, mainHtml, metaHtml) {
      return '<div class="pc-issue"><span class="badge ' + badgeCls + '">' + badgeText + "</span> " +
             mainHtml + (metaHtml ? '<div class="pc-meta">' + metaHtml + "</div>" : "") + "</div>";
    }

    function attentionSection(p, openIssues, machines, tb, piles) {
      var items = [];

      // 1) machine breakdown
      machines.filter(function (m) { return m.last_status === "breakdown"; }).forEach(function (m) {
        items.push({ rank: 1, html: attLine("badge-critical", "Breakdown",
          "<strong>" + escHtml(m.machine_code) + "</strong> " +
          escHtml(UI.label(m.machine_type)),
          "last report " + (m.last_status_date || "—")) });
      });

      // 2) critical / high open issues
      openIssues.filter(function (i) {
        return i.priority === "critical" || i.priority === "high";
      }).forEach(function (i) {
        var meta = [(i.days_since_raised || 0) + "d open"];
        if (i.assigned_to_name_resolved) meta.push("PIC: " + escHtml(i.assigned_to_name_resolved));
        if (i.latest_action) meta.push("latest: " + escHtml(i.latest_action));
        items.push({ rank: 2, html: attLine(
          i.priority === "critical" ? "badge-critical" : "badge-high", UI.label(i.priority),
          "<strong>#" + i.issue_number + "</strong> " + escHtml(i.title || ""), meta.join(" · ")) });
      });

      // 3) test date missed  4) not booked past grace  5) to arrange
      tb.missed.forEach(function (t) {
        items.push({ rank: 3, html: attLine("badge-critical", "test date missed",
          "<strong>" + escHtml(t.pile_mark_no || "") + "</strong> " + escHtml(t.test_code || ""),
          "booked " + dstr(t.scheduled_test_date) + " · " + (t.overdue_days || 0) + "d late") });
      });
      tb.notBooked.forEach(function (t) {
        items.push({ rank: 4, html: attLine("badge-critical", "not booked",
          "<strong>" + escHtml(t.pile_mark_no || "") + "</strong> " + escHtml(t.test_code || ""),
          "curing done " + (-t.days_until_eligible) + "d ago") });
      });
      tb.toArrange.forEach(function (t) {
        items.push({ rank: 5, html: attLine("badge-pending", "to arrange",
          "<strong>" + escHtml(t.pile_mark_no || "") + "</strong> " + escHtml(t.test_code || ""),
          "curing done " + (-t.days_until_eligible) + "d ago") });
      });

      // 6) other open issues with no movement for 7+ days
      openIssues.filter(function (i) {
        if (i.priority === "critical" || i.priority === "high") return false;
        var last = i.latest_action_date ? String(i.latest_action_date).slice(0, 10) : i.raised_date;
        var d = daysSince(last);
        return d !== null && d >= 7;
      }).forEach(function (i) {
        var last = i.latest_action_date ? String(i.latest_action_date).slice(0, 10) : i.raised_date;
        items.push({ rank: 6, html: attLine("badge-pending", "no update " + daysSince(last) + "d",
          "<strong>#" + i.issue_number + "</strong> " + escHtml(i.title || ""),
          escHtml(UI.label(i.priority)) + " · raised " + dstr(i.raised_date)) });
      });

      // 7) site silent (active projects only — completed sites are quiet by nature)
      if (p.project_status === "active") {
        var silentDays = daysSince(p.last_report_date);
        if (!p.last_report_date) {
          items.push({ rank: 7, html: attLine("badge-pending", "site silent",
            "No site reports received yet", "") });
        } else if (silentDays >= 2) {
          items.push({ rank: 7, html: attLine("badge-pending", "site silent",
            "No site report for " + silentDays + " days", "last " + dstr(p.last_report_date)) });
        }
      }

      // 8) data gaps — grouped into one low-severity line
      var gaps = [];
      var castNoDate = piles.filter(function (r) {
        return (r.construction_status === "cast_complete" || r.construction_status === "head_trimmed") &&
               !r.cast_date;
      }).map(function (r) { return r.pile_mark_no; });
      if (castNoDate.length) {
        gaps.push("cast without cast date: " +
          castNoDate.slice(0, 5).join(", ") +
          (castNoDate.length > 5 ? " +" + (castNoDate.length - 5) + " more" : ""));
      }
      var steelMissing = piles.filter(function (r) {
        return r.design_steel_total_t === null || r.design_steel_total_t === undefined;
      }).length;
      if (steelMissing) gaps.push(steelMissing + " pile design" + (steelMissing === 1 ? "" : "s") +
                                  " missing reinforcement spec");
      var neverReported = machines.filter(function (m) { return !m.last_status; })
        .map(function (m) { return m.machine_code; });
      if (neverReported.length) gaps.push("machine never reported: " + neverReported.join(", "));
      if (gaps.length) {
        items.push({ rank: 8, html: attLine("badge-gray", "data gaps", gaps.map(escHtml).join(" · "), "") });
      }

      items.sort(function (a, b) { return a.rank - b.rank; });
      var body = items.length
        ? items.map(function (it) { return it.html; }).join("")
        : '<div class="muted-line">&#10003; Nothing needs management attention.</div>';
      return '<details class="zone chase-panel" open>' +
             '<summary><span class="zone-name">Management attention</span>' +
             '<span class="zone-count">' + items.length + " item" + (items.length === 1 ? "" : "s") +
             "</span></summary>" +
             '<div class="chase-body">' + body + "</div></details>";
    }

    // ---- section: machines on this site ----
    function machinesSection(machines) {
      var body;
      if (!machines.length) {
        body = '<div class="muted-line">No machines assigned to this site.</div>';
      } else {
        var rows = machines.map(function (m) {
          var stateCls = m.last_status === "operating" ? "approved"
                       : m.last_status === "breakdown" ? "breakdown" : "gray";
          var d = daysSince(m.last_status_date);
          var state = m.last_status
            ? UI.badge(m.last_status, "badge-" + stateCls) +
              ' <span class="' + (d !== null && d >= 3 ? "stale-warn" : "muted") + '">' + (m.last_status_date || "") + "</span>"
            : '<span class="muted-line">never reported</span>';
          return "<tr>" +
            UI.td("Machine", "<strong>" + escHtml(m.machine_code) + "</strong>") +
            UI.td("Type", escHtml(UI.label(m.machine_type))) +
            UI.td("Last report", state) +
            UI.td("Open issues", String(m.open_issues || 0), "num" + (m.open_issues > 0 ? " bold" : "")) +
          "</tr>";
        }).join("");
        body = '<div class="table-wrap table-stack"><table>' +
               "<thead><tr><th>Machine</th><th>Type</th><th>Last report</th>" +
               '<th class="num">Open issues</th></tr></thead>' +
               "<tbody>" + rows + "</tbody></table></div>";
      }
      return '<h2 class="section-title">Machines on site (' + machines.length + ") " +
             '<a class="section-link" href="machines.html">machines page →</a></h2>' + body;
    }

    // ---- tests: pipeline buckets — canonical copy lives in ui.js ----
    var testBuckets = UI.testBuckets;

    // (the old per-section issue + test lists were absorbed into the
    //  management-attention panel above; curing/booked pipeline counts
    //  live in the Tests KPI card, full detail on the pile page)

    // ---- CLAIMS & CERTIFICATION (MONEY, management/office only — VIEW ONLY) ----
    // Double-gated: rendered only when the profile designation allows it AND
    // the database call succeeds (the DB refuses everyone else with
    // 'not_authorised'). Any failure = the section simply never appears —
    // no empty box, no error banner.
    // The hub shows claims; WORKING them (create / edit lines / certify /
    // status / delete latest) lives on the dedicated claims.html page,
    // linked below — owner decision 2026-07-16.
    var fmtRM = UI.fmtRM, fmtPct = UI.fmtPct, mstr = UI.mstr;
    var CLAIM_BADGE = { submitted: "badge-pending", certified: "badge-approved", paid: "badge-gray" };

    // shared claims state — survives re-renders (open/closed claim rows)
    var CL = {
      projectId: null, p: null, sum: null, register: [], bq: [],
      linesByClaim: {}, open: {}
    };

    function claimsSummaryCards(sum) {
      var vo = Number(sum.contract_sum_vo) || 0;
      var gap = Number(sum.claimed_not_certified) || 0;
      var cards = [
        ["Contract sum" + (vo > 0 ? " · incl. VO " + fmtRM(vo) : ""), fmtRM(sum.contract_sum), ""],
        ["Claimed to date · " + fmtPct(sum.pct_claimed), fmtRM(sum.claimed_to_date), ""],
        ["Certified to date · " + fmtPct(sum.pct_certified), fmtRM(sum.certified_to_date), ""],
        ["Retention held", fmtRM(sum.retention_held), ""],
        ["Claimed, not certified", fmtRM(sum.claimed_not_certified), gap > 0 ? " stale-warn" : ""]
      ];
      return '<div class="cards">' + cards.map(function (c) {
        return '<div class="card"><div class="label">' + c[0] + "</div>" +
               '<div class="value money' + c[2] + '">' + c[1] + "</div></div>";
      }).join("") + "</div>";
    }

    // the lines INSIDE one claim, laid out like page 2 of the paper IPC:
    // PREVIOUS qty | THIS CLAIM qty | CUMULATIVE qty per BQ item
    function claimLinesTable(lines) {
      if (!lines.length) {
        return '<div class="muted-line" style="padding:8px 12px">No lines recorded for this claim.</div>';
      }
      var certAny = false, totalThis = 0, totalCert = 0;
      var rows = lines.map(function (l) {
        totalThis += Number(l.amount_claimed) || 0;
        totalCert += Number(l.amount_certified) || 0;
        if (l.qty_certified !== null) certAny = true;
        return "<tr>" +
          "<td>" + escHtml(l.item_code || "") + "</td>" +
          '<td class="wrap">' + escHtml(l.description) + "</td>" +
          "<td>" + escHtml(l.unit || "") + "</td>" +
          '<td class="num">' + (l.rate === null ? "—" : fmtRM(l.rate)) + "</td>" +
          '<td class="num">' + (Number(l.prev_qty_claimed) ? l.prev_qty_claimed : "—") + "</td>" +
          '<td class="num"><strong>' + l.qty_claimed + "</strong></td>" +
          '<td class="num">' + l.cum_qty_claimed + "</td>" +
          '<td class="num">' + fmtRM(l.amount_claimed) + "</td>" +
          '<td class="num">' + (l.qty_certified === null ? "—" : l.qty_certified) + "</td>" +
        "</tr>";
      }).join("");
      return '<table class="claim-lines">' +
             "<thead><tr><th>#</th><th>Description</th><th>Unit</th>" +
             '<th class="num">Rate</th><th class="num">Previous</th>' +
             '<th class="num">This claim</th><th class="num">Cumulative</th>' +
             '<th class="num">Amount</th><th class="num">Certified qty</th></tr></thead>' +
             "<tbody>" + rows + "</tbody>" +
             '<tfoot><tr><td colspan="7">This claim total</td>' +
             '<td class="num">' + fmtRM(totalThis) + "</td>" +
             '<td class="num">' + (certAny ? fmtRM(totalCert) : "—") + "</td></tr></tfoot></table>";
    }

    function claimRegisterTable() {
      if (!CL.register.length) {
        return '<div class="muted-line">No claims submitted yet.</div>';
      }
      var rows = CL.register.map(function (c) {
        var isOpen = !!CL.open[c.claim_no];
        var main = '<tr class="claim-row" data-claim="' + c.claim_no +
          '" title="Click to open this claim' + "'" + 's lines">' +
          '<td><span class="claim-caret">' + (isOpen ? "&#9662;" : "&#9656;") + "</span> <strong>" + c.claim_no + "</strong></td>" +
          "<td>" + mstr(c.period_to) + "</td>" +
          '<td class="num">' + fmtRM(c.claimed_amount) + "</td>" +
          '<td class="num">' + fmtRM(c.certified_amount) + "</td>" +
          '<td class="num">' + fmtPct(c.pct_certified_vs_claimed) + "</td>" +
          '<td><span class="badge ' + (CLAIM_BADGE[c.status] || "badge-gray") + '">' +
            escHtml(c.status) + "</span></td>" +
          "<td>" + dstr(c.submitted_date) + "</td>" +
          "<td>" + dstr(c.certified_date) + "</td>" +
        "</tr>";
        var detail = '<tr class="claim-lines-row"' + (isOpen ? "" : ' style="display:none"') +
                     '><td colspan="8">' + claimLinesTable(CL.linesByClaim[c.claim_no] || []) + "</td></tr>";
        return main + detail;
      }).join("");
      return '<div class="table-wrap"><table>' +
             "<thead><tr><th>#</th><th>Period</th>" +
             '<th class="num">Claimed</th><th class="num">Certified</th>' +
             '<th class="num">% certified</th><th>Status</th>' +
             "<th>Submitted</th><th>Certified on</th></tr></thead>" +
             "<tbody>" + rows + "</tbody></table></div>";
    }

    function bqStatusBlock(bq) {
      if (!bq.length) return "";
      var rows = bq.map(function (b) {
        var desc = escHtml(b.description) +
          (b.remarks ? ' <span class="muted-line">(' + escHtml(b.remarks) + ")</span>" : "") +
          (b.is_variation ? ' <span class="badge badge-anomaly">VO</span>' : "");
        return "<tr>" +
          "<td>" + escHtml(b.item_code || "") + "</td>" +
          '<td class="wrap">' + desc + "</td>" +
          "<td>" + escHtml(b.unit || "") + "</td>" +
          '<td class="num">' + (b.rate === null ? "—" : fmtRM(b.rate)) + "</td>" +
          '<td class="num">' + b.contract_qty + "</td>" +
          '<td class="num">' + fmtRM(b.amount) + "</td>" +
          '<td class="num">' + b.cum_qty_claimed + "</td>" +
          '<td class="num">' + (b.cum_qty_certified === null ? "—" : b.cum_qty_certified) + "</td>" +
          '<td class="num">' + fmtPct(b.pct_certified) + "</td>" +
        "</tr>";
      }).join("");
      // description wraps (td.wrap) so the whole table fits on screen —
      // item and rate visible together, no left/right scrolling
      return '<details class="zone"><summary><span class="zone-name">Bill of Quantities — item status</span>' +
             '<span class="zone-count">' + bq.length + " items · rates visible</span></summary>" +
             '<div class="table-wrap"><table>' +
             "<thead><tr><th>#</th><th>Description</th><th>Unit</th>" +
             '<th class="num">Rate</th><th class="num">Contract</th><th class="num">Amount</th>' +
             '<th class="num">Claimed</th><th class="num">Certified</th>' +
             '<th class="num">% cert</th></tr></thead>' +
             "<tbody>" + rows + "</tbody></table></div></details>";
    }

    async function fetchClaims() {
      var res = await Promise.all([
        Dash.getClaimSummaries(),
        Dash.getClaimRegister(CL.projectId),
        Dash.getBqStatus(CL.projectId),
        Dash.getClaimLines(CL.projectId)
      ]);
      CL.sum = res[0].find(function (s) { return s.project_id === CL.projectId; }) || null;
      CL.register = res[1];
      CL.bq = res[2];
      CL.linesByClaim = {};
      res[3].forEach(function (l) {
        (CL.linesByClaim[l.claim_no] = CL.linesByClaim[l.claim_no] || []).push(l);
      });
    }

    function renderClaims() {
      var el = document.getElementById("claims");
      if (!el) return;

      if (!CL.sum && !CL.register.length) {
        el.innerHTML =
          '<details class="zone" open><summary><span class="zone-name">Claims &amp; certification</span>' +
          '<span class="zone-count">management/office only</span></summary>' +
          '<div class="muted-line" style="margin-top:8px">No BQ entered for this project yet — ' +
          "money figures appear once its Bill of Quantities is in the system (BQ entry stays a working-session job).</div></details>";
        return;
      }

      // honesty pairing: physical progress vs money progress, side by side
      var castPct = Math.max(0, Math.min(100, Number(CL.p.progress_pct) || 0));
      var honesty = CL.sum
        ? '<div class="muted-line" style="margin:2px 0 12px">' +
          "Physical vs money: piles cast <strong>" + castPct + "%</strong> · claimed <strong>" +
          fmtPct(CL.sum.pct_claimed) + "</strong> · certified <strong>" + fmtPct(CL.sum.pct_certified) +
          "</strong>" + (CL.sum.last_claim_no
            ? ' <span class="trend-compare">— last claim #' + CL.sum.last_claim_no + " (" +
              escHtml(CL.sum.last_claim_status || "") +
              (CL.sum.last_claim_date ? ", " + dstr(CL.sum.last_claim_date) : "") + ")</span>"
            : "") + "</div>"
        : "";

      // working the claims (create / edit / certify) happens on claims.html
      var pageLink = '<div style="margin:0 0 10px">' +
        '<a class="section-link" style="margin-left:0" href="claims.html?project=' + CL.projectId + '">' +
        "Open claims page (office entry) &rarr;</a></div>";

      el.innerHTML =
        '<details class="zone" open><summary><span class="zone-name">Claims &amp; certification</span>' +
        '<span class="zone-count">' + CL.register.length + " claim" + (CL.register.length === 1 ? "" : "s") +
        " · management/office only</span></summary>" +
        '<div style="margin-top:10px">' +
        (CL.sum ? claimsSummaryCards(CL.sum) : "") + honesty + pageLink +
        claimRegisterTable() + bqStatusBlock(CL.bq) +
        "</div></details>";
    }

    // press a claim row -> its lines fold open underneath (read-only here)
    function onClaimsClick(ev) {
      var row = ev.target.closest("tr.claim-row");
      if (!row) return;
      var no = row.getAttribute("data-claim");
      CL.open[no] = !CL.open[no];
      renderClaims();
    }

    async function loadClaims(projectId, p) {
      var profile = await Dash.getMyProfile();
      if (!profile ||
          (profile.designation !== "management" && profile.designation !== "office")) return;
      CL.projectId = projectId; CL.p = p;
      try { await fetchClaims(); } catch (e) { return; }   // DB said no — section stays absent
      renderClaims();
      document.getElementById("claims").addEventListener("click", onClaimsClick);
    }

    window.onShellReady = async function () {
      var projectId = new URLSearchParams(location.search).get("project");
      var titleEl = document.getElementById("project-title");

      if (!projectId) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-amber">No project selected — open a project from the ' +
          '<a href="index.html">Overview</a>.</div>';
        return;
      }

      try {
        var results = await Promise.all([
          Dash.getProjects(),          // all statuses, so completed sites open too
          Dash.getPileRegister(projectId),
          Dash.getIssues("all"),
          Dash.getMachines(),
          Dash.getTests(true),
          Dash.getProjectSupervisors(),
          Dash.getProjectDailyOutput()
        ]);
        var p = results[0].find(function (x) { return x.project_id === projectId; });
        if (!p) {
          titleEl.textContent = "";
          document.getElementById("error").innerHTML =
            '<div class="banner banner-red">Project not found.</div>';
          return;
        }
        var piles = results[1];
        var openIssues = results[2].filter(function (i) {
          return i.project_code === p.project_code &&
                 (i.status === "open" || i.status === "in_progress");
        });
        var machines = results[3].filter(function (m) { return m.current_site === p.project_code; });
        var tests = results[4].filter(function (t) { return t.project_code === p.project_code; });

        // ---- header ----
        titleEl.textContent = p.project_code + " — " + (p.project_name || "");
        var subBits = [UI.badge(p.project_status,
          "badge-" + (p.project_status === "active" ? "approved" : "gray"))];
        if (p.client_name) subBits.push("Client: " + escHtml(p.client_name));
        var supRow = results[5].find(function (s) { return s.project_id === projectId; });
        if (supRow && supRow.supervisors) subBits.push("Supervisor: " + escHtml(supRow.supervisors));
        if (p.start_date) subBits.push(dstr(p.start_date) + " → " + dstr(p.target_end_date));
        if (p.days_remaining !== null && p.days_remaining !== undefined)
          subBits.push(p.days_remaining < 0
            ? '<span class="stale-warn">' + Math.abs(p.days_remaining) + " days over target</span>"
            : p.days_remaining + " days to target");
        var health = p.last_report_date
          ? "last report " + p.last_report_date +
            ((p.piles_bored_on_last_report || p.piles_cast_on_last_report)
              ? " (bored " + (p.piles_bored_on_last_report || 0) + " · cast " + (p.piles_cast_on_last_report || 0) + ")"
              : "")
          : "no site reports yet";
        subBits.push(health);
        document.getElementById("project-sub").innerHTML = subBits.join(" · ");

        // ---- KPI cards (6, decision-focused) ----
        var total = p.total_piles_planned || p.total_piles_registered || 0;
        var pct = Math.max(0, Math.min(100, Number(p.progress_pct) || 0));

        var crit = p.critical_open_issues || 0;
        var oldestOpen = openIssues.reduce(function (mx, i) {
          return Math.max(mx, i.days_since_raised || 0);
        }, 0);

        // test pipeline buckets (curing / to arrange / booked / late)
        var tb = testBuckets(tests);
        var testsNeedAction = tb.missed.length + tb.notBooked.length;

        var opCount = machines.filter(function (m) { return m.last_status === "operating"; }).length;
        var brkCount = machines.filter(function (m) { return m.last_status === "breakdown"; }).length;

        var overTarget = (p.days_remaining !== null && p.days_remaining !== undefined && p.days_remaining < 0);
        var kpis = [
          ["Piles cast · " + pct + "%", (p.piles_completed || 0) + " / " + total, false],
          ["Open issues" + (crit ? " · " + crit + " critical" : "") +
             (oldestOpen ? " · oldest " + oldestOpen + "d" : ""),
           openIssues.length, crit > 0],
          ["Tests need action · " + tb.curing.length + " curing · " +
             tb.toArrange.length + " to arrange · " + tb.booked.length + " booked",
           testsNeedAction, testsNeedAction > 0],
          ["Machines operating · of " + machines.length + " on site" +
             (brkCount ? " · " + brkCount + " breakdown" : ""),
           opCount, brkCount > 0],
          ["Workers reported (site reports)", p.workers_assigned || 0, false],
          [overTarget ? "Days OVER target" : "Days to target",
           (p.days_remaining === null || p.days_remaining === undefined) ? "—" : Math.abs(p.days_remaining),
           overTarget]
        ];
        document.getElementById("kpis").innerHTML = kpis.map(function (k) {
          return '<div class="card' + (k[2] ? " alert" : "") + '">' +
                 '<div class="label">' + k[0] + "</div>" +
                 '<div class="value">' + k[1] + "</div></div>";
        }).join("");

        // ---- progress by zone + trend + sections ----
        document.getElementById("pile-strip").innerHTML = zoneProgress(piles, projectId);
        var outputRows = results[6].filter(function (r) { return r.project_id === projectId; });
        initTrend(outputRows);
        document.getElementById("sections").innerHTML =
          attentionSection(p, openIssues, machines, tb, piles) +
          '<div id="claims"></div>' +
          machinesSection(machines);

        // MONEY loads separately after the page is up: only management/office
        // ever see it, and any refusal/failure leaves the page untouched.
        loadClaims(projectId, p);
      } catch (e) {
        titleEl.textContent = "";
        document.getElementById("error").innerHTML =
          '<div class="banner banner-red">Could not load: ' + (e.message || e) + "</div>";
      }
    };
  </script>
</body>
</html>
